[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Duck Toolbox — a GPUI desktop UI shell built on gpui-kit (gpui-component)."

# 依赖版本与 gpui-kit 发布时锁定的快照严格对应（gpui-component 0.7.1 → gpui-pre 0.3.8）。
# 升级任一 crate 时必须同步 gpui-component 的 `=` 约束，否则 GPUI 核心与组件层 API 会错配。
[workspace.dependencies]
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = [
    "font-kit",
    "x11",
    "wayland",
    "runtime_shaders",
] }
# ⚠️ `=` 不是可选的：这层是**快照对齐**。用 `^`（默认）时，`cargo update` 会把
# gpui-component 悄悄抬到 0.7.2，而它要求 `gpui-base ^0.7.2`，于是 `[patch.crates-io]`
# 里 0.7.1 的 vendor 分叉**整个失效**（Cargo 只报 `[[patch.unused]]` 一行警告）——
# 邮件正文内联 CSS 补丁与文本选中的引擎修复会一起静默丢掉。5d4011d 就是这么丢的。
gpui-base = "=0.7.1"
gpui-component = { version = "=0.7.1", features = ["tree-sitter-sql"] }
gpui-component-assets = { package = "gpui-kit-assets", version = "=0.7.1" }

duck-theme = { path = "crates/duck-theme" }
duck-components = { path = "crates/duck-components" }
duck-shell = { path = "crates/duck-shell" }
duck-platform = { path = "crates/duck-platform" }
duck-store = { path = "crates/duck-store" }
duck-command = { path = "crates/duck-command" }
duck-tools = { path = "crates/duck-tools" }
duck-update = { path = "crates/duck-update" }
duck-plugin = { path = "crates/duck-plugin" }
duck-plugin-js = { path = "crates/duck-plugin-js" }
duck-plugin-process = { path = "crates/duck-plugin-process" }
duck-sql-core = { path = "crates/duck-sql-core" }
# 上线包合并族的核心逻辑（`duck.merge.*`）：参考仓 `extract_by_manifest` /
# 后续 `sp_merge` / `non_sp_merge` / `ifms6_merge` 的复刻件都落在这里。
duck-merge-core = { path = "crates/duck-merge-core" }
# Java `class` 解析与版本提取（`duck-merge-core` 判「同名文件留哪份」要用，
# 将来的 class/jar 比对与反编译工具共用同一份解析器）。
duck-classfile = { path = "crates/duck-classfile" }
duck-plugin-registry = { path = "crates/duck-plugin-registry" }
duck-db = { path = "crates/duck-db" }
# 驱动商店内核（crates/duck-drivers，docs 见 crate 文档）：驱动目录 + 远端注册表 +
# 下载 / 校验 / 安装 / 卸载 + 托管 JRE。零 gpui、零 tokio 外泄。
# `duck-db` 与 `duck-app` 都依赖它（前者要启动描述，后者是商店界面）。
duck-drivers = { path = "crates/duck-drivers" }
# 驱动**子进程**运行时（crates/duck-db-agent）：JSON-RPC 2.0 over stdio（换行分帧）、
# 按 `id` 对账、超时与「进程没了」都要能立刻说清。零 gpui、零 tokio、全阻塞。
# `duck-db` 拿 duck-drivers 的 `LaunchSpec` 拼出要跑的命令，交给它去说话。
duck-db-agent = { path = "crates/duck-db-agent" }
duck-redis = { path = "crates/duck-redis" }
duck-ai = { path = "crates/duck-ai" }
duck-term = { path = "crates/duck-term" }
duck-ssh = { path = "crates/duck-ssh" }
duck-mail = { path = "crates/duck-mail" }
# 项目管理内核（crates/duck-project，docs/projects-design.md）：自管 SQLite、零 gpui、
# 全同步。依赖全部已在图内（rusqlite 由 duck-store / duck-db 引入），零新增下载。
duck-project = { path = "crates/duck-project" }
# 比对族内核（crates/duck-compare-core，计划 §6.5）：文本差异、目录比对，
# 以及后续的 class/jar 包比对。`similar` 与参考仓同版本（2.7.0），差异算法一致。
duck-compare-core = { path = "crates/duck-compare-core" }
# 文件批处理族内核（crates/duck-files-core，计划 §6.6）：遍历搜索、目录树、
# 批量改名 / 替换（带撤销日志）、CSV 表格与图表、文档格式转换。
duck-files-core = { path = "crates/duck-files-core" }
# 网络与联调族内核（crates/duck-net-core，计划 §6.7）：HTTP 请求、报文调试
#（TCP/XML/FIX 三协议共用一个连接骨架 + 四种编解码）、S3/FTP/SFTP 连通检测
#（分步结果）、hosts 解析与合并。零 gpui、全同步。
duck-net-core = { path = "crates/duck-net-core" }

# 零散工具族内核（crates/duck-misc-core，计划 §6.8/§6.9 合并后的一包）：
# JSON Schema（Draft-07 子集）校验、Git 文本生成（提交信息/Hook/.gitignore）、
# Nginx 配置生成（逐字复刻参考仓 `nginx/` 786 行，渲染器替换掉 tera）。零 gpui、全同步。
duck-misc-core = { path = "crates/duck-misc-core" }

# 金融工具族内核（crates/duck-finance-core，计划 §6.10 / M6）：PDM 阅读器
#（PowerDesigner XML → 表结构 / 建表 SQL / 数据字典）与渠道网关模型生成
#（接口 Excel → Bank/Host Java 实现 / XML 报文骨架）。零 gpui、全同步；
# 依赖 `calamine` / `quick-xml` / `walkdir` 全在既有图内（文件族已引入）。
duck-finance-core = { path = "crates/duck-finance-core" }

# 编解码族内核（crates/duck-codec-core）：恒生 LCPT 加解密（DES / DES(HsAndMoe) /
# DES3 / SM4 + 柜员密码，逐字复刻 `hundsun_crypt.rs`）与文件哈希。零 gpui、全同步。
duck-codec-core = { path = "crates/duck-codec-core" }

serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1"
# 渲染快照测试（`crates/duck-components/tests/render_snapshot.rs`）直接用：
# `Window::render_to_image()` 返回 `image::RgbaImage`。该 crate 已经在依赖图里
# （gpui-pre 传递），这里提成直接依赖，并钉 `=0.25.10` 避免再次锁链重排。
# 许可证 Apache-2.0 OR MIT，MSRV 与全仓一致。
image = "=0.25.10"

# 更新器三件：语义化版本比较、流式 SHA-256、阻塞式 HTTPS（三者均为 MIT OR Apache-2.0）。
# `ureq` 关掉默认再显式开 `rustls` + `gzip`：TLS 走 rustls（`ring` 提供者），
# 不依赖系统 OpenSSL；`gzip` 是 manifest 常见的传输压缩。
semver = "1"
sha2 = "0.10"
# SigV4 签名（duck-net-core::s3）：HMAC-SHA256 链 + 摘要转十六进制。
# 两者**本就在依赖图里**（`sha2` 见上、`hmac` 与 `hex` 由 russh / ring 一线传递），
# 这里只是提成直接依赖；版本取图中已有的那一份，不引入新的 major。
hmac = "0.12"
hex = "0.4"
# GBK / GB18030 收发（报文调试的 `charset`）。**不新增依赖**：`encoding_rs` 本就在
# 图里（HTML 解析 / reqwest 一线传递）。WHATWG 的 `GBK` 解码器同时吃 GB18030，
# 与参考仓 `invoke('encode_text', { charset: 'gbk' })` 覆盖的是同一片字符集。
encoding_rs = "0.8"
# 逐行/逐字符差异（参考仓同一份算法，本仓只做文本比对，不引它的 `unicode` 特性）。
similar = "2.7"
# 文档格式转换（duck-files-core::convert）的三件配套，版本与参考仓一致：
# - `csv 1.4`：解析带引号 / 换行的 CSV（参考仓 `converter/data.rs` 用的就是它）。
# - `serde_yaml 0.9`：YAML 本身就是 deprecated 分支，但参考仓锁的就是这一版，
#   换 `serde_yml` 等于换一套实现，迁移期不引入第二处差异。
# - `quick-xml 0.37`：读 docx / pptx 的正文 XML（`w:t` / `a:t` 文本运行）。
# - `calamine 0.30`：读 xlsx（多 sheet、共享字符串、合表）。MSRV 1.75。
#   0.36 起要 1.88，不可用；0.22 会再拖一个 zip 0.6，0.30 用的 zip 4.x 与本仓
#   的 zip 2.4.2 只是「两个大版本并存」，不涉及同一份代码的分叉。
# - `pdf-extract 0.7`：PDF 抽文字（扫描件抽不出，参考仓也是这样直接报错）。
# - `pulldown-cmark 0.13`：Markdown → HTML。**不用参考仓的 comrak**：comrak 0.20
#   默认带 `syntect` 做代码高亮，syntect → plist → `time`，而 `time 0.3.55` 要求
#   Rust 1.88，会把全仓 1.85 硬门顶穿；pulldown 是纯 CommonMark 解析器，
#   依赖只有 bitflags / memchr / unicase（MSRV 1.71）。
csv = "1.4"
serde_yaml = "0.9"
quick-xml = "0.37"
calamine = "0.30"
pdf-extract = "0.7"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
# SEE 包合并要出 `hash.txt`（逐文件 MD5）。参考仓用的是 `md5` crate，本仓改用它
# 背后同一套 RustCrypto 实现 `md-5 0.10`（**已在依赖图里**，`digest` 同一版本、
# 零新增下载、零新增许可证条目）；API 只差 crate 名，`{Digest, Md5}` 用法不变。
md-5 = "0.10"
ureq = { version = "3.4", default-features = false, features = ["rustls", "gzip"] }

# 更新源签名校验（duck-update::signature）：minisign 格式（Ed25519 + BLAKE2b 预哈希）。
# - `minisign-verify` 0.3.0：MIT，**零传递依赖**，只做验签不做签名——正合客户端需要，
#   私钥永远不进二进制。同一套格式被 Tauri 的更新器采用，发布侧也能用 `minisign`
#   或 `rsign` 直接签，不必依赖我们自己的工具链。
minisign-verify = "0.3"

# 插件市场：解包插件包用 tar.gz。
# - `tar` 0.4.46：MIT OR Apache-2.0，MSRV 1.63；`unpack_in` 原生拒绝绝对路径与 `..` 逃逸。
# - `flate2` 1.1.10：MIT OR Apache-2.0。它已经在依赖图里（ureq 的 `gzip` 特性），
#   这里只是把它提成直接依赖，**不引入新的传递依赖**。
# 不用 zip：`zip` 8.x/9.x 的 MSRV 是 1.88，会顶破本仓 `rust-version = "1.85"`；
# 钉到 6.0.0 虽可用，但为同一个归档格式退两个大版本不划算。
tar = "0.4.46"
flate2 = "1.1"

# zstd **解码**（crates/duck-drivers 解 dbx 的 `tar.zst` 驱动工件）。
# - **必须 `=` 钉 `0.8.2`**：0.8.3 / 0.9.x 声明 `rust-version = "1.87"`，
#   顶破本仓 1.85 硬门；0.8.2 未声明 MSRV。写 `"0.8"` 会解析到 0.9.1。
# - **只开 `std`**：默认还带 `hash`（XXH64 帧校验，拖进 `twox-hash`）。
#   我们只解压**自己刚按 SHA-256 校验过**的工件，帧校验是重复把关不划算；
#   关掉它即**零新增传递依赖**（`twox-hash` 不会进树）。
# - **选纯 Rust 而不是 `zstd`（libzstd C 绑定）**：与全仓「终端用户零系统依赖」
#   取向一致，不给构建加 C 工具链步骤；而且我们只需要解码，不需要编码。
# - 许可证 MIT。⚠️ 升级前先核 `rust-version ≤ 1.85`。
ruzstd = { version = "=0.8.2", default-features = false, features = ["std"] }

# 托盘与事件通道。`gpui` 本来就传递依赖 futures 0.3（`AsyncApp` 自己用 `oneshot`），
# 这里只是把它提成直接依赖；`tray-icon` 关掉默认特性，默认的 gtk / libxdo 只对 Linux 有意义。
tray-icon = { version = "0.24", default-features = false }
futures-channel = "0.3"
futures-util = "0.3"

# 平台能力层。SQLite 用 `bundled` 内嵌编译，终端用户零系统依赖。
rusqlite = { version = "0.32.1", features = ["bundled"] }
dirs = "6"
rfd = "0.16"
arboard = "3.6"
tracing = "0.1"
tracing-subscriber = "0.3"
toml = "0.8"
# SQL 插件核心（`duck-sql-core`）：参考仓的 `ddl_generator` 等模块直接复刻，
# 保留它们原本使用的 `regex`。1.13.1 早已在依赖图里（传递依赖），
# 提成直接依赖不新增包，license 清单不变。
regex = "1.13.1"
# `sql_merge` 复刻件的三件配套：解压 db-*.zip、遍历版本目录、按本地时区打时间戳。
# 版本与参考仓一致（zip 2.x）；`walkdir` / `chrono` 早已在依赖图里。
# ⚠️ zip **不开默认特性**：默认会拉 zstd / xz / aes（含 `zstd-sys` 的 C 构建 +
# `sha1`+`zeroize` 的加密栈），而银行交付的 db-*.zip 清一色 deflate。
# 这里显式开 deflate（flate2 纯 Rust 后端）/ deflate64 / bzip2 / lzma——
# 覆盖实际会遇到的四种压缩方法，同时不引入需要 cc 编译的 zstd-sys。
# 注意：`deflate-flate2` 单独用不够（zip 2.4 的 `flate2` 是可选依赖，只有
# `deflate` 这组特性才会连 `flate2/rust_backend` 一起打开）。
zip = { version = "=2.4.2", default-features = false, features = [
    "deflate",
    "deflate64",
    "bzip2",
    "lzma",
] }
walkdir = "2.5"
# 只要「本地时间」这一个能力：默认特性还带 wasm 绑定等，插件进程用不上。
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# 保留 ZIP 条目的原始修改时间（`duck.merge.*` 的「同名文件按日期取最新」要靠它把
# 解压时的条目时间一路带到输出目录；否则所有文件都是「复制时刻」，去重直接失效）。
# 0.2.29 早已在依赖图里（`tar` 的传递依赖），提成直接依赖**零新增下载**；
# MIT/Apache-2.0，MSRV 1.63。
filetime = "0.2"

# 插件 JS 执行轨：QuickJS 高层绑定。钉 `=0.11.0`——0.12 起上游 MSRV 抬到 1.87，
# 会顶破本仓 `rust-version = "1.85"`；升级必须同步核对 MSRV。MIT（QuickJS-NG 同 MIT）。
rquickjs = { version = "=0.11.0", default-features = false, features = ["std", "loader", "macro"] }

# 数据库模块（duck-db，docs/database-design.md）三条 M1 引擎驱动 + SQL 智能层：
# - `postgres` 0.19（阻塞版，内部即 tokio-postgres 的同步封装）：MIT OR Apache-2.0，
#   rust-version 1.85 恰好压线，升级前必须重核。不带类型特性：读路径走
#   `simple_query` 文本协议（值不经类型 OID 映射），特性用不上。
#   TLS 走 `postgres_rustls`，**必须钉 `=0.1.1`**：它的 MSRV 分界线同样陡
#   （0.1.0 = 1.84、**0.1.1 = 1.85**、0.1.2 起 = 1.86、0.1.5 = 1.93、0.1.6 = 1.97），
#   写 `"0.1"` 会解析到 0.1.6 顶破 `rust-version = "1.85"`。MIT OR Apache-2.0。
#   它只依赖 tokio-postgres / tokio-rustls，两者都**已在依赖图内**（`postgres` 与
#   `mysql` 的 rustls 通道），所以引入它等于零新增下载。
# - `mysql` 28（rust-mysql-simple 阻塞版）：MIT/Apache-2.0。关默认特性——默认的
#   `minimal` 走系统 zlib，与「终端用户零系统依赖」取向冲突；改用 `default-rust`
#   （flate2 rust_backend，已在图内）+ `rustls-tls-ring`（TLS 走 rustls/ring，维持
#   全仓单一 crypto 库；MySQL 8 caching_sha2_password 的完整握手需要 TLS 通道）。
# - `rustls` / `tokio-rustls` / `webpki-roots` 直接依赖：PG 的 TLS 要自己造
#   `ClientConfig`（信任链 + 自签例外档），再由 `tokio-rustls::TlsConnector` 交给
#   `postgres_rustls::MakeTlsConnector`。三者早已在图内（`mysql` 的 rustls-tls-ring、
#   `ureq` 的 rustls 通道），这里只是提成直接依赖。
#   ⚠️ **必须 `default-features = false` + 只开 `ring`**：rustls 0.23 的默认 provider 是
#   `aws-lc-rs`，一开就会拖进 `aws-lc-sys` + `cmake`（要 C 工具链、体积翻倍），
#   而本仓全仓单一 crypto 库就是 ring（与 ureq / mysql / 终端一致）。
#   信任链用 `webpki-roots`（编译进二进制）而非系统钥匙串，与更新器 / 插件出网同一份根集。
# - `sqlparser` 0.52：Apache-2.0，语句分类 / 风险分级 / 只读证明（duck-db::sqlintel）
#   与语义诊断（duck-db::sqldiag，开 `visitor` feature 遍历 AST；随之引入
#   `sqlparser_derive` 0.2.2，Apache-2.0，无 rust-version 声明、仅 syn/quote 1.0）。
#   0.6x 未声明 MSRV，钉缓存既有且被 dbx 验证过的 0.52。
#
# SQL Server（`tiberius`，docs/database-design.md §5 的 M2 选型）：
# - **async-only**：`tiberius` 只有 async API，由驱动内部自管 current-thread
#   runtime `block_on`（同 §4.1 对 mongodb 的口径），tokio 不传染给调用方。
# - `default-features = false` + `tds73` + `rustls`：默认特性带 `winauth`
#   （Windows 集成认证，非目标平台也拉依赖）与 `native-tls`（会引 openssl /
#   schannel，破坏本仓「全仓单一 crypto = ring」）。`rustls` 档走
#   `tokio-rustls` + `tokio-util` + `rustls-native-certs`，前两者已在图内。
# - MSRV：`tiberius 0.12.3` **未声明** `rust-version`，按依赖准入的实证流程
#   （独立 crate + `resolver = "3"` + 逐包读 registry 的 `rust-version`）核过
#   整棵树：**144 个包、0 个超 1.85**。0.13 起需 1.88，不可用。MIT/Apache-2.0。
# - **零新增 tokio**：`postgres`（阻塞版）内部就是 `tokio-postgres`，
#   `tokio 1.53.2` 早已在 `Cargo.lock` 里。MSRV 1.71。
postgres = "0.19"
postgres_rustls = "=0.1.1"
mysql = { version = "28", default-features = false, features = ["default-rust", "rustls-tls-ring"] }
tiberius = { version = "0.12", default-features = false, features = ["tds73", "rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false }
webpki-roots = "1"
sqlparser = "0.52"
# SQL 格式化（duck-db::sqlintel::format_sql）：Rust 版 sql-formatter，支持关键字
# 大小写 / 缩进类型 / 缩进宽度等选项。MSRV 1.84（≤ 全仓 1.85），MIT OR Apache-2.0；
# 默认无 feature（`debug` 才会拉 anstream/anstyle/okhsl，不启用）。
# 传递依赖 `winnow 0.7` 早已在 Cargo.lock 内，零版本新增。
sqlformat = "0.5.0"
# `encoding_rs` 已经在上面（报文调试那一段）提成直接依赖了，这里不再重复声明：
# 同名键写两次是 TOML **重复键**，整份清单直接解析失败（`duplicate key`）。
# 执行 SQL 文件（`duck-db::sqlfile`）按真实编码解码时用同一个版本约束即可。

# MongoDB（docs/database-design.md §5 的 M2 选型）：**必须精确钉 `=3.6.0`**。
# 与本仓其它「钉版本」的理由不同，这条不是 API 兼容问题而是**硬门**问题：
# `mongodb 3.6` 声明 `rust-version = "1.85"`（恰好压线，实测 registry 里的
# `Cargo.toml`），而 `3.9` 已是 **1.88**；写 `"3.6"` 会解析到 3.9+，必须 `=`。
# - `default-features = false` 去掉 `dns-resolver`（hickory 系，只服务
#   `mongodb+srv://` 的 SRV 查询）；`rustls-tls` + `compat-3-0-0` 显式补回
#   （后者是 3.6 的 default 之一，含 `bson-2`，关了 default 就得自己写）。
# - **零新增 TLS 栈**：3.6 要的是 `rustls 0.23` + `tokio-rustls 0.26` + `ring`，
#   与本仓 `mysql` / `postgres_rustls` 那两行**同一套**（上面已经声明了），
#   所以不会出现「两代 rustls 并存」。
# - ⚠️ **`time` 族必须钉在 0.3.44（由 `Cargo.lock` 承载）**：`bson 2.15` 显式开了
#   `time` 的 `macros` feature，于是 `time` / `time-core` / `time-macros` 一起**进入
#   编译树**——在引入 mongodb 之前它们并不在树里（`mac-notification-sys` 那个引用方
#   在 host 上根本没启用，`cargo tree -i time` 无输出）。而 crates.io 当前的 `time
#   0.3.55` 声明 **rust-version 1.88**，顶破本仓 1.85 硬门。降到 `0.3.44`（**1.81**）
#   之后 `time` / `time-core` / `time-macros` / `num-conv` 全部达标，且实测
#   `cargo check -p duck-platform` 通过——两侧约束都只是 `^0.3`，降级不影响任何消费者。
#   本仓构建一律 `--locked`，所以这个 pin 靠 lock 文件固化；**要升 `time` 先核目标版本
#   的 `rust-version ≤ 1.85` 再改，别直接 `cargo update`**。
mongodb = { version = "=3.6.0", default-features = false, features = [
    "rustls-tls",
    "compat-3-0-0",
] }

# 异步驱动的执行器（当前唯一消费者：`tiberius`）。
# - `rt` + `net` + `time` 三档就够：`Builder::new_current_thread().enable_all()`
#   + `block_on`，不需要 `rt-multi-thread`（那是给「一个 runtime 服务多线程」用的，
#   而本仓的口径是**每条连接一个 current-thread runtime**，见 §4.1 方案 A）。
# - **不开 `macros`**：本 crate 不用 `#[tokio::main]` / `tokio::select!`，
#   开了只会拖进 `tokio-macros` 的 proc-macro 编译时间。
# - 不是新下载：`tokio` 已在 `Cargo.lock`（`postgres` 的传递依赖）。MSRV 1.71，MIT。
tokio = { version = "1", default-features = false }
# `tiberius` 的 `Client::connect` 要的是 `futures::io` 的 `AsyncRead + AsyncWrite`，
# 而 `tokio::net::TcpStream` 实现的是 tokio 自己的 trait —— `compat` 就是这层桥。
# 已在图内（`tiberius` / `postgres_rustls` 的传递依赖），**零新增下载**。
tokio-util = { version = "0.7", default-features = false, features = ["compat"] }

# Redis 模块（duck-redis，docs/redis-design.md）的客户端：
# - **必须用 `=` 钉死 `1.2.2`**。redis 的 MSRV 分界线很陡（本机 cargo 索引实测
#   `rust_version` 字段）：1.2.0/1.2.1/1.2.2 = **1.85**（恰好压线），
#   1.2.3 起全部 = **1.88**，会顶破本仓 `rust-version = "1.85"`。
#   写 `"1.2"` 会解析到 1.2.3+，必须精确钉。BSD-3-Clause。
# - `default-features = false` + 只开四个纯协议特性：**不引 aio / tokio-comp / smol-comp**，
#   本仓零 tokio 纪律，走 `Client::get_connection()` 的阻塞 API（与 duck-db 的
#   「同步内核 + background_executor」口径一致）。不开 TLS（M1 明文 + SSH 隧道）；
#   不开 cluster（M1.4 需要时再评估其传递依赖）。
redis = { version = "=1.2.2", default-features = false, features = [
    "acl",
    "streams",
    "geospatial",
    "script",
] }

# 开机自启（duck-platform::autostart，按 target 平台分别取用）：
# - macOS 走 SMAppService（登录项，macOS 13+）：objc2 官方绑定，配对图中已有的 objc2 0.6；
#   许可证 Zlib OR Apache-2.0 OR MIT，MSRV 1.71。
# - Windows 写 HKCU\...\Run 注册表：Microsoft 官方 crate（cargo 同款），MIT OR Apache-2.0；
#   仅 windows target 参与编译，声明见 duck-platform 的 target 依赖表。
objc2-service-management = "0.3.2"
windows-registry = "0.6"

# objc2 本体与 AppKit 绑定（duck-platform::foreground，macOS only）：
# 只为了补上 gpui 没暴露的两条反向消息 —— `App::hide` 有、`unhide` 没有；
# `Window::minimize_window` 有、还原没有。版本与 gpui-fast 锁定的快照逐字一致
# （见下方 [patch.crates-io] 引用的那份工作区 `Cargo.toml`），
# **不新增下载**：0.6.5 / 0.3.2 本来就由 gpui_macos 带进依赖图，`NSResponder` 与
# `NSWindow` 两个特性它也已经开着。省掉 `default-features` 里用不到的类，
# 免得编译期多出几十个用不上的绑定。
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSResponder", "NSWindow"] }

# 全局唤起快捷键（duck-platform::hotkey）：
# gpui（gpui-fast）**完全没有**系统级热键能力，所以这一条是纯粹的从零补齐。
# - `global-hotkey` 0.8.0：Apache-2.0 OR MIT，MSRV 1.77（低于本仓的 1.85）。
#   Windows 走 `RegisterHotKey`、macOS 走 Carbon `RegisterEventHotKey`，
#   两条路都**不需要**辅助功能授权（媒体键那条路才需要，我们已明确不支持）。
# - 传递依赖几乎零新增：`keyboard-types 0.7.0` / `crossbeam-channel 0.5.17` /
#   `once_cell 1.21.4` / `thiserror 2.0.21` / `objc2 0.6.5` / `objc2-app-kit 0.3.2` /
#   `x11rb 0.13.2` / `xkeysym 0.2.1` 均已在图内且版本相容。
#   唯一的例外是 Windows 上的 `windows-sys 0.59`（本仓现有 0.52 / 0.60 / 0.61 三条，
#   会多出第四条），只影响 Windows 的编译时间，不动运行时。
global-hotkey = "0.8.0"

# 凭据存储（duck-platform::secret）：`<应用数据目录>/credentials.json`。
# **不引任何第三方**——JSON 编解码复用 `serde_json`（早已在图里），
# 加解密一律不做（本模块不提供加密，保护靠文件权限位，见其模块文档）。
# 历史上这里钉过 `keyring 3.6.3`，2026-10-12 移除：与系统钥匙串绑定会把
# 「应用数据」拆成两半（备份/迁移只能搬走一半），且各平台后端可用性不一致。

# 本机加密保管箱（duck-platform::vault）：SSH 连接口令的落库加密。
# - `ring` 0.17：ISC 类许可，MSRV 1.63。**全仓单一 crypto 库就是 ring**
#   （rustls / ureq / mysql 的 TLS 都走它），这里只是把已在依赖图里的它提成直依赖，
#   用 AES-256-GCM 加密口令后存进 SQLite —— 传递依赖零新增。
ring = "0.17.14"

# Windows 资源编译（duck-app 的 build.rs）：把 assets/duck.ico 嵌入 .exe，
# 文件管理器 / 任务栏 / 快捷方式即显示应用图标。MIT OR Apache-2.0。
# 作为 build-dependency 无条件声明（见 duck-app Cargo.toml 注释），构建脚本内按
# CARGO_CFG_WINDOWS 跳过非 Windows 目标。crates.io 最新为 0.1.31（无 0.4 线）。
winresource = "0.1"

# 工具注册表：中文名 → 拼音全拼 / 首字母（零传递依赖，MIT）。
# 只要 `plain`：全拼与首字母都需要它，其余（声调 / 多音字 / compat）用不到。
pinyin = { version = "0.11", default-features = false, features = ["plain"] }

# 终端仿真内核（crates/duck-term）。vendored 基线与差异记录见 vendor/README.md：
# - `alacritty_terminal` 0.26.0：Apache-2.0，MSRV 1.85.0（恰好压线）。取 oxideterm
#   维护的 vendored 副本——它带两处有文档的补丁（ASCII 快路径 + 视口滚动单独上报
#   damage，后者正是后续增量渲染要用的），且这是 S3 验证过的形态。
# - `vte` 0.15.0：alacritty_terminal 的解析器；`ansi` 特性提供 `vte::ansi` 处理器
#   与颜色 / 事件类型。两者都经 [patch.crates-io] 指向 vendor/ 同名目录。
alacritty_terminal = "0.26.0"
vte = { version = "0.15.0", default-features = false, features = ["std", "ansi"] }

# 邮箱模块（duck-mail，docs/email-design.md）的协议层。
# - `async-imap 0.11`：客户端视角的 IMAP。选它而不是自研（melib 用 alpha 版
#   `imap-codec`）或复用自己的服务端实现（`temp/stalwart` 的 `imap-proto` 是**服务端
#   视角**：`parser/` 解 `Command`、`protocol/` 序列化 `Response`，客户端要的是镜像
#   方向，见设计文档 §2.4②）。关默认特性、只开 `runtime-tokio`（本仓全仓 tokio）。
#   未声明 MSRV；MSRV 1.85 下的实际可编译性由 CI 的 stable 工具链把关。
# - `mail-parser 0.11` + **`full_encoding`**：后者才有完整的 `encoding_rs` 通道，
#   否则 GB2312/GBK/Big5/Shift-JIS 会解成 U+FFFD（中文邮件用户不可接受）。
#   0.11 的默认特性是空的，必须显式开。
# - `base64 0.22`：已在锁文件里（传递依赖），这里提成直接依赖用于 CID 内联图与
#   IMAP 正文段的 base64 解码，**零新增下载**。
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
mail-parser = { version = "0.11", features = ["full_encoding"] }
base64 = "0.22"
# - `mail-builder 0.4`：**只用来装配 multipart/mixed 正文**（浏览器会把附件 base64
#   折行、`Content-Disposition` 的非 ASCII 文件名要编码、boundary 要唯一），不碰头部
#   ——头部仍由 `compose.rs` 自建（注入拒绝 / RFC 2047 / `Bcc` 不进头那几条硬口径都在
#   那里）。`default-features = false`：默认特性 `gethostname` **只被
#   `MessageBuilder::write_to` 的「没给 Message-ID 时自动生成」用到**，而本仓自己生成
#   `Message-ID`（`compose::generate_message_id`）、且只调 `MimePart::write_part` ——
#   关掉它即**零新增传递依赖**（否则会多拉一个 `gethostname`，见设计文档 §4.2）。
#   许可证 `Apache-2.0 OR MIT`，可择 MIT 与全仓一致。
mail-builder = { version = "0.4", default-features = false }

# 全员共享的 lint 基线。各 crate 通过 `[lints] workspace = true` 显式启用。
# 仅对明确有害的写法设 deny，其余保持默认，避免阻塞日常构建。
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

# ── 开发档（`cargo run` / `sbin/run.sh` / `cargo test`）────────────────────────
# 为什么必须给**依赖**单独提优化：本仓是 GPUI 界面，`cargo run` 出来的帧时间由
# taffy 排版 + 文本整形 + gpui 自己的 prepaint/paint 决定，而这三块全在**依赖**里。
# dev 档默认 opt-level 0 时它们不优化，界面手感与发版差了**一个数量级**——
# 实测同一帧（数据网格 1000 行 × 20 列，滚轮）：
#   dev（全 opt-level 0）68.2 ms ≈ 15 fps   ← 会被误判成「产品卡顿」
#   本配置/ release         7.2 ms ≈ 140 fps
# 两次的分配次数完全相同（28,090 次），差别只在编译档 ⇒ 性能判断必须在这两档下做，
# 别拿 opt-level 0 的观感当结论。
#
# 口径（与 zed 上游同款）：**依赖 3 / 本仓 1**。自己的 crate 保持 opt-level 1，
# 增量编译仍然快；依赖只在依赖本身变化时重编。
# ⚠️ 代价（两处，都是改这一节就要认的）：① 首次全量重编依赖（十几分钟量级，之后
# 走增量）；② CI 的 test / clippy 作业同样按 dev 档编译，冷缓存会更慢（rust-cache
# 命中后只多出一次性重建）。要临时恢复「纯 debug 档」：把这两节注释掉即可。
# 想要最接近发版的数字，仍然用 `sbin/run.sh --release`。
[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

# GPUI 核心性能分叉 gpui-fast（longbridge/gpui-fast，基于 zed upstream a1b71072e5）。
# 通过 compat/ 提供的同名同版本替身替换 crates.io 快照：retained mode 增量渲染与
# scroll layers（Windows D3D11 / macOS Metal）默认开启，可用环境变量
# GPUI_VIEW_RETENTION=0 / GPUI_SCROLL_LAYERS=0 随时降级回逐帧全量绘制。
# rev 锁定在与 gpui_perf --headless 实测一致的提交（v0.1.6+1，2026-10-09）。
[patch.crates-io]
gpui-pre = { git = "https://github.com/longbridge/gpui-fast", rev = "b8f0c026553711c1e049fee501932d3801f23567" }
gpui-pre-platform = { git = "https://github.com/longbridge/gpui-fast", rev = "b8f0c026553711c1e049fee501932d3801f23567" }
gpui-pre-macros = { git = "https://github.com/longbridge/gpui-fast", rev = "b8f0c026553711c1e049fee501932d3801f23567" }
gpui-pre-sum-tree = { git = "https://github.com/longbridge/gpui-fast", rev = "b8f0c026553711c1e049fee501932d3801f23567" }
# 终端仿真内核：vendored（基线与差异记录见 vendor/README.md，升级必须同步该表）。
alacritty_terminal = { path = "vendor/alacritty-terminal" }
vte = { path = "vendor/vte" }
# gpui-base：vendored（邮件正文排版补丁：TextMark 增加内联 color / font_size，
# html 解析读取 style 属性——上游 0.7.x 的文档模型不解析任何内联 CSS，营销邮件
# 因此「全部同字号同色」。基线与差异记录见 vendor/README.md，升级必须同步该表）。
gpui-base = { path = "vendor/gpui-base" }
# 注：compat/ 还提供 gpui-pre-web 与 gpui-pre-reqwest-client 替身，但本项目的
# HTTP 客户端（gpui-pre-reqwest 0.12.15）在 patch 后随旧依赖图整体退出，二者无需声明。
