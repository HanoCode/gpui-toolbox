[package]
name = "duck-mail"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "邮箱模块内核：账户档案、IMAP 协议、MIME 解码、本地 SQLite 存储与同步引擎（不依赖 gpui）。"

# 依赖纪律（AGENTS.md §1）：本 crate 是内核层，**不得引入 gpui**；
# 平台能力只取 duck-platform（凭据 / 路径）。
#
# 异步模型（docs/email-design.md §4.1）：IMAP 是常驻连接 + IDLE 推送 + 多账号并发，
# 必须异步；沿用 `duck-db` 的「方案 B」——本 crate 自管内嵌 tokio runtime，
# **tokio 的类型不出本 crate 的公共 API**（唯一出口是 `runtime::MailRuntime` 与
# `Task<T>`）。DB 层是纯同步 rusqlite，走 crate 自己的专用写线程，不经 tokio。
[dependencies]
duck-platform.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

# 协议层：IMAP 走 `async-imap`（客户端视角的 `imap-proto`，见设计文档 §4.4 的选型论证），
# MIME 解析走 `mail-parser` 的 `full_encoding`（否则 GB2312/GBK/Big5 会解成 U+FFFD）。
async-imap.workspace = true
mail-parser.workspace = true

# MIME **构造**（发信带附件时的 multipart/mixed）。只在 `compose.rs` 里用，且只取
# `mime::{MimePart, BodyPart}` 这类低层类型 —— 头部仍由 `compose.rs` 自建。
# `default-features = false` 的理由见根 `Cargo.toml`（关掉 `gethostname`，零新增传递依赖）。
mail-builder.workspace = true

# TLS：与全仓同一套 rustls + ring，信任链用编译进二进制的 `webpki-roots`，
# 不走系统钥匙串（与更新器 / 插件出网 / duck-db 同一份根集）。
rustls.workspace = true
tokio-rustls.workspace = true
webpki-roots.workspace = true

# tokio 出现在两处：`runtime.rs`（自管 runtime）与 `proto/imap.rs`（连接层直接用
# `tokio::net::TcpStream` 与 `tokio::time::timeout`，`async-imap` 的会话就跑在这条
# 连接上）。**公共 API 上没有 tokio 派生类型**——协议层的流类型别名是 `pub(crate)`。
# feature 按需：多线程 runtime + 宏 + 同步原语
# + 定时器（超时/退避）+ TCP + 异步读写（rustls 握手）+ 文件（附件落盘）。
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "net",
    "io-util",
    "fs",
] }
# `async-imap` 的 `Session` 用 futures 的 `Stream`；`futures-util` 只为 `StreamExt`。
futures-util.workspace = true
# 内联图（CID → `data:`）与 IMAP 的 base64 正文解码。
base64.workspace = true

# OAuth2（`oauth.rs`）：PKCE 的 SHA-256 与随机串走 `ring`（全仓单一 crypto 库），
# 令牌交换 / 刷新走 `ureq`（阻塞式，喂给后台执行器）。两者**都已在依赖图内**
# （`ring` 由 `duck-platform::vault`、`ureq` 由 `duck-db` / `duck-update` 等引入），
# 这里只是提成直依赖，**零新增下载**。
ring.workspace = true
ureq.workspace = true

[lints]
workspace = true
