[package]
name = "duck-term"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Duck Toolbox 终端仿真内核：本地 PTY + alacritty 终端状态机（无 GPUI）"

[dependencies]
alacritty_terminal = { workspace = true }
