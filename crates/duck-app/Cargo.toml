[package]
name = "duck-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Duck Toolbox 桌面应用装配与示例页面。"

[[bin]]
name = "duck"
path = "src/main.rs"

[dependencies]
duck-components.workspace = true
duck-shell.workspace = true
duck-theme.workspace = true
duck-command.workspace = true
duck-platform.workspace = true
duck-store.workspace = true
duck-tools.workspace = true
duck-update.workspace = true
duck-plugin.workspace = true
duck-plugin-js.workspace = true
duck-plugin-process.workspace = true
duck-plugin-registry.workspace = true
duck-db.workspace = true
# 驱动管理（`pages/db/drivers.rs`：驱动商店 / 安装 / 更新 / 下载源）与连接选择器里
# agent 档的引擎清单。`duck-db` 只**用**驱动目录（`ConnectionConfig::driver_entry`），
# 而这里要**驱动**它（起下载、看进度、落盘），所以是直依赖。
duck-drivers.workspace = true
duck-redis.workspace = true
# 项目管理页内核（`pages/projects/`）：自管 SQLite、零 gpui、全同步。
# 依赖全部已在图内（rusqlite 由 duck-db / duck-store 引入），不新增下载。
duck-project.workspace = true
duck-ai.workspace = true
duck-term.workspace = true
duck-ssh.workspace = true
duck-mail.workspace = true
gpui.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true
gpui_platform.workspace = true
futures-channel.workspace = true
futures-util.workspace = true
libc = "0.2"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tray-icon.workspace = true

# 数据库页 SQL 补全（duck-app/src/pages/db.rs 的 SqlCompletionProvider）：
# gpui-base 的 `CompletionProvider` trait 签名直接引用 `lsp_types` 的
# CompletionContext / CompletionItem / CompletionResponse，实现方必须能具名这两个
# 类型。ropey 已由 gpui-base 经 `gpui_component::input::Rope` 转出口，无需直依赖。
# 两包都已在依赖图内（gpui-base / gpui-component 同源），零新增传递依赖。
anyhow = "1"
lsp-types = "=0.97.0"

# gpui 的 HTTP 客户端（src/http_client.rs，远程图片走它）：
# gpui 桌面装配默认 NullHttpClient；trait 来自 gpui::http_client（re-export），
# 传输层用已在依赖图内的 ureq（不把 reqwest 请回来，见根 Cargo.toml §patch 注释）。
ureq.workspace = true

# 构建脚本依赖：winresource 本体跨平台可编译；非 Windows 目标由 build.rs 里的
# `CARGO_CFG_WINDOWS` 运行期短路。不能按 target 门控——build.rs 在所有宿主上
# 都要能编译，门控会让 macOS 构建直接失败。
[build-dependencies]
winresource.workspace = true

# 无头 UI 测试（`tests/` 下的 `#[gpui::test]`）需要 test-support 打开的
# `TestAppContext` / `VisualTestContext` / 事件模拟。只给测试目标开，
# 不影响二进制构建。
[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
