# duck.net.http-request 英文译文。键 = 中文源串。
#
# 与同族另外三个插件的表**故意有重叠**：运行时每个插件只读自己目录下的 `locales/`，
# 所以「连接失败」「等待超时」这类共用错误串必须各写一份，否则英文界面会显示中文
# 而漏译闸门全绿（闸门查的是所有插件表的并集）。
#
# 带 `{}` 的条目来自 `duck-net-tool` 里的 `fill`：占位符数量与顺序必须与源串一致
# （实参按序填，数量不一致时多出的丢掉、不足的留 `{}`）。

# ── 清单 ──
"HTTP 请求" = "HTTP Request"
"发一条 HTTP 请求：七种方法、五种请求体、四种认证、变量插值、cURL 导入；结果带状态、耗时、体积、Set-Cookie 与等价 curl" = "Send one HTTP request: seven methods, five body types, four auth modes, variable interpolation and cURL import; the result carries status, latency, size, Set-Cookie and an equivalent curl"
"网络" = "Network"
"请求体 / cURL 命令" = "Request body / cURL command"
"手工模式：raw 请求体（JSON / XML / 文本）。cURL 模式：把整条 curl 命令粘进来，参数区的方法与地址会被它覆盖" = "Manual mode: the raw body (JSON / XML / text). cURL mode: paste the whole curl command here — it overrides the method and URL in the parameter bar"
"来源" = "Source"
"手工填写" = "Manual"
"从 cURL 导入" = "Import from cURL"
"方法" = "Method"
"无" = "None"
"查询参数" = "Query params"
"键=值，多个用 & 连接；值会被百分号编码后拼到 URL" = "key=value, several joined with &; values are percent-encoded and appended to the URL"
"变量" = "Variables"
"键=值，多个用 & 连接；URL / 头 / 体里的 {{名字}} 会被替换，# 开头的行是注释" = "key=value, several joined with &; {{name}} in the URL, headers and body is substituted; lines starting with # are comments"
"认证" = "Auth"
"只用于本次请求，不进历史、不进日志" = "Used only for this request — never written to history or logs"
"用户名" = "User name"
"口令" = "Password"
"键名" = "Key name"
"键值" = "Key value"
"放在哪" = "Send in"
"请求头" = "Request headers"
"每行一个「名字: 值」，例如 Content-Type: application/json" = "One \"Name: value\" per line, e.g. Content-Type: application/json"
"请求体格式" = "Body type"
"不发请求体" = "No body"
"raw（原样发送）" = "raw (send as-is)"
"x-www-form-urlencoded" = "x-www-form-urlencoded"
"form-data（含文件）" = "form-data (with files)"
"binary（整个文件）" = "binary (whole file)"
"raw 的内容" = "Raw content"
"纯文本" = "Plain text"
"表单字段" = "Form fields"
"键=值，多个用 & 连接；值会百分号编码" = "key=value, several joined with &; values are percent-encoded"
"表单字段（multipart）" = "Form fields (multipart)"
"键=值，多个用 & 连接；文件写 字段=@/路径/文件" = "key=value, several joined with &; for a file write field=@/path/to/file"
"文件" = "File"
"选择要当请求体发送的文件" = "Pick the file to send as the request body"
"超时（ms）" = "Timeout (ms)"
"最多跟随重定向" = "Max redirects"
"跳过证书校验" = "Skip certificate check"
"响应" = "Response"

# ── 运行期 ──
"：" = ": "
"请求 {} {}" = "{} {}"
"响应 HTTP {}（{} ms）" = "Response HTTP {} ({} ms)"
"认证：{}" = "Auth: {}"
"来源：cURL 命令解析结果" = "Source: parsed from a cURL command"
"变量（{} 个）" = "Variables ({})"
"查询参数（{} 个）" = "Query params ({})"
"请求体：{} · {}" = "Body: {} · {}"
"{} 字节" = "{} bytes"
"状态：HTTP" = "Status: HTTP"
"耗时 {} ms · 体积 {} · 重定向上限 {}" = "{} ms · size {} · redirects up to {}"
"请求头（密钥已打码）" = "Request headers (secrets redacted)"
"响应头" = "Response headers"
"（没有响应头）" = "(no response headers)"
"Set-Cookie（{} 条）" = "Set-Cookie ({} entries)"
"响应体（{} 字节，已截断）" = "Response body ({} bytes, truncated)"
"响应体（{} 字节）" = "Response body ({} bytes)"
"（空响应体）" = "(empty body)"
"等价 curl（密钥用 $TOKEN 占位，粘贴前先导出变量）" = "Equivalent curl ($TOKEN stands in for secrets — export it before pasting)"
"最近请求（{} 条）" = "Recent requests ({})"

# ── 公共错误串（四族插件各一份） ──
"输入不完整，请检查必填项" = "Input is incomplete — check the required fields"
"URL 写错了（需要以 http:// 或 https:// 开头）" = "Bad URL — it must start with http:// or https://"
"请求头格式不对（每行应为「名字: 值」）" = "Bad header format — each line must be \"Name: value\""
"键值行写错了（每行应为「键=值」）" = "Bad key/value line — each line must be \"key=value\""
"变量没有定义" = "Undefined variable"
"不支持这种协议或方法" = "This protocol or method is not supported"
"等待超时" = "Timed out"
"域名解析失败" = "DNS lookup failed"
"连接失败" = "Connection failed"
"TLS 握手或证书校验失败" = "TLS handshake or certificate verification failed"
"服务端返回了错误状态" = "The server returned an error status"
"认证失败" = "Authentication failed"
"报文解析失败" = "Failed to decode the payload"
"内容超过上限" = "Content exceeds the limit"
"读写失败" = "Read/write failed"
"路径不存在" = "Path does not exist"
"权限不足" = "Permission denied"
