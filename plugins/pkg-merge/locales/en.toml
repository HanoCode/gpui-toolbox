"⚠️ 存在版本回退的 .class，详见输出目录的《版本回退核对清单.txt》" = "⚠️ Some .class files went backwards — see the version-regression checklist in the output directory"
"源目录和目标目录不能为空" = "Source and output directories are both required"
"源目录不存在: {}" = "Source directory does not exist: {}"

