# duck.merge.pkg-merge 英文译文。键 = 中文源串。
#
# 绝大多数条目来自 `duck-merge-core`（`sp_merge` / `merge_common` / `upd_merge`
# 三个逐字复刻件）：那些是 `format!` 插值后的日志与错误，运行时走
# `duck_plugin_process::render::Renderer` 的模板反查，所以**键必须是模板**
# （`{}` / `{:02}` / `{:.1}` 原样保留），译文只写 `{}`，两边的占位符数量必须相等。
#
# 少数键（`目标目录：{}` / `未找到的文件（{}）` / `处理日志（{} 行）` / `已取消。`）
# 已登记在 `plugins/merge-manifest-extract/locales/en.toml`：闸门认「任意插件的表里有」，
# 这里不重复。

# ── 清单 / 参数 ──
"SP 包合并" = "Package merge"
"把一批 IFMS 上线包（SP 3.0/4.0、IFMS6.0）按版本排序合并成一个输出目录：解压去重、服务目录归并、SQL 脚本合并、需求单说明合并" = "Merge a batch of IFMS release packages (SP 3.0/4.0 and IFMS6.0) into one output directory in version order: unzip with de-duplication, service-directory roll-up, SQL script merge and requirement-note merge"
"包目录" = "Package directory"
"选择包含 ZIP 包的目录" = "Pick the directory that holds the ZIP packages"
"结果目录" = "Output directory"
"选择合并后输出位置" = "Pick where the merged result goes"
"系统版本" = "System version"
"全部" = "All"
"开始合并" = "Start merge"
"选择包目录后点击「开始合并」" = "Pick a package directory, then click \"Start merge\""
"待合并版本列表" = "Packages to merge"
"版本范围" = "Version range"
"包含 database（追加模式）" = "Include database (append mode)"
"包含 documents（追加模式）" = "Include documents (append mode)"
"SQL 合并（追加到 merge_sql/）" = "SQL merge (append to merge_sql/)"
"服务合并（ifmpub / jres 分发到各服务的 WEB-INF/lib）" = "Service merge (distribute ifmpub / jres into each service's WEB-INF/lib)"
"需求单说明合并（merge_upd.xml）" = "Requirement-note merge (merge_upd.xml)"
"合并结果" = "Merge result"
"扫描包目录…" = "Scanning packages…"
"解析包名…" = "Parsing package names…"

