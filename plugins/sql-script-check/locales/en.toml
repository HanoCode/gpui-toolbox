# duck.sql.script-check 英文译文。键 = 中文源串。
#
# 后半段（「规则消息」起）是 `sql_checker.rs` 里 28 条规则的**反馈文案**：源串由
# `format!` 插值后产出（`表 '{}' 建议…` → `表 'T_ORDER' 建议…`），所以运行时查表
# 走的是 `duck-sql-tool::i18n::Renderer` 的模板反查——`{}` 的数量与顺序必须与
# 源串一致，否则参数会错位（数量不一致时那条消息会保留 `{}`，见 `fill` 的注释）。

"SQL 质量检查" = "SQL Check"
"按 28 类规则检查 SQL 脚本：语法、事务、破坏性操作、一致性、规范、表空间" = "Check a SQL script against 28 rule families: syntax, transactions, destructive operations, consistency, conventions, tablespaces"

"SQL 脚本" = "SQL script"
"粘贴要检查的 SQL 脚本…" = "Paste the SQL script to check…"
"数据库" = "Database"
"达梦 DM" = "Dameng DM"
"检查结果" = "Check results"

"请粘贴要检查的 SQL 脚本" = "Paste the SQL script to check"
"SQL 检查通过，未发现问题（{} ms）" = "SQL check passed, no issues found ({} ms)"
# 汇总行把数字放到标签**后面**：英文只有「3 errors / 1 error」两种写法，
# 模板里写死「{} errors」在 1 条时会变成语法错误。改成 `errors 3` 就与数量无关。
"{} 错误 · {} 警告 · {} 信息（{} ms）" = "errors {} · warnings {} · hints {} ({} ms)"
"错误" = "error"
"警告" = "warning"
"信息" = "hint"

# ---- 规则消息 ----

