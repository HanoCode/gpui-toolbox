# duck.merge.non-see-merge 英文译文。键 = 中文源串。
#
# 文案来自 `duck-merge-core::ifms6_merge` 的 non-SEE 那半（`non_see_merge` 及其
# 三个分块函数）与 `duck-merge-tool` 的结果拼版。与同目录其它合并插件一样，
# 键是**模板**（`{}` 原样保留），译文占位符数量必须相等。

# ── 清单 / 参数 ──
"非 SEE 包合并" = "Non-SEE package merge"
"把一批非 SEE 结构的版本包（服务端是目录而非内层 ZIP）合并成一份：前端、服务端、数据库分块合并后打包" = "Merge a batch of non-SEE version packages (the server side holds directories instead of inner ZIPs) into one: front end, server and database are merged block by block and repackaged"
"包目录" = "Package directory"
"选择包含版本子目录的目录" = "Pick the directory that holds the version subdirectories"
"结果目录" = "Output directory"
"选择合并结果输出位置" = "Pick where the merged result goes"
"参与合并的版本" = "Versions to merge"
"留空则自动扫描；也可手填，逗号分隔" = "Leave empty to scan automatically, or list versions separated by commas"
"合并结果" = "Merge result"

# ── 阶段标签（进度条文案） ──
"复制版本包…" = "Copying version packages…"
"前端合并…" = "Merging front end…"
"服务端合并…" = "Merging server…"
"数据库合并…" = "Merging database…"
"最终打包…" = "Final packaging…"

