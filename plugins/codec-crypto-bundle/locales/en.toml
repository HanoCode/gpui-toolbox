# duck.codec.crypto-bundle 英文译文。键 = 中文源串。
#
# 这份表有两个来源，都要覆盖：
#   1. `plugin.toml` 里的界面文案（标签 / 选项 / 占位）；
#   2. 内核与工具进程产出的消息（`duck-codec-core` + `duck-codec-tool` 收进
#      `PLUGIN_TEXT_SOURCES`，由 `cargo test -p duck-theme` 的漏译闸门逐条核对）。
#      这些消息多是 `format!` 的模板，宿主渲染后由 `Renderer` 按 `{}` 反查回填。

