"加解密工具包" = "Crypto Toolkit"
"Base64 / URL / Hex 编解码、SHA 哈希、AES-CBC、JWT 解析、随机密码、恒生 LCPT 与柜员密码" = "Base64 / URL / Hex codecs, SHA hashing, AES-CBC, JWT decoding, random passwords, Hundsun LCPT and teller passwords"

