# ── 恒生 LCPT（specs 展示名 / 说明 / 错误）──────────────────────────────
"DES（默认）" = "DES (default)"
"DES/ECB/PKCS5Padding → Base64；密钥取自 jar 内 deskey" = "DES/ECB/PKCS5Padding → Base64; the key comes from the jar's deskey"
"恒生自研 DES/ECB，零填充（整除 8 不补块）→ hex(大写)；密钥默认字面量 HsAndMoe" = "Hundsun's own DES/ECB with zero padding (no extra block when the length is a multiple of 8) → hex (uppercase); default key literal HsAndMoe"
"DESede/ECB|CBC/PKCS5Padding → hex(大写)；CBC IV 固定 12345678" = "DESede/ECB|CBC/PKCS5Padding → hex (uppercase); CBC IV fixed to 12345678"
"标准 SM4，ECB|CBC，0x80 补位 → hex(小写)；CBC IV 固定 0123456789ABCDEF" = "Standard SM4, ECB|CBC, 0x80 padding → hex (lowercase); CBC IV fixed to 0123456789ABCDEF"
"不支持的算法: {other}（可选 DES / HSDES / DES3 / SM4）" = "Unsupported algorithm: {other} (expected DES / HSDES / DES3 / SM4)"
"DES 初始化失败: {e:?}" = "DES init failed: {e:?}"
"DES(HsAndMoe) 初始化失败: {e:?}" = "DES(HsAndMoe) init failed: {e:?}"
"3DES 初始化失败: {e:?}" = "3DES init failed: {e:?}"
"SM4 初始化失败: {e:?}" = "SM4 init failed: {e:?}"
"DES 密钥 Hex 解析失败: {e}" = "Failed to parse the DES key as hex: {e}"
"DES 密钥长度错误: 需要 8 字节 (16 位 hex)，实际 {} 字节" = "Bad DES key length: need 8 bytes (16 hex digits), got {}"
"{algo} 密钥长度错误: 需要 {expected} 字节，实际 {} 字节（按 ASCII 原文计长）" = "Bad {algo} key length: need {expected} bytes, got {} (counted as raw ASCII)"
"Base64 解码失败: {e}" = "Base64 decode failed: {e}"
"Base64 解码后长度 {} 非法（应为 8 的倍数）" = "Decoded Base64 length {} is invalid (must be a multiple of 8)"
"Hex 解码失败: {e}" = "Hex decode failed: {e}"
"密文长度 {} 非法（应为 8 的倍数）" = "Ciphertext length {} is invalid (must be a multiple of 8)"
"密文长度 {} 非法（应为 16 的倍数）" = "Ciphertext length {} is invalid (must be a multiple of 16)"
"非法填充字节 {pad}（通常是密钥不匹配）" = "Illegal padding byte {pad} (usually a key mismatch)"
"填充字节不一致（通常是密钥错误或密文被截断）" = "Padding bytes are inconsistent (usually a wrong key or a truncated ciphertext)"
"解密结果补位异常（0x80 未字节对齐）" = "Unexpected padding in the decrypted result (0x80 is not byte-aligned)"
"补位截断失败: {e}" = "Padding trim failed: {e}"

# ── 恒生柜员（specs 展示名 / 说明 / 错误）──────────────────────────────
"MD5（兜底默认）" = "MD5 (fallback default)"
"SM2（不可复现）" = "SM2 (not reproducible)"
"加密机 smE140（不可复现）" = "HSM smE140 (not reproducible)"
"(兜底)" = "(fallback)"
"smWay 不等于以下任一值时（含未配置）走此分支" = "used when smWay matches none of the values below (including when unset)"
"非 smWay 可选值；EncryptUtils.shaEncrypt 的能力" = "Not a smWay value; the capability of EncryptUtils.shaEncrypt"
"非 smWay 可选值；EncryptUtils.sha256Encrypt 的能力" = "Not a smWay value; the capability of EncryptUtils.sha256Encrypt"
"非 smWay 可选值；EncryptUtils.sha512Encrypt 的能力" = "Not a smWay value; the capability of EncryptUtils.sha512Encrypt"
"32 位小写 hex" = "32 hex chars, lowercase"
"64 位小写 hex" = "64 hex chars, lowercase"
"40 位小写 hex" = "40 hex chars, lowercase"
"128 位小写 hex" = "128 hex chars, lowercase"
"变长 Base64" = "variable-length Base64"
"变长小写 hex" = "variable-length lowercase hex"
"EncryptUtils.shaEncrypt：UTF-16LE 无 BOM + 小写 hex" = "EncryptUtils.shaEncrypt: UTF-16LE without BOM + lowercase hex"
"EncryptUtils.sha256Encrypt：UTF-16LE 无 BOM + 小写 hex" = "EncryptUtils.sha256Encrypt: UTF-16LE without BOM + lowercase hex"
"EncryptUtils.sha512Encrypt：UTF-16LE 无 BOM + 小写 hex" = "EncryptUtils.sha512Encrypt: UTF-16LE without BOM + lowercase hex"
"PwdSm3EncryptUtil.sm3Encrypt：输入平台默认编码（UTF-8），输出小写 hex" = "PwdSm3EncryptUtil.sm3Encrypt: the platform default charset (UTF-8) is used for input, lowercase hex for output"
"SM4EncryptImpl.enc（ECB，0x80 补位）；SM4SecretKey.privateKey 为空时用内置密钥 HsAndMoeHsAndMoe" = "SM4EncryptImpl.enc (ECB, 0x80 padding); falls back to the built-in key HsAndMoeHsAndMoe when SM4SecretKey.privateKey is empty"
"Spring Bean「Encrypt」→ LCPT DesEncrypt（deskey + PKCS#5 + Base64），等价于本工具「恒生密码」的 DES-ECB" = "Spring bean Encrypt → LCPT DesEncrypt (deskey + PKCS#5 + Base64), identical to DES-ECB in the Hundsun tab"
"每次 SM2Utils.generateKeyPair() 随机生成密钥对后加密，落库密文无法离线复现" = "A random key pair is generated by SM2Utils.generateKeyPair() on every call, so the stored ciphertext cannot be reproduced offline"
"由行内硬件加密机 IEncryptService.encrypt 完成，依赖 smE140isDigit / accNo / mode / format / keyName 参数" = "Performed by the bank's HSM through IEncryptService.encrypt, using smE140isDigit / accNo / mode / format / keyName"
"不支持的算法/模式: {other}（smWay 模式：MD5 / SM3 / SM4 / SPRING / SM2 / SME140；扩展算法：SHA / SHA256 / SHA512）" = "Unsupported algorithm / mode: {other} (smWay modes: MD5 / SM3 / SM4 / SPRING / SM2 / SME140; extended: SHA / SHA256 / SHA512)"
"SM2 模式每次随机生成密钥对（SM2Utils.generateKeyPair），密文不可复现，本工具无法离线计算" = "SM2 generates a fresh key pair on every call (SM2Utils.generateKeyPair); the ciphertext cannot be reproduced and cannot be computed offline"
"smE140 模式由行内硬件加密机（IEncryptService）完成，本工具无法离线计算" = "smE140 runs on the bank's HSM (IEncryptService) and cannot be computed offline"
