# duck.compare.dir-compare 英文译文。键 = 中文源串。
#
# 与 `plugins/text-diff` 的表**故意有重叠**：运行时每个插件只读自己目录下的
# `locales/`，同族共用的错误串必须各写一份，否则英文界面会显示中文而漏译闸门全绿。


"文本对比" = "Text Diff"
"两段文本逐行比对：A/B 双栏、行内高亮、复制为 unified diff" = "Line-by-line comparison of two texts: side-by-side view, inline highlights, copy as unified diff"
"比对" = "Compare"
"文本 A" = "Text A"
"粘贴左侧（基准）文本" = "Paste the left (base) text"
"文本 B" = "Text B"
"粘贴右侧（对比）文本" = "Paste the right (target) text"
"忽略行尾空白" = "Ignore trailing whitespace"
"差异" = "Diff"
"差异清单" = "Difference list"
"目录 A" = "Directory A"
"目录 B" = "Directory B"
"选择基准目录" = "Pick the base directory"
"选择对比目录" = "Pick the comparison directory"
"文件比较" = "Directory Compare"
"比两个目录的文件清单：新增 / 删除 / 修改（大小与修改时间）" = "Compare file listings of two directories: added / removed / modified (size and mtime)"

# ── 参数（视图筛选 / 排除规则 / 输出形态）──
"跳过" = "Skip"
"node_modules, target, .log" = "node_modules, target, .log"
"显示" = "Show"
"仅差异" = "Differences only"
"全部" = "All"
"仅相同" = "Unchanged only"
"输出格式" = "Output format"
"清单" = "List"
"表格（Markdown）" = "Table (Markdown)"
"HTML 报告" = "HTML report"

# ── 结果（清单 / 表格 / HTML 三种形态共用同一份词表）──
"状态" = "Status"
"路径" = "Path"
"大小" = "Size"
"新增" = "Added"
"删除" = "Removed"
"修改" = "Modified"
"未变" = "Unchanged"
"目录" = "directory"
"差异报告" = "Diff report"
"修改时间不同" = "mtime differs"
"已按规则跳过: {}" = "Skipped by rules: {}"
"没有未变的条目" = "No unchanged entries"
"两边都是空目录" = "Both directories are empty"

# ── 工具层（duck-compare-tool）──
"两侧都是空的，没有可比的内容" = "Both sides are empty; nothing to compare"
"两侧目录都要选" = "Pick a directory on both sides"
"比对完成" = "Comparison finished"
"差异 · 新增 {} 个 · 删除 {} 个 · 修改 {} 个 · 未变 {} 个" = "Differences · {} added · {} removed · {} modified · {} unchanged"
"两边完全一致" = "The two sides are identical"

# ── 内核错误（duck-compare-core）──
"路径不是有效目录" = "The path is not a valid directory"
"路径错误" = "Invalid path"
"读取目录失败: {}" = "Failed to read directory: {}"
"读取条目失败: {}" = "Failed to read directory entry: {}"
"读取文件信息失败: {}" = "Failed to read file metadata: {}"
"创建目录失败: {}" = "Failed to create directory: {}"
