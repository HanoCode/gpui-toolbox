# duck.merge.see-merge 英文译文。键 = 中文源串。
#
# 文案来自三处：`duck-merge-core::see_merge`（逐字复刻件）、`duck-merge-tool` 的
# 结果拼版，以及 `duck-sql-core`（`sql_safety` / `sql_rewriter` / `error`）——后者的
# 中文只经由 SEE 合包的「个性化 SQL」这一步浮到界面上，所以译文登记在这里。
#
# 键是**模板**：`{}` / `{:.1}` / `{message}` 原样保留，译文占位符数量必须相等。

# ── 清单 / 参数 ──
"FINFSS 包合并" = "SEE package merge"
"把一批 SEE 分包 ZIP 合成一份：解压、内层包去重、按客户号个性化 SQL、Slim JAR 瘦身、生成 MD5 校验文件后重新打包" = "Merge a batch of SEE split ZIPs into one: unzip, de-duplicate inner packages, apply customer-specific SQL, slim the JARs, write MD5 checksums and repackage"
"包目录" = "Package directory"
"选择 SEE 分包 ZIP 所在目录" = "Pick the directory that holds the SEE split ZIPs"
"结果目录" = "Output directory"
"选择输出位置" = "Pick where the result goes"
"客户编号" = "Customer number"
"用于个性化脚本，可留空" = "Used for personalised scripts; may be empty"
"数据库类型" = "Database type"
"oracle / mysql，可留空" = "oracle / mysql, may be empty"
"当前版本" = "Current version"
"目标版本" = "Target version"
"处理自定义脚本" = "Process custom scripts"
"Slim 模式（瘦身 JAR）" = "Slim mode (strip JARs)"
"合并结果" = "Merge result"

