# duck.finance.channel-gateway 英文译文。键 = 中文源串。
#
# 与同族 `finance-pdm-reader` 的**共用串**（抬头、冒号、「名称」「类型」「是」）
# 两边各写一份：运行时每个插件只读自己目录下的 `locales/`，缺一份就会在英文界面
# 显示中文，而漏译闸门查的是所有插件表的并集、照样全绿。
#
# 带 `{}` 的条目来自 `duck-finance-tool` 的 `fill`：占位符数量与顺序必须与源串一致。
# 注意：生成的 Java 代码里**没有**这些词——模板与异常文案逐字节复制自参考仓，
# 属于「写进文件的内容」（恒生 LCPT 网关的既有约定），不参与翻译。

