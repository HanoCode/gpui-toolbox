# duck.net.packet-send 英文译文。键 = 中文源串。
#
# 与同族另外三个插件的表**故意有重叠**：运行时每个插件只读自己目录下的 `locales/`，
# 所以「连接失败」「等待超时」这类共用错误串必须各写一份，否则英文界面会显示中文
# 而漏译闸门全绿（闸门查的是所有插件表的并集）。
#
# 带 `{}` 的条目来自 `duck-net-tool` 里的 `fill`：占位符数量与顺序必须与源串一致。

# ── 清单 ──
"报文调试" = "Packet Debugger"
"TCP 报文收发：原始 / 长度字段 / ASCII 长度 / 分隔符 / 定长五种分帧，支持 GBK 与十六进制报文" = "Send and receive TCP packets with five framing modes — raw, length field, ASCII length, delimiter, fixed length — including GBK and hex payloads"
"网络" = "Network"
"报文" = "Payload"
"要发送的报文；勾选「按十六进制」后按 `3C 3F 78 6D` 或 `3C3F786D` 解析" = "The payload to send; with \"Payload is hex\" on, it is parsed as `3C 3F 78 6D` or `3C3F786D`"
"分帧" = "Framing"
"原始 TCP" = "Raw TCP"
"长度字段（二进制大端）" = "Length field (binary, big-endian)"
"ASCII 长度（补零）" = "ASCII length (zero padded)"
"分隔符" = "Delimiter"
"定长帧" = "Fixed-length frames"
"主机" = "Host"
"10.0.0.11 或 host.example.com" = "10.0.0.11 or host.example.com"
"端口" = "Port"
"长度字段宽度（字节）" = "Length-field width (bytes)"
"ASCII 头部宽度（位）" = "ASCII header width (digits)"
"支持 \\n 与 \\r\\n；也可以直接填一个符号" = "Accepts \\n and \\r\\n; a single literal character also works"
"帧长（字节）" = "Frame length (bytes)"
"编码" = "Encoding"
"报文是十六进制" = "Payload is hex"
"结果用十六进制显示" = "Show result as hex"
"连接超时（ms）" = "Connect timeout (ms)"
"读超时（ms）" = "Read timeout (ms)"
"最多收几帧" = "Max frames"
"应答字节上限" = "Response byte limit"
"应答与通信日志" = "Replies and traffic log"

# ── 运行期 ──
"：" = ": "
"分隔符协议要指定分隔符（例如 \\n 或 \\r\\n）" = "The delimiter framing needs a delimiter (for example \\n or \\r\\n)"
"连接 {}:{}" = "Connecting to {}:{}"
"发送到 {}:{}（协议 {} · 编码 {}）" = "Sent to {}:{} (framing {} · encoding {})"
"发出 {} 字节，耗时 {} ms" = "Sent {} bytes in {} ms"
"发出（十六进制）" = "Sent (hex)"
"收到 {} 帧 / {} 字节" = "Received {} frames / {} bytes"
"第 {} 帧（{} 字节）" = "Frame {} ({} bytes)"
"（还有 {} 帧未列出）" = "({} more frames not listed)"
"尾巴 {} 字节（没凑成完整帧，可能是对端没发完或多给了分隔符）" = "Trailing {} bytes did not form a complete frame — the peer may have stopped early or sent an extra delimiter"
"对端没有返回任何数据（连上了，但没应答）" = "The peer returned no data (connected, but nothing came back)"
"ASCII 长度" = "ASCII length"
"长度字段" = "Length field"
"定长" = "Fixed length"
"（文本视图 {}）" = "(text view, {})"
"长度字段宽度是 {} 字节，只支持 1 / 2 / 4" = "Length-field width is {} bytes; only 1 / 2 / 4 are supported"
"长度字段是 0，无法据此切帧" = "The length field is 0, so no frame can be cut from it"
"ASCII 长度头部不是文本：{}" = "The ASCII length header is not text: {}"
"ASCII 长度头部全是 0" = "The ASCII length header is all zeros"
"ASCII 长度头部不是数字：{}" = "The ASCII length header is not a number: {}"
"报文声明 {} 字节，超过上限 {}" = "The frame declares {} bytes, above the limit of {}"
"帧还没收全：声明 {} 字节，只到 {} 字节" = "The frame is incomplete: {} bytes declared, only {} received"

# ── 公共错误串（四族插件各一份） ──
"输入不完整，请检查必填项" = "Input is incomplete — check the required fields"
"URL 写错了（需要以 http:// 或 https:// 开头）" = "Bad URL — it must start with http:// or https://"
"请求头格式不对（每行应为「名字: 值」）" = "Bad header format — each line must be \"Name: value\""
"不支持这种协议或方法" = "This protocol or method is not supported"
"等待超时" = "Timed out"
"域名解析失败" = "DNS lookup failed"
"连接失败" = "Connection failed"
"TLS 握手或证书校验失败" = "TLS handshake or certificate verification failed"
"服务端返回了错误状态" = "The server returned an error status"
"认证失败" = "Authentication failed"
"报文解析失败" = "Failed to decode the payload"
"内容超过上限" = "Content exceeds the limit"
"读写失败" = "Read/write failed"
"路径不存在" = "Path does not exist"
"权限不足" = "Permission denied"
