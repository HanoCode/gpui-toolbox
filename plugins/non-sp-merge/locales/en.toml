# duck.merge.non-sp-merge 英文译文。键 = 中文源串。
#
# 两条来源：`duck-merge-core/src/non_sp_merge.rs`（逐字复刻件，`format!` 插值后的
# 日志与错误，运行时走 `duck_plugin_process::render::Renderer` 的模板反查，所以
# **键必须是模板**：`{}` / `{:.1}` 原样保留，两边占位符数量必须相等），以及
# `crates/duck-merge-tool` 里这个工具的拼版文案。
#
# ⚠️ 基底那一大段是从 `plugins/pkg-merge/locales/en.toml` 整份搬来的：两个工具共用
# `merge_common` / `upd_merge` / `sql_merge` 三个复刻件，而那些文案在**运行期只能从
# 本插件自己的目录**读到（`DUCK_LOCALES_DIR` 指向本目录，不会去读别人的表）。所以
# 宁可留一批「本插件走不到」的 sp 专属条目，也不能靠「另一张表里有」蒙混——后者在
# 英文界面下会静默回落中文，而 i18n 闸门因为「任意插件表里有」照样全绿。
#
# ⚠️ 文末「冲突报告（同值）」那一组是**故意不翻**的：报告写进结果目录的
# `合并检查结果.txt`，每一行都按 `pad_display` 的显示宽度（CJK 记 2 列）排过版，是
# 交付给客户的中文产物（与《版本回退核对清单.txt》同一处置）；翻译会把这套定宽
# 排版全部错位。其中的 `版本号` / `修改日期` / `新包(…)` / `已合并(…)` 还参与内核
# 判断（`decision.rule == "版本号"`），更不能动。

