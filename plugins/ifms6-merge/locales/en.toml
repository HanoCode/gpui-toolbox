# duck.merge.ifms6-merge 英文译文。键 = 中文源串。
#
# 绝大多数条目来自 `duck-merge-core::ifms6_merge`（逐字复刻件）：那些是 `format!`
# 插值后的日志与错误，运行时走 `duck_plugin_process::render::Renderer` 的模板反查，
# 所以**键必须是模板**（`{}` / `{:?}` / `{:.1}` 原样保留），译文只写 `{}`，
# 两边占位符数量必须相等。
#
# 键里的前导空格是源码字面量的一部分（`"  SQL: 找到 db zip {}"` 用来对齐日志缩进），
# 不是笔误。

# ── 清单 / 参数 ──
"v6-see 合并" = "IFMS6 merge"
"把多个 IFMS6.0 版本包按顺序合成一份：前端、服务端、数据库包、ifmcounter、spconfig 分块合并后重新打包，并核对 .class 版本回退" = "Merge several IFMS6.0 version packages in order into one: front end, server, database packages, ifmcounter and spconfig are merged block by block and repackaged, with a .class version-regression check"
"包目录" = "Package directory"
"选择包含 IFMS6 版本子目录的目录" = "Pick the directory that holds the IFMS6 version subdirectories"
"结果目录" = "Output directory"
"选择合并结果输出位置" = "Pick where the merged result goes"
"参与合并的版本" = "Versions to merge"
"留空则自动扫描；也可手填，逗号分隔" = "Leave empty to scan automatically, or list versions separated by commas"
"合并 SQL 脚本" = "Merge SQL scripts"
"合并结果" = "Merge result"
"源目录里没有找到版本包（IFMS6.0V* 目录或 .zip）" = "No version packages found in the source directory (IFMS6.0V* directories or .zip)"
"扫描到 {} 个版本" = "Found {} versions"
"数据库包合并…" = "Merging database packages…"
"合并完成 · {} 个版本 · {} s" = "Merge complete · {} versions · {} s"
"分块结果：前端 {} · 服务端 {} · 数据库 {} · ifmcounter {} · spconfig {}" = "Blocks: front end {} · server {} · database {} · ifmcounter {} · spconfig {}"

