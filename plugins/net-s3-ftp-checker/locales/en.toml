# duck.net.s3-ftp-checker 英文译文。键 = 中文源串。
#
# 与同族另外三个插件的表**故意有重叠**：运行时每个插件只读自己目录下的 `locales/`，
# 所以「连接失败」「认证失败」这类共用错误串必须各写一份，否则英文界面会显示中文
# 而漏译闸门全绿（闸门查的是所有插件表的并集）。
#
# 带 `{}` 的条目来自 `duck-net-tool` 里的 `fill`：占位符数量与顺序必须与源串一致。

# ── 清单 ──
"S3 / FTP 连通检测" = "S3 / FTP Check"
"分步检测 S3 兼容存储、FTP 与 SFTP 的连通性：网络、凭据、权限分别给结论" = "Step-by-step connectivity checks for S3-compatible storage, FTP and SFTP — network, credentials and permissions each get their own verdict"
"网络" = "Network"
"协议" = "Protocol"
"S3 / 兼容对象存储" = "S3 / compatible object storage"
"主机 / Endpoint" = "Host / Endpoint"
"S3 填 https://s3.amazonaws.com 或 minio.lan:9000；FTP/SFTP 填 10.0.0.11" = "For S3 use https://s3.amazonaws.com or minio.lan:9000; for FTP/SFTP use e.g. 10.0.0.11"
"端口" = "Port"
"FTP 21、SFTP 22（S3 不用）" = "FTP 21, SFTP 22 (unused for S3)"
"用户名" = "User name"
"FTP / SFTP 用户名（S3 不用）" = "FTP / SFTP user name (unused for S3)"
"口令" = "Password"
"只用于本次检测，不落盘、不进日志" = "Used only for this check — never written to disk or logs"
"私钥" = "Private key"
"选用密钥登录时指定（留空则用口令）" = "Pick one for key-based login (leave empty to use the password)"
"远端目录" = "Remote directory"
"留空 = 只验证认证，不检查目录（例如 /data/incoming）" = "Empty means auth only, no directory check (for example /data/incoming)"
"留空 = 匿名访问（公共桶）" = "Empty means anonymous access (public bucket)"
"与 Access Key 一起填，或者都留空" = "Fill it together with Access Key, or leave both empty"
"留空 = us-east-1" = "Empty means us-east-1"
"跳过证书校验" = "Skip certificate check"
"超时（ms）" = "Timeout (ms)"
"检测结果" = "Check result"

# ── 运行期 ──
"：" = ": "
"FTP 登录 {}" = "FTP login {}"
"SSH 认证 {}" = "SSH auth {}"
"{} · {} · 耗时 {} ms" = "{} · {} · {} ms"
"目标" = "Target"
"对端：{}" = "Server: {}"
"步骤" = "Steps"
"结论：通过" = "Result: passed"
"结论：失败" = "Result: failed"
"建议：{}" = "Hint: {}"
"凭据" = "Credentials"
"发出请求" = "Request sent"
"响应状态" = "Response status"
"TCP 连接" = "TCP connection"
"欢迎语" = "Greeting"
"SSH 认证" = "SSH auth"
"远端路径" = "Remote path"
"Access Key 与 Secret Key 要一起填，或者都留空做匿名访问" = "Access Key and Secret Key go together — or leave both empty for anonymous access"
"检查主机、端口与网络：拒绝连接看防火墙，解析失败看 DNS" = "Check host, port and network: refused means firewall, lookup failure means DNS"
"认证没过：核对用户名、口令或私钥，以及服务端的登录限制" = "Authentication failed: check the user name, password or key, plus the server's login restrictions"
"认证已通过但目录进不去：换一个路径，或确认账号有该目录的读权限" = "Authenticated but the directory is unreachable: use another path, or grant the account read access to it"
"口令被拒：核对用户名口令，注意服务端是否要求被动模式或 TLS" = "Password rejected: check the credentials, and whether the server requires passive mode or TLS"
"403：桶存在但没权限 —— 核对 AccessKey/SecretKey 与桶策略" = "403: the bucket exists but access is denied — check AccessKey/SecretKey and the bucket policy"
"404：桶不存在 —— 核对桶名，或 Endpoint 是否指向了正确的区域" = "404: the bucket does not exist — check the name, or whether Endpoint points at the right region"
"301：桶在另一个区域 —— 改 Region，或换成该区域的 Endpoint" = "301: the bucket lives in another region — change Region, or use that region's Endpoint"
"5xx：对端内部错误 —— 稍后重试，或让对方查服务端日志" = "5xx: the server had an internal error — retry later, or ask the owner to check its logs"
"状态不是 200：先看响应头，再核对签名与桶权限" = "Status is not 200: read the response headers, then check the signature and bucket permissions"

# ── 公共错误串（四族插件各一份） ──
"输入不完整，请检查必填项" = "Input is incomplete — check the required fields"
"URL 写错了（需要以 http:// 或 https:// 开头）" = "Bad URL — it must start with http:// or https://"
"请求头格式不对（每行应为「名字: 值」）" = "Bad header format — each line must be \"Name: value\""
"不支持这种协议或方法" = "This protocol or method is not supported"
"等待超时" = "Timed out"
"域名解析失败" = "DNS lookup failed"
"连接失败" = "Connection failed"
"TLS 握手或证书校验失败" = "TLS handshake or certificate verification failed"
"服务端返回了错误状态" = "The server returned an error status"
"认证失败" = "Authentication failed"
"报文解析失败" = "Failed to decode the payload"
"内容超过上限" = "Content exceeds the limit"
"读写失败" = "Read/write failed"
"路径不存在" = "Path does not exist"
"权限不足" = "Permission denied"
