# duck.files.batch-edit 英文译文。键 = 中文源串。
#
# 同族共用的错误串各写一份（运行时每个插件只读自己的 `locales/`），理由见
# `plugins/files-search/locales/en.toml` 的表头。

# ── 清单 ──
"批量文件查找替换" = "Batch Edit"
"按目录批量改名或替换内容：先预览再应用，每次操作都可在下一次运行里撤销" = "Batch rename or content-replace across a directory: preview first, and every run can be undone in a later run"
"文件" = "Files"
"查找" = "Find"
"改名模式下是文件名里要找的片段（留空 = 只加前缀后缀）；替换模式下是要找的内容" = "Rename mode: the fragment to look for in file names (empty means prefix/suffix only). Replace mode: the content to find."
"替换为" = "Replace with"
"改名模式下留空 = 删掉找到的片段；替换模式支持 $1 / ${name} 引用分组" = "Rename mode: empty drops the matched fragment. Replace mode: $1 / ${name} reference groups."
"改写什么" = "What to edit"
"文件名" = "File names"
"文件内容" = "File contents"
"动作" = "Action"
"预览（不改动）" = "Preview (no changes)"
"应用" = "Apply"
"撤销上一次" = "Undo last run"
"查看撤销记录" = "List undo records"
"目录" = "Directory"
"选择要处理的目录（撤销时可不填）" = "Pick the directory to work on (not needed when undoing)"
"按正则解析" = "Match as regex"
"区分大小写" = "Case sensitive"
"加前缀" = "Add prefix"
"如 backup_，留空不加" = "e.g. backup_ ; empty adds nothing"
"加后缀" = "Add suffix"
"如 _2024，留空不加" = "e.g. _2024 ; empty adds nothing"
"只处理这些文件" = "Only these files"
"*.txt,*.md，逗号分隔，留空 = 全部（.bak 永远跳过）" = "*.txt,*.md — comma separated; empty means all files (.bak is always skipped)"
"最大深度" = "Max depth"
"包含隐藏项" = "Include hidden entries"
"改写报告" = "Edit report"

# ── 报告 ──
"正在读取文件清单…" = "Reading the file list…"
"扫描 {} 个文件 · 需要改名 {} 个" = "scanned {} files · {} to rename"
"文件清单已截断（达到条目上限）" = "File list truncated (entry cap reached)"
"没有需要改名的文件" = "No file needs renaming"
"将改名" = "will rename"
"跳过" = "skipped"
"……其余 {} 行未显示" = "…{} more rows not shown"
"确认无误后，把「动作」改成「应用」再运行一次" = "When the preview looks right, switch Action to Apply and run again"
"没有可应用的改名" = "No rename to apply"
"已改名 {} 个文件" = "renamed {} files"
"{} 个失败" = "{} failed"
"撤销记录：{}" = "Undo record: {}"
"要回滚，把「动作」改成「撤销」再运行一次" = "To roll back, switch Action to Undo last run and run again"
"新名字不合法（空或含路径分隔符）" = "Invalid new name (empty or contains a path separator)"
"本批里有文件改到同一个名字" = "Two files in this batch would end up with the same name"
"目标文件已存在" = "Target file already exists"
"未知原因" = "unknown reason"
"正在替换…" = "Replacing…"
"替换 {} 处，涉及 {} 个文件" = "replaced {} matches across {} files"
"{} 个文件处理失败" = "{} files failed"
"扫描 {} 个文件 · 命中 {} 处 · 涉及 {} 个文件" = "scanned {} files · {} matches · {} files hit"
"{} 个文件读不了（非 UTF-8 等）" = "{} files unreadable (not UTF-8, etc.)"
"没有命中任何内容" = "Nothing matched"
"{} 处" = "{} matches"
"……其余 {} 个文件未显示" = "…{} more files not shown"
"正在撤销…" = "Undoing…"
"已恢复 {} 个文件" = "restored {} files"
"{} 项恢复失败（记录已保留，可修好路径再撤）" = "{} items could not be restored (the record is kept — fix the paths and undo again)"
"可撤销记录：{} 条（新的在前）" = "Undo records: {} (newest first)"
"改名" = "rename"
"替换" = "replace"
"{} 个文件" = "{} files"

# ── 内核错误 ──
"路径不存在" = "Path not found"
"路径不是目录" = "Not a directory"
"路径不是文件" = "Not a file"
"路径包含非法字符 '..'，拒绝访问" = "Path contains '..'; access denied"
"拒绝访问系统路径" = "System paths are off limits"
"文件不是 UTF-8 编码，无法处理" = "File is not UTF-8 text and cannot be processed"
"正则表达式写错了" = "Invalid regular expression"
"输入是空的，没有可处理的内容" = "Nothing to work with: the input is empty"
"这种格式不支持" = "This format is not supported"
"文件太大" = "File too large"
"目标已存在，改名会覆盖" = "Target already exists; the rename would overwrite it"
"没有可撤销的记录" = "Nothing to undo"
"读写文件失败" = "File I/O failed"
