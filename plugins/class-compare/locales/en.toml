# duck.compare.class-compare 英文译文。键 = 中文源串。
#
# 与 `plugins/jar-compare` / `dir-compare` / `text-diff` 的表**故意有重叠**：运行时每个
# 插件只读自己目录下的 `locales/`，同族共用的串（`路径不是有效目录` 之类）必须各写一份，
# 否则英文界面会显示中文，而漏译闸门全绿（闸门查的是所有插件表的并集）。
#
# 带 `{}` 的条目来自工具层的 `fill`，占位符数量与顺序必须与源串一致。

# ── 插件元信息与表单 ──
"Class 代码比对" = "Class Compare"
"两套应用目录里的同名 .class 逐个比版本：升级 / 回退 / 新增" = "Compare every same-named .class across two webapp directories: upgrade / rollback / new"
"比对" = "Compare"
"目录 A" = "Directory A"
"目录 B" = "Directory B"
"选择基准目录（新版本一侧）" = "Pick the base directory (the new version side)"
"选择对比目录（现场一侧）" = "Pick the comparison directory (the on-site side)"
"基准环境" = "Base environment"
"对比环境" = "Comparison environment"
"上线包" = "Release package"
"生产包" = "Production package"
"测试包" = "Test package"
"下发包" = "Distribution package"
"自定义" = "Custom"
"自定义基准环境名" = "Custom base environment name"
"例如 财务生产 / 2026 一季度上线" = "e.g. Finance production / Q1 2026 release"
"自定义对比环境名" = "Custom comparison environment name"
"例如 现场生产 / 客户 UAT" = "e.g. On-site production / customer UAT"
"显示" = "Show"
"全部差异" = "All differences"
"仅异常" = "Abnormal only"
"升级" = "Upgraded"
"回退" = "Rolled back"
"相同" = "Identical"
"连 WEB-INF/lib 下的 JAR 一起比" = "Also compare the JARs under WEB-INF/lib"
"排除的 JAR" = "Excluded JARs"
"逗号分隔，支持 * 通配，例如 spring-*,*-sources.jar" = "Comma-separated, * wildcards allowed, e.g. spring-*,*-sources.jar"
"CSV 导出目录" = "CSV export directory"
"留空 = 只出报告（不写盘）" = "Leave empty to only print the report (nothing is written)"
"比对结果" = "Comparison result"

