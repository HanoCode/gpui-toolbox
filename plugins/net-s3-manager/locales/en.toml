# duck.net.s3-manager 英文译文。键 = 中文源串。
#
# 与同族另外三个插件的表**故意有重叠**：运行时每个插件只读自己目录下的 `locales/`，
# 所以「连接失败」「认证失败」这类共用错误串必须各写一份，否则英文界面会显示中文
# 而漏译闸门全绿（闸门查的是所有插件表的并集）。
#
# 带 `{}` 的条目来自 `duck-net-tool` 里的 `fill`：占位符数量与顺序必须与源串一致。

# ── 清单 ──
"S3 对象存储" = "S3 Storage"
"浏览与操作 S3 兼容对象存储：列桶、列对象、上传下载、复制改名、删除、预览" = "Browse and operate S3-compatible object storage: buckets, objects, upload/download, copy/rename, delete, preview"
"网络" = "Network"
"对象 Key" = "Object key"
"例如 config/app.yaml（列桶 / 列对象时留空）" = "For example config/app.yaml (leave empty when listing buckets or objects)"
"动作" = "Action"
"列出对象" = "List objects"
"列出存储桶" = "List buckets"
"上传文件" = "Upload file"
"下载对象" = "Download object"
"复制 / 改名" = "Copy / rename"
"新建目录" = "Create folder"
"预览文本" = "Preview text"
"删除对象" = "Delete object"
"新建存储桶" = "Create bucket"
"删除存储桶" = "Delete bucket"
"对象地址" = "Object URL"
"Endpoint" = "Endpoint"
"https://s3.amazonaws.com 或 http://minio.lan:9000" = "https://s3.amazonaws.com or http://minio.lan:9000"
"存储桶" = "Bucket"
"除「列出存储桶」外都要填" = "Required for everything except List buckets"
"前缀" = "Prefix"
"列举时当目录用；上传 / 新建时自动拼在 Key 前" = "Acts as the directory when listing; prepended to the key on upload or create"
"区域" = "Region"
"留空 = us-east-1" = "Empty means us-east-1"
"Access Key" = "Access Key"
"留空 = 匿名访问（公共桶）" = "Empty means anonymous access (public bucket)"
"Secret Key" = "Secret Key"
"与 Access Key 一起填，或者都留空" = "Fill it together with Access Key, or leave both empty"
"路径风格" = "Path style"
"跳过证书校验" = "Skip certificate check"
"目标 Key" = "Destination key"
"复制 / 改名的目的地" = "Where the copy or rename goes"
"改名（删掉源对象）" = "Rename (delete the source object)"
"目录名" = "Folder name"
"建在「前缀」下面" = "Created under Prefix"
"本地文件" = "Local file"
"要上传的文件" = "The file to upload"
"下载到" = "Download to"
"留空 = 当前目录" = "Empty means the current directory"
"结果" = "Result"

# ── 运行期 ──
"：" = ": "
"{} · {} · 耗时 {} ms" = "{} · {} · {} ms"
"目标" = "Target"
"列出对象 {}" = "Listing objects in {}"
"名称" = "Name"
"创建时间" = "Created"
"大小" = "Size"
"修改时间" = "Modified"
"共 {} 个存储桶" = "{} buckets"
"{} · 共 {} 个目录 / {} 个对象（前缀 {}）" = "{} · {} folders / {} objects (prefix {})"
"这里没有对象" = "No objects here"
"超过一页（1000 条），请用「前缀」缩小范围" = "More than one page (1000 entries) — narrow it down with Prefix"
"新建存储桶 {}" = "Creating bucket {}"
"删除存储桶 {}" = "Deleting bucket {}"
"已创建 {}" = "Created {}"
"已删除 {}" = "Deleted {}"
"新建目录 {}" = "Creating folder {}"
"已创建目录 {}/" = "Created folder {}/"
"上传 {} → {}" = "Uploading {} → {}"
"已上传 {}（{}）" = "Uploaded {} ({})"
"下载 {} → {}" = "Downloading {} → {}"
"已下载 {}（{}）" = "Downloaded {} ({})"
"复制 {} → {}" = "Copying {} → {}"
"已复制 {} → {}" = "Copied {} → {}"
"改名 {} → {}" = "Renaming {} → {}"
"已改名 {} → {}" = "Renamed {} → {}"
"删除对象 {}" = "Deleting object {}"
"读取对象 {}" = "Reading object {}"
"共 {} 字节" = "{} bytes"
"（内容过长，只显示前 {} 个字符；完整内容请用「下载」）" = "(Content is too long — showing the first {} characters; use Download for the full object)"
"这是对象地址，不是预签名地址：私有桶直接打开会返回 403" = "This is the object URL, not a presigned one: opening it in a private bucket returns 403"

