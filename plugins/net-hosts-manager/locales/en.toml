# duck.net.hosts-manager 英文译文。键 = 中文源串。
#
# 与同族另外三个插件的表**故意有重叠**：运行时每个插件只读自己目录下的 `locales/`，
# 所以「路径不存在」「读写失败」这类共用错误串必须各写一份，否则英文界面会显示中文
# 而漏译闸门全绿（闸门查的是所有插件表的并集）。
#
# 带 `{}` 的条目来自 `duck-net-tool` 里的 `fill`。
# ⚠️ 以 `#` 开头的三条（`# 由 Hosts 管理工具生成` / `# 生成时间：{}` /
# `# ===== 方案：{}（{}） =====`）是**写进合并结果里的注释行**：它们会随导出文件
# 一起落到用户的 hosts 文件里，所以翻译它们是有意义的（英文界面导出的 hosts
# 带英文注释），不是漏网的表单文案。

# ── 清单 ──
"Hosts 管理" = "Hosts Manager"
"合并多个环境的 hosts 方案：逐方案校验、跨方案查找替换与对比，并给出写回系统 hosts 的命令" = "Merge hosts profiles from several environments: per-profile checks, cross-profile search/replace and diff, plus the commands to apply the result"
"网络" = "Network"
"方案目录" = "Profiles folder"
"每个 *.hosts / *.txt 文件算一个方案，按文件名排序合并；文件头可写 `# name:` / `# env:` / `# owner:` / `# ticket:` / `# enabled: false`" = "Every *.hosts / *.txt file is one profile, merged in file-name order; the header may carry `# name:` / `# env:` / `# owner:` / `# ticket:` / `# enabled: false`"
"方案名称" = "Profile name"
"文件里没写 `# name:` 时用这个（如 张三-联调）" = "Used when a file has no `# name:` line (e.g. zhang-integration)"
"环境" = "Environment"
"联调" = "Integration"
"开发" = "Development"
"预生产" = "Pre-production"
"生产" = "Production"
"灾备" = "Disaster recovery"
"公共" = "Shared"
"导出到" = "Export to"
"留空 = 只在结果区预览（例如 ~/Downloads/hosts.merged）" = "Empty means preview only (for example ~/Downloads/hosts.merged)"
"连停用的方案一起合并" = "Merge disabled profiles too"
"跨方案查找" = "Search all profiles"
"留空 = 不查（关键词会扫全部方案，含停用的；注释行也算）" = "Empty means no search (scans every profile including disabled ones; comment lines count too)"
"替换为" = "Replace with"
"配合上面的关键词使用；留空 = 只查找不替换（字面量替换，`.` 不是通配符）" = "Used with the keyword above; empty means search only (literal replacement, `.` is not a wildcard)"
"替换结果写到" = "Write replaced profiles to"
"留空 = 只报告处数不落盘。写出的每个方案为 <文件名>.hosts；不能与原目录相同" = "Empty means report counts only. Each profile is written as <name>.hosts; must differ from the source folder"
"对比方案 A" = "Compare profile A"
"方案文件名（不带扩展名，如 a-sit），也可以写方案名" = "File name without extension (for example a-sit), or the profile name"
"对比方案 B" = "Compare profile B"
"填齐 A / B 才对比；只比生效行（注释与空行不参与）" = "Fill both A and B to compare; only effective lines count (comments and blanks are ignored)"
"附带写入命令" = "Include apply commands"
"方案清单 · 合并结果 · 校验 · 查找 · 对比" = "Profiles · Merged result · Checks · Search · Diff"

# ── 运行期 ──
"先选一个方案目录（每个 *.hosts / *.txt 文件算一个方案）" = "Pick a profiles folder first (each *.hosts / *.txt file is one profile)"
"目录里没有方案文件（*.hosts / *.txt）" = "No profile files in that folder (*.hosts / *.txt)"
"：" = ": "
"# 由 Hosts 管理工具生成" = "# Generated by the Hosts Manager"
"# 生成时间：{}" = "# Generated at: {}"
"# ===== 方案：{}（{}） =====" = "# ===== Profile: {} ({}) ====="
"合并 {} 个方案（{} 条生效 · {} 个域名）" = "Merged {} profiles ({} active entries · {} domains)"
"另有 {} 个方案已停用，没有进入合并" = "{} more profile(s) are disabled and stay out of the merge"
"方案清单" = "Profiles"
"合并结果" = "Merged result"
"负责人" = "owner"
"变更单" = "ticket"
"{} 条 / {} 域名" = "{} entry(ies) / {} domain(s)"
"已停用" = "disabled"
"校验（逐方案）" = "Checks (per profile)"
"无问题" = "no problems"
"{} 处问题" = "{} problem(s)"
"合并结果检查（跨方案冲突也在这里）" = "Merged result checks (cross-profile conflicts show up here)"
"合并结果没有新增问题（上面逐方案已列出）" = "The merge adds no new problems (all were listed per profile above)"
"查找「{}」：没有命中" = "Search \"{}\": no matches"
"查找「{}」：{} 处命中" = "Search \"{}\": {} match(es)"
"替换「{}」→「{}」：共 {} 处" = "Replaced \"{}\" → \"{}\": {} in total"
"没有方案命中，什么都没改" = "No profile matched — nothing changed"
"{} 处" = "{} occurrence(s)"
"已写出 {} 个方案文件到 {}（原目录未改动）" = "Wrote {} profile file(s) to {} (the source folder is untouched)"
"（把这个目录回填到「方案目录」再跑一次，就能拿到替换后的合并结果）" = "(point \"Profiles folder\" at it and run again to get the merged result after replacement)"
"「替换结果目录」不能和方案目录是同一个：那样会直接改掉原文件" = "The replaced-output folder must differ from the profiles folder — otherwise the original files are overwritten"
"所有方案都被停用了（文件头写了 `# enabled: false`）：没有内容可合并" = "Every profile is disabled (`# enabled: false` in the header): nothing to merge"
"找不到要对比的方案（可用的是：{}）" = "Cannot find that profile (available: {})"
"方案对比：{} ←→ {}" = "Profile diff: {} ←→ {}"
"两边生效行完全一致（注释与空行不参与）" = "The effective lines are identical (comments and blanks are ignored)"
"仅 {} 有" = "Only in {}"
"（还有 {} 行未列出）" = "({} more lines not listed)"
"检查发现 {} 处问题" = "Found {} problem(s)"
"第 {} 行" = "line {}"
"（还有 {} 处未列出）" = "({} more not listed)"
"检查通过：没有发现格式问题" = "Checks passed: no format problems found"
"已导出 {} 字节到 {}" = "Exported {} bytes to {}"
"写入系统（插件不碰 /etc/hosts，请自己执行）· macOS / Linux" = "Apply it yourself — the plugin never touches /etc/hosts · macOS / Linux"
"Windows（以管理员身份运行 CMD）" = "Windows (run CMD as administrator)"
"与当前系统 hosts 相比：没有变化" = "Compared with the current system hosts: no change"
"与当前系统 hosts 相比：本工具多 {} 行，系统多 {} 行" = "Compared with the current system hosts: this merge adds {} lines, the system has {} extra"
"（系统 hosts 没有本工具之外的行，覆盖是安全的）" = "(the system hosts has no lines beyond this merge — overwriting is safe)"
"（下面这些是系统里有、合并结果里没有的：覆盖后会消失，确认不用保留）" = "(these lines exist in the system hosts but not in the merge: they disappear once overwritten — make sure none must be kept)"
"先备份当前系统 hosts" = "Back up the current system hosts first"
"把合并结果覆盖到系统 hosts" = "Overwrite the system hosts with the merged result"
"刷新 DNS 缓存" = "Flush the DNS cache"
"缺少主机名：格式应为「IP 主机名 …」" = "Missing host name: the format is \"IP hostname …\""
"非法 IP：{}" = "Invalid IP: {}"
"可疑主机名：{}" = "Suspicious host name: {}"
"域名重复：{}（第一次出现在第 {} 行）" = "Duplicate host name: {} (first seen on line {})"
"错误" = "Error"
"警告" = "Warning"

