# duck.text.random-gen 英文译文。键 = 中文源串。
#
# 与同族插件的表**故意有重叠**：运行时每个插件只读自己目录下的 `locales/`，所以
# `fail()` 里那十几条共用错误串必须各写一份，否则英文界面会显示中文而漏译闸门全绿
# （闸门查的是所有插件表的并集）。
#
# 带 `{}` 的条目来自 `duck-files-tool` 的 `fill`：占位符数量与顺序必须与源串一致
# （`{}TIN` / `{}姓名` / `股东{}` 这几条英文词序与中文相反，就是靠模板位置表达的）。

