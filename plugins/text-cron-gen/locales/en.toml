# duck.text.cron-gen 英文译文。键 = 中文源串。

"Cron 生成" = "Cron Expression"
"常用调度模板一键生成，自定义表达式校验并翻译成人类可读描述" = "One-click scheduling presets, plus validation and human-readable description of custom expressions"

"模板" = "Preset"
"每分钟" = "Every minute"
"每小时" = "Every hour"
"每天指定时刻" = "Daily at a given time"
"每周指定天" = "Weekly on a given day"
"工作日指定时刻" = "Weekdays at a given time"
"每月指定日" = "Monthly on a given day"
"每年指定月日" = "Yearly on a given date"
"校验自定义表达式" = "Validate a custom expression"
"时刻（时）" = "Time (hour)"
"时刻（分）" = "Time (minute)"
"星期几（1=周一 … 7=周日）" = "Weekday (1=Mon … 7=Sun)"
"几号（1-31）" = "Day of month (1-31)"
"几月（1-12）" = "Month (1-12)"
"自定义表达式" = "Custom expression"
"模板选「校验自定义表达式」时填写，如 0 9 * * 1-5" = "Required when preset is \"validate a custom expression\", e.g. 0 9 * * 1-5"
"表达式与说明" = "Expression and description"

"字段数应为 5（分 时 日 月 周），当前 {} 个" = "Expected 5 fields (min hour dom mon dow), got {}"
"第 {} 分钟" = "minute {}"
"{} 点" = "at {}:00"
"每日" = "every day"
"每月 {} 号" = "day {} of the month"
"每年 {} 月 {} 号" = "{}/{} every year"
"每月" = "every month"
"{} 月" = "month {}"
"表达式：{}" = "Expression: {}"
"请在输入框填写要校验的表达式" = "Enter the expression to validate in the input field"
"表达式含非法字符（只允许数字 * , - / 和空格）" = "Expression contains invalid characters (only digits, * , - / and spaces allowed)"
"未知模板：{}" = "Unknown preset: {}"
"未来执行时间（{} 条）" = "Next runs ({} shown)"
"无匹配时间" = "No matching time"
"{}（{}）" = "{} ({})"

# 星期名：`周{}` 的实参就是这些单字，不逐个翻译的话英文界面会冒中文。
"周{}" = "{}"
"、" = ", "
"日" = "Sun"
"一" = "Mon"
"二" = "Tue"
"三" = "Wed"
"四" = "Thu"
"五" = "Fri"
"六" = "Sat"
