"先选一个 PDM 文件或目录" = "Pick a PDM file or folder first"
"目录里没有可解析的 .pdm / .xml 文件: {}" = "No readable .pdm / .xml file in this folder: {}"
"解析了 {} 个文件" = "Parsed {} file(s)"
"{} 个文件读不了，已跳过" = "Skipped {} unreadable file(s)"
"解析了 {} 张表" = "Parsed {} table(s)"
"合并数据字典" = "Merged dictionary"
"跳过的文件:" = "Skipped files:"
"文件" = "File"
"在「表」里填表代码或名字的一部分" = "Fill in Table with a code or part of a name"
