# duck.finance.pdm-reader 英文译文。键 = 中文源串。
#
# 与同族 `finance-channel-gateway` 的**共用串**（抬头、冒号、「名称」「类型」「是」）
# 两边各写一份：运行时每个插件只读自己目录下的 `locales/`，缺一份就会在英文界面
# 显示中文，而漏译闸门查的是所有插件表的并集、照样全绿。
#
# 带 `{}` 的条目来自 `duck-finance-tool` 的 `fill`：占位符数量与顺序必须与源串一致。
# `Labels`（数据字典的表头词）也在这一份里：它们由 `pdm-reader` 传给内核渲染器。

# ── 清单 ──
"PDM 阅读器" = "PDM Reader"
"解析 PowerDesigner PDM（.pdm / .xml）：浏览表结构与字段、生成建表 SQL 与注释、导出数据字典" = "Parse PowerDesigner PDM files (.pdm / .xml): browse tables and columns, generate CREATE TABLE and COMMENT statements, export data dictionaries"
"数据管理" = "Data"
"动作" = "Action"
"表清单" = "Table list"
"字段明细" = "Column detail"
"建表 SQL" = "CREATE TABLE SQL"
"注释语句" = "COMMENT statements"
"插入 SQL" = "INSERT statements"
"{} 张表的插入语句" = "INSERT statements for {} table(s)"
# 插入骨架里留给用户填值的那行注释（`-- TODO: 添加值`，写进 .sql 文件）。
"TODO: 添加值" = "TODO: add values"
"数据字典 Markdown" = "Dictionary as Markdown"
"数据字典 HTML" = "Dictionary as HTML"
"数据字典 Word" = "Dictionary as Word"
"数据字典 Excel" = "Dictionary as Excel"
"数据字典 PDF" = "Dictionary as PDF"
"来源" = "Source"
"单个 PDM 文件" = "Single PDM file"
"整个目录（合并）" = "Whole folder (merged)"
"PDM 文件" = "PDM file"
"选一个 .pdm 或 .xml" = "Pick a .pdm or .xml file"
"目录" = "Folder"
"递归找 .pdm / .xml 并合并成一份模型" = "Find .pdm / .xml recursively and merge into one model"
"表" = "Table"
"表代码或名字的一部分；留空 = 全部（「字段明细」必填）" = "Table code or part of its name; empty means every table (required for Column detail)"
"方言" = "Dialect"
"Oracle（双引号 + 分号）" = "Oracle (double quotes + semicolons)"
"MySQL（反引号 + 列注释）" = "MySQL (backticks + column comments)"
"结果" = "Result"

