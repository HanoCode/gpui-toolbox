    if (st === 'priority') return popMenu(t, ['p0', 'p1', 'p2', 'p3'].map(function(x){ return { label: PRIO[x], icon: 'flag', fn: function(){ o.priority = x; renderActive(); } }; }));
    if (st === 'quad') return popMenu(t, ['q1', 'q2', 'q3', 'q4'].map(function(q){ return { label: QUAD[q].n + ' · ' + QUAD[q].s, icon: 'target', fn: function(){ o.quad = q; renderActive(); } }; }));
    if (st === 'project') return popMenu(t, [{ label: '未归入项目', icon: 'inbox', fn: function(){ o.project = null; renderActive(); } }]
      .concat(DATA.projects.map(function(pp){ return { label: pp.name, icon: 'folder', fn: function(){ o.project = pp.id; renderActive(); } }; })));
  }
  if ((t = closestSafe(e.target, '[data-act]'))){
    var a = t.getAttribute('data-act'), o2 = task(t.getAttribute('data-id'));
    if (a === 'edit-task') return openTaskEditor(t.getAttribute('data-id'));
    if (a === 'close-detail'){ S.selected = null; return renderRbar(); }
    if (a === 'pin'){ o2.starred = !o2.starred; renderActive(); return toast(o2.starred ? '已置顶，卡片会排在前面' : '已取消置顶', { type: 'info' }); }
    if (a === 'toggle-run'){ applyStatus(o2, o2.status === 'doing' ? 'todo' : 'doing'); renderActive(); return toast(o2.status === 'doing' ? '已开始' : '已暂停', { type: 'info' }); }
    if (a === 'complete'){ applyStatus(o2, 'done'); renderActive(); return toast('已完成「' + o2.title + '」'); }
    if (a === 'reopen'){ applyStatus(o2, 'todo'); renderActive(); return toast('已重新打开'); }
    if (a === 'new-on-day') return openSpotlight({ due: S.selectedDay || iso(TODAY) });
  }
  if ((t = closestSafe(e.target, '[data-sub]'))){
    var pair = t.getAttribute('data-sub').split(':'), ot = task(pair[0]);
    ot.subs[+pair[1]].d = ot.subs[+pair[1]].d ? 0 : 1;
    renderActive(); return;
  }
  if ((t = closestSafe(e.target, '[data-sub-add]'))){
    var sa = task(t.getAttribute('data-sub-add'));
    sa.subs = sa.subs || [];
    sa.subs.push({ t: '新子任务', d: 0 });
    renderRbar();
    return toast('已添加子任务，可在完整编辑器里改名', { type: 'info' });
  }
  if ((t = closestSafe(e.target, '[data-mile-add]'))) {
    var ma = task(t.getAttribute('data-mile-add'));
    ma.miles = ma.miles || [];
    openMilestoneEditor({ name: '', date: iso(TODAY), snap: Math.min(100, ma.prog + 20) }, function(nm){ ma.miles.push(nm); renderRbar(); });
    return;
  }
  if ((t = closestSafe(e.target, '[data-mile]'))){
    var mp = t.getAttribute('data-mile').split(':'), mt = task(mp[0]), mi = +mp[1];
    openMilestoneEditor(mt.miles[mi], function(nm){ mt.miles[mi] = nm; renderRbar(); });
    return;
  }
}
function sideAction(kind, el){
  if (kind === 'new-project') return openProjectEditor(null);
  if (kind === 'collapse-all'){ S.collapsed.work = !S.collapsed.work; return renderTree(); }
  if (kind === 'tags') return openTagManager();
  if (kind === 'import') return openImport();
  if (kind === 'export') return openExport();
}
function calNav(k){
  if (k === 'prev'){ S.calM--; if (S.calM < 0){ S.calM = 11; S.calY--; } }
  else if (k === 'next'){ S.calM++; if (S.calM > 11){ S.calM = 0; S.calY++; } }
  else { S.calY = 2026; S.calM = 9; S.selectedDay = iso(TODAY); }
  renderView(); renderRbar();
}
function inlineAdd(colId, btn){
  var parent = btn.parentNode, wrap = document.createElement('div');
  wrap.className = 'quickadd';
  wrap.innerHTML = '<input placeholder="输入标题，回车创建 · Esc 取消"><div class="qa-hint">支持 #标签 @项目 !P1 明天 18:00</div>';
  btn.style.display = 'none';
  parent.insertBefore(wrap, btn);
  var inp = wrap.querySelector('input'), done = false;
  inp.focus();
  function finish(commit){
    if (done) return; done = true;
    var v = inp.value.trim();
    if (wrap.parentNode) wrap.parentNode.removeChild(wrap);
    btn.style.display = '';
    if (!commit || !v) return;
    var q = parseQuick(v);
    var nt = { id: uid('t'), title: q.title || v, project: q.project || S.filterProject, status: colId,
      priority: q.priority || 'p2', quad: q.quad || 'q3', tags: q.tags, start: '', due: q.due || '',
      est: 0, act: 0, prog: colId === 'done' ? 100 : 0, desc: '', note: '', subs: [], miles: [],
      created: iso(TODAY), doneAt: colId === 'done' ? iso(TODAY) : null };
    DATA.tasks.unshift(nt); S.selected = nt.id; renderAll();
    var card = $id('view').querySelector('[data-card="' + nt.id + '"]');
    if (card){ card.classList.add('flash'); setTimeout(function(){ card.classList.remove('flash'); }, 1200); }
    toast('已添加到「' + colOf(colId).name + '」', { action: { label: '撤销', fn: function(){ removeTask(nt.id, true); } } });
  }
  inp.addEventListener('keydown', function(e){
    if (e.key === 'Enter'){ e.preventDefault(); finish(true); }
    else if (e.key === 'Escape'){ e.preventDefault(); finish(false); }
  });
  inp.addEventListener('blur', function(){ setTimeout(function(){ finish(false); }, 150); });
}
function logAction(kind, el){
  var cur = DATA.logs.filter(function(l){ return l.id === S.logId; })[0] || DATA.logs[0];
  if (kind === 'share'){
    try {
      var ta = document.createElement('textarea');
      ta.value = '# ' + cur.title + '\n\n' + cur.body;
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
      toast('已复制为 Markdown');
    } catch (e){ toast('复制失败，请手动选择', { type: 'err' }); }
    return;
  }
  if (kind === 'new'){
    var n = { id: uid('l'), type: 'daily', date: iso(TODAY), title: '今天 · ' + WD[wdOf(TODAY)], tags: [],
      body: '## 今日完成\n\n## 进行中\n\n## 阻塞\n\n## 明日计划' };
    DATA.logs.unshift(n); S.logId = n.id; S.logTab = 'daily'; renderView();
    return toast('已新建今日日志，点「编辑」开始写', { type: 'info' });
  }
  if (kind === 'edit'){
    openModal({
      cls: 'lg', icon: 'edit', title: '编辑日志 · ' + cur.title, two: false,
      body: '<div class="field"><div class="fl">标题</div><input class="inp" id="lg-title" value="' + esc(cur.title) + '"></div>' +
        '<div class="field"><div class="fl">正文<span class="hint">Markdown：## 小标题 / - 列表 / **加粗**</span></div>' +
        '<textarea class="ta mono" id="lg-body" style="min-height:300px;font-size:12px;line-height:18px">' + esc(cur.body) + '</textarea></div>',
      foot: '<span class="hint">保存后立即出现在右侧历史列表</span><div class="right">' +
        '<button class="btn" data-close="1">取消</button><button class="btn primary" id="lg-save">' + I('check', 12) + '保存</button></div>',
      mount: function(el, close){
        el.querySelector('#lg-save').addEventListener('click', function(){
          cur.title = el.querySelector('#lg-title').value;
          cur.body = el.querySelector('#lg-body').value;
          close(); renderView(); toast('日志已保存');
        });
      }
    });
    return;
  }
  if (kind === 'ai'){
    var box = $id('aigen'), bar = $id('aigen-bar'), txt = $id('aigen-txt');
    if (!box){ return; }
    box.style.display = 'flex';
    var steps = ['正在汇总任务变更…', '正在整理阻塞与风险…', '正在生成明日计划…'];
    var p = 0, si = 0;
    var timer = setInterval(function(){
      p += 6 + Math.random() * 10;
      if (si < steps.length && p > si * 33){ txt.textContent = steps[si]; si++; }
      bar.style.width = Math.min(100, p) + '%';
      if (p >= 100){
        clearInterval(timer);
        var doneToday = DATA.tasks.filter(function(t){ return t.doneAt === iso(TODAY); });
        var doing = DATA.tasks.filter(function(t){ return t.status === 'doing'; });
        var blk = DATA.tasks.filter(function(t){ return t.status === 'blocked'; });
        var generated = '## 今日完成\n' + (doneToday.length ? doneToday.map(function(t){ return '- ' + t.title + '（' + (proj(t.project) ? proj(t.project).name : '未归入') + '）'; }).join('\n') : '- 暂无') +
          '\n\n## 进行中\n' + (doing.map(function(t){ return '- ' + t.title + ' — ' + t.prog + '%'; }).join('\n') || '- 暂无') +
          '\n\n## 阻塞\n' + (blk.length ? blk.map(function(t){ return '- ' + t.title + '：' + (t.block || '待补充原因'); }).join('\n') : '- 无') +
          '\n\n## 明日计划\n' + DATA.tasks.filter(function(t){ return t.status !== 'done' && t.due && diffDays(iso(TODAY), t.due) <= 1; })
            .slice(0, 4).map(function(t){ return '- ' + t.title; }).join('\n');
        cur.body = generated;
        $id('logtext').innerHTML = md(generated);
        box.style.display = 'none'; bar.style.width = '0';
        toast('已生成今日小结，可直接编辑后保存', { action: { label: '撤销', fn: function(){ $id('logtext').innerHTML = md('## 今日完成\n\n## 进行中\n\n## 阻塞\n\n## 明日计划'); toast('已还原为模板', { type: 'info' }); } } });
      }
    }, 120);
  }
}
/* ==========================================================================
   23 · 拖拽 / 键盘 / 启动
   ========================================================================== */
function bindWin(){
  var win = $id('win');
  win.addEventListener('click', function(e){
    if (closestSafe(e.target, '.scrim') || closestSafe(e.target, '.ctx') || closestSafe(e.target, '.toast')) return;
    handleClick(e);
  });
  win.addEventListener('dblclick', function(e){
    if (closestSafe(e.target, '.scrim')) return;
    var c = closestSafe(e.target, '[data-card]');
    if (c) openTaskEditor(c.getAttribute('data-card'));
  });
  win.addEventListener('contextmenu', function(e){
    if (closestSafe(e.target, '.scrim')) return;
    var c = closestSafe(e.target, '[data-card]');
    var row = closestSafe(e.target, '[data-project]');
    e.preventDefault();
    var rect = { left: e.clientX, top: e.clientY, bottom: e.clientY, right: e.clientX };
    var anchor = { getBoundingClientRect: function(){ return rect; } };
    if (c) return cardMenu(c.getAttribute('data-card'), anchor);
    if (row){
      var p = proj(row.getAttribute('data-project'));
      return popMenu(anchor, [
        { title: '项目「' + p.name + '」' },
        { label: '只看这个项目', icon: 'filter', fn: function(){ S.filterProject = p.id; S.filterSmart = null; if (S.view === 'log') S.view = 'board'; renderActive(); } },
        { label: '新建任务并归入', icon: 'plus', fn: function(){ openSpotlight({ project: p.id }); } },
        { sep: true },
        { label: '项目设置…', icon: 'settings', fn: function(){ openProjectEditor(p.id); } },
        { label: '删除项目', icon: 'trash', danger: true, fn: function(){
            confirmDialog({ title: '删除项目', danger: true, okText: '删除项目',
              html: '将删除项目 <b>' + esc(p.name) + '</b>，其中 ' + projStat(p.id).all + ' 个任务会变为「未归入项目」。',
              onOk: function(){
                DATA.tasks.forEach(function(t){ if (t.project === p.id) t.project = null; });
                DATA.projects = DATA.projects.filter(function(x){ return x.id !== p.id; });
                if (S.filterProject === p.id) S.filterProject = null;
                renderAll(); toast('已删除项目「' + p.name + '」', { type: 'err' });
              } });
          } }
      ]);
    }
  });
  // 进度滑块（只可前进）
  win.addEventListener('input', function(e){
    var r = closestSafe(e.target, '[data-prog]');
    if (!r) return;
    var pv = r.parentNode.querySelector('.pv'); if (pv) pv.textContent = r.value + '%';
    var bar = r.parentNode.parentNode.querySelector('.pbar > i'); if (bar) bar.style.width = r.value + '%';
  });
  win.addEventListener('change', function(e){
    var r = closestSafe(e.target, '[data-prog]');
    if (!r) return;
    var t = task(r.getAttribute('data-prog')); if (!t) return;
    t.prog = +r.value;
    if (t.prog >= 100) applyStatus(t, 'done');
    renderActive();
    toast(t.status === 'done' ? '进度已到 100%，任务自动完成' : '进度已更新为 ' + t.prog + '%', { type: 'info' });
  });
  // 拖拽改状态
  win.addEventListener('dragstart', function(e){
    var c = closestSafe(e.target, '[data-card]');
    if (!c || !closestSafe(e.target, '.board')) return;
    DRAG = c.getAttribute('data-card');
    c.classList.add('dragging');
    try { e.dataTransfer.setData('text/plain', DRAG); e.dataTransfer.effectAllowed = 'move'; } catch (err){}
  });
  function clearDragMarks(){
    Array.prototype.forEach.call(document.querySelectorAll('.col.dragover'), function(x){ x.classList.remove('dragover'); });
    Array.prototype.forEach.call(document.querySelectorAll('.card.dragging'), function(x){ x.classList.remove('dragging'); });
  }
  win.addEventListener('dragend', function(){ clearDragMarks(); DRAG = null; });
  win.addEventListener('dragover', function(e){
    var z = closestSafe(e.target, '[data-drop]');
    if (!z || !DRAG) return;
    e.preventDefault();
    try { e.dataTransfer.dropEffect = 'move'; } catch (err){}
    var col = z.closest('.col');
    Array.prototype.forEach.call(document.querySelectorAll('.col.dragover'), function(x){ if (x !== col) x.classList.remove('dragover'); });
    if (col) col.classList.add('dragover');
  });
  win.addEventListener('drop', function(e){
    var z = closestSafe(e.target, '[data-drop]');
    if (!z) return;
    e.preventDefault();
    var to = z.getAttribute('data-drop');
    var id = DRAG; try { id = id || e.dataTransfer.getData('text/plain'); } catch (err){}
    var t = task(id);
    clearDragMarks(); DRAG = null;
    if (!t) return;
    var from = t.status;
    if (from === to) return;
    var snap = { status: from, doneAt: t.doneAt, prog: t.prog };
    applyStatus(t, to);
    renderAll();
    toast('「' + t.title + '」：' + colOf(from).name + ' → ' + colOf(to).name, { action: { label: '撤销', fn: function(){
      t.status = snap.status; t.doneAt = snap.doneAt; t.prog = snap.prog;
      renderAll(); toast('已撤销移动', { type: 'info' });
    } } });
  });
}
function onKey(e){
  var ae = document.activeElement;
  var inField = ae && (/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName) || ae.isContentEditable);
  if (e.key === 'Escape'){
    if (CTX){ closeMenu(); e.preventDefault(); return; }
    if (closeTop()){ e.preventDefault(); }
    return;
  }
  if (inField) return;
  var mod = e.metaKey || e.ctrlKey;
  if (mod && e.key.toLowerCase() === 'k'){ e.preventDefault(); return openPalette(); }
  if (mod && e.key.toLowerCase() === 'n'){ e.preventDefault(); return openTaskEditor(null); }
  if (mod && e.key === ','){ e.preventDefault(); return openSettings(); }
  if (e.key === '?'){ e.preventDefault(); return openGuide(); }
  if (e.key === 'n' || e.key === 'N'){ e.preventDefault(); return openSpotlight(); }
  if (e.key === '/'){ e.preventDefault(); var s = $id('sb-input'); if (s) s.focus(); return; }
}
function setTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  $id('btn-light').classList.toggle('on', t === 'light');
  $id('btn-dark').classList.toggle('on', t === 'dark');
}
function renderAll(){
  renderRail(); renderSidebar(); renderToolbar(); renderView(); renderRbar(); renderStatus();
}
function renderActive(){
  renderTree(); renderTreeCounts(); renderToolbar(); renderView(); renderRbar(); renderStatus();
}
(function boot(){
  Array.prototype.forEach.call(document.querySelectorAll('[data-ic]'), function(el){
    el.innerHTML = svgOnly(el.getAttribute('data-ic'));
  });
  setTheme('light');
  renderAll();
  bindWin();
  document.addEventListener('keydown', onKey);
  document.addEventListener('mousedown', function(e){
    if (!closestSafe(e.target, '.ctx')) closeMenu();
  });
  $id('tb-search').addEventListener('click', openPalette);
  $id('btn-bell').addEventListener('click', openNotifications);
  $id('btn-settings').addEventListener('click', function(){ openSettings(); });
  $id('btn-help').addEventListener('click', openGuide);
  $id('btn-guide').addEventListener('click', openGuide);
  $id('btn-light').addEventListener('click', function(){ setTheme('light'); });
  $id('btn-dark').addEventListener('click', function(){ setTheme('dark'); });
  $id('btn-density').addEventListener('click', cycleDensity);
  $id('foot').innerHTML =
    '<span class="k">' + I('info', 12) + '<b>完整可交互原型</b>：全部弹窗、拖拽改状态、撤销都是真实可点的</span>' +
    '<span class="k"><kbd>⌘K</kbd>命令面板</span><span class="k"><kbd>N</kbd>快速新建</span>' +
    '<span class="k"><kbd>⌘N</kbd>新建任务</span><span class="k"><kbd>?</kbd>交互说明</span>' +
    '<span class="k">右键卡片 / 项目出上下文菜单</span>' +
    '<span class="k" style="color:var(--fg3)">基准日 2026-10-14 · 数据仅在内存中，刷新即重置</span>';

  /* 深链：?view=list&theme=dark&select=t01&demo=editor —— 评审可直接跳到指定视图 / 弹窗 */
  var Q = new URLSearchParams(location.search);
  var qv = Q.get('view');
  if (qv && ['board', 'list', 'calendar', 'timeline', 'report', 'log'].indexOf(qv) >= 0) S.view = qv;
  if (Q.get('theme') === 'dark') setTheme('dark');
  if (Q.get('density') === 'compact') cycleDensity();
  var qsel = Q.get('select');
  if (qsel && task(qsel)) S.selected = qsel;
  renderAll();
  var qd = Q.get('demo');
  if (qd) setTimeout(function(){
    if (qd === 'editor') openTaskEditor(qsel || null);
    else if (qd === 'spotlight') openSpotlight();
    else if (qd === 'palette') openPalette();
    else if (qd === 'settings') openSettings();
    else if (qd === 'notify') openNotifications();
    else if (qd === 'import') openImport();
    else if (qd === 'export') openExport();
    else if (qd === 'tags') openTagManager();
    else if (qd === 'columns') openColumnSettings(null);
    else if (qd === 'guide') openGuide();
    else if (qd === 'project') openProjectEditor(null);
    else if (qd === 'day'){ S.view = 'calendar'; S.selectedDay = iso(TODAY); renderAll(); }
  }, 60);
  else setTimeout(function(){ toast('这一稿可以点：试试 ⌘K，或按 N 快速新建', { type: 'info' }); }, 700);
})();
</script>
