<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duck Toolbox · 项目管理模块 · 完整交互原型</title>
<style>
/* ============================================================================
   Duck Toolbox · 项目管理模块 —— 完整可交互原型
   ----------------------------------------------------------------------------
   颜色 / 尺寸全部取自 crates/duck-theme 的真实 token，不是近似值：
     DefaultLight bg #F8F9FA · surface #FFFFFF · surface2 #F1F3F5
                  fg #09090B · fg2 #71717A · border #E4E4E7 · primary #3B82F6
     DefaultDark  bg #1C1C1E · surface #2C2C2E · surface2 #3A3A3C
                  fg #F5F5F7 · fg2 #A1A1A6 · border #48484A · primary #3B82F6
     扩展色（builtin.rs extended_tokens 规则）：
       success #1F9D55/#30D158 · warning #C77C02/#FFB340 · destructive #EF4444
       chrome / hairline / navSelected / hoverTint(10%|16%) 按 mix 规则算出
     尺寸：spacing 2/4/8/12/16/24/32 · radius 3/6/8 · 密度 Normal
           activity_rail 48 · title_bar 40 · toolbar 34 · status_bar 28
           sidebar 260 · rightbar 300 · control 28 · nav_row 28
     字阶：badge 10/13 · xs 12/16 · sm 13/18 · md 15/20 · lg 17/22 · xl 22/26
   看板 / 列表 / 日历 / 时间线 / 报表 / 日志 六视图 + 全部弹窗均为真实状态驱动。
   ============================================================================ */
:root{
  --bg:#F8F9FA; --surface:#FFFFFF; --surface2:#F1F3F5;
  --fg:#09090B; --fg2:#71717A; --fg3:#A7A7AD;
  --border:#E4E4E7; --hairline:#EFEFF1;
  --primary:#3B82F6; --primary-fg:#FFFFFF;
  --destructive:#EF4444; --success:#1F9D55; --warning:#C77C02;
  --chrome:#F6F7F8; --nav-selected:#E9E9EC; --nav-hover:#EFF0F3;
  --row-hover:rgba(59,130,246,.10);
  --accent-tint:rgba(59,130,246,.10);
  --accent-text:#1D6FE0;
  --page:#ECECEF;
  --win-shadow:0 20px 56px rgba(0,0,0,.18), 0 2px 8px rgba(0,0,0,.1);
  --lightdot:#FF5F57; --yellowdot:#FEBC2E; --greendot:#28C840;
  --p-track:rgba(113,113,122,.16);
  --p0:#EF4444; --p1:#C77C02; --p2:#3B82F6; --p3:#A7A7AD;
  --q1:#EF4444; --q2:#C77C02; --q3:#3B82F6; --q4:#A7A7AD;
  --pj-a:#3B82F6; --pj-b:#8B5CF6; --pj-c:#14B8A6; --pj-d:#F59E0B; --pj-e:#EC4899;
  --card-shadow:0 1px 2px rgba(0,0,0,.05);
  --card-shadow-hover:0 8px 18px -6px rgba(0,0,0,.18);
  --scrim:rgba(9,9,11,.45);
}
[data-theme="dark"]{
  --bg:#1C1C1E; --surface:#2C2C2E; --surface2:#3A3A3C;
  --fg:#F5F5F7; --fg2:#A1A1A6; --fg3:#757578;
  --border:#48484A; --hairline:#3E3E40;
  --primary:#3B82F6; --primary-fg:#FFFFFF;
  --destructive:#EF4444; --success:#30D158; --warning:#FFB340;
  --chrome:#222224; --nav-selected:#38383A; --nav-hover:#2E2E33;
  --row-hover:rgba(59,130,246,.16);
  --accent-tint:rgba(59,130,246,.16);
  --accent-text:#6BA5F8;
  --page:#0F0F10;
  --win-shadow:0 20px 56px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.4);
  --p-track:rgba(161,161,166,.2);
  --p0:#FF6B6B; --p1:#FFB340; --p2:#6BA5F8; --p3:#757578;
  --q1:#FF6B6B; --q2:#FFB340; --q3:#6BA5F8; --q4:#757578;
  --pj-a:#6BA5F8; --pj-b:#B79CFF; --pj-c:#4ECDC4; --pj-d:#FFC069; --pj-e:#FF8FB1;
  --card-shadow:0 1px 2px rgba(0,0,0,.3);
  --card-shadow-hover:0 8px 18px -6px rgba(0,0,0,.6);
  --scrim:rgba(0,0,0,.62);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--page); color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:13px; line-height:18px;
  padding:12px 18px 34px; display:flex; flex-direction:column; align-items:center; gap:10px;
  overflow:hidden;
}
.ic{width:14px;height:14px;flex:none;display:inline-block;vertical-align:middle}
.ic svg{width:100%;height:100%;display:block}
kbd{font-family:inherit;font-size:10.5px;border:1px solid var(--border);border-radius:4px;
  padding:0 4px;line-height:15px;background:var(--surface);color:var(--fg3);display:inline-block}
select.inp{display:block;cursor:pointer}
input[type=date].inp{padding-right:6px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--fg3) 46%,transparent);border-radius:5px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb,var(--fg3) 70%,transparent);background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}

/* ---------------- 顶部控制条 ---------------- */
.chrome-bar{width:min(1440px,100%);display:flex;align-items:center;gap:8px;flex:none}
.brand{font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px}
.brand .bdot{width:16px;height:16px;border-radius:5px;background:var(--primary);color:#fff;
  display:flex;align-items:center;justify-content:center}
.brand .bdot .ic{width:11px;height:11px}
.chrome-bar .sub{font-size:11.5px;color:var(--fg2)}
.chrome-bar .sp{flex:1}
.btn{height:28px;padding:0 10px;border-radius:6px;border:1px solid var(--border);
  background:var(--surface);color:var(--fg);font-size:12.5px;font-family:inherit;
  display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--row-hover);border-color:var(--primary)}
.btn.on{background:var(--accent-tint);border-color:var(--primary);color:var(--accent-text);font-weight:500}
.btn .ic{width:13px;height:13px;color:currentColor;opacity:.9}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
.btn.primary:hover{filter:brightness(1.06);background:var(--primary)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--destructive);border-color:color-mix(in srgb,var(--destructive) 40%,var(--border))}
.btn.danger:hover{background:color-mix(in srgb,var(--destructive) 12%,transparent);border-color:var(--destructive)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{height:24px;padding:0 8px;font-size:12px}
.kbd{font-family:inherit;font-size:10.5px;border:1px solid var(--border);border-radius:4px;
  padding:0 4px;line-height:15px;background:var(--surface);color:var(--fg3)}

/* ---------------- 窗口外壳 ---------------- */
.win{width:min(1440px,100%);flex:1;min-height:560px;background:var(--bg);border:1px solid var(--border);
  border-radius:10px;overflow:hidden;box-shadow:var(--win-shadow);display:flex;flex-direction:column;
  position:relative;color:var(--fg)}
.win[data-density="compact"]{--dpad:6px}
.titlebar{height:40px;flex:none;display:flex;align-items:center;gap:12px;padding:0 12px;
  background:var(--chrome);border-bottom:1px solid var(--hairline)}
.lights{display:flex;gap:8px;flex:none}
.lights i{width:12px;height:12px;border-radius:50%;display:block}
.lights i:nth-child(1){background:var(--lightdot)}
.lights i:nth-child(2){background:var(--yellowdot)}
.lights i:nth-child(3){background:var(--greendot)}
.tb-search{height:24px;width:330px;border-radius:6px;background:var(--surface);border:1px solid var(--border);
  display:flex;align-items:center;gap:6px;padding:0 8px;color:var(--fg3);font-size:12px;cursor:pointer}
.tb-search:hover{border-color:var(--primary)}
.tb-search kbd{margin-left:auto;font-family:inherit;font-size:10.5px;color:var(--fg3);
  border:1px solid var(--border);border-radius:4px;padding:0 4px;line-height:15px}
.titlebar .trail{margin-left:auto;display:flex;align-items:center;gap:4px}
.tbtn{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  color:var(--fg2);cursor:pointer;position:relative}
.tbtn:hover{background:var(--row-hover);color:var(--fg)}
.tbtn .dot{position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;
  background:var(--destructive);border:1px solid var(--chrome)}
.body{flex:1;display:flex;min-height:0}

/* ---------------- 活动栏 ---------------- */
.rail{width:48px;flex:none;background:var(--chrome);border-right:1px solid var(--hairline);
  display:flex;flex-direction:column;gap:4px;align-items:center;padding-top:4px}
.rail .tile{width:48px;height:32px;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer}
.rail .rb{width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--fg2)}
.rail .tile:hover .rb{background:var(--row-hover);color:var(--fg)}
.rail .tile.on .rb{background:var(--nav-selected);color:var(--primary)}
.rail .tile .ic{width:18px;height:18px}
.rail .spacer{flex:1}

/* ---------------- 左栏 ---------------- */
.sidebar{width:260px;flex:none;background:var(--chrome);border-right:1px solid var(--hairline);
  display:flex;flex-direction:column;min-height:0}
.sbhead{height:44px;flex:none;display:flex;align-items:center;gap:6px;padding:0 10px;border-bottom:1px solid var(--hairline)}
.sbhead h3{font-size:13px;font-weight:600}
.sbhead .acts{margin-left:auto;display:flex;gap:2px}
.ibtn{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  color:var(--fg2);cursor:pointer}
.ibtn .ic{width:14px;height:14px}
.ibtn:hover{background:var(--row-hover);color:var(--fg)}
.ibtn.on{color:var(--warning)}
.sbfilter{padding:6px 10px 8px;border-bottom:1px solid var(--hairline)}
.sb-search{width:100%;height:24px;border-radius:6px;background:var(--surface);border:1px solid var(--border);
  display:flex;align-items:center;gap:6px;padding:0 8px;color:var(--fg3);font-size:12px}
.sb-search input{border:none;background:transparent;font:inherit;color:var(--fg);outline:none;width:100%}
.sb-search input::placeholder{color:var(--fg3)}
.tree{flex:1;overflow:auto;padding:6px 8px 10px}
.sect{height:24px;display:flex;align-items:center;gap:4px;padding:0 6px;font-size:10.5px;color:var(--fg3);letter-spacing:.04em}
.sect .ibtn{width:18px;height:18px;margin-left:auto}
.trow{height:28px;border-radius:6px;display:flex;align-items:center;gap:7px;padding:0 6px;
  font-size:12.5px;cursor:pointer;white-space:nowrap;user-select:none}
.trow:hover{background:var(--row-hover)}
.trow.sel{background:var(--nav-selected);font-weight:500}
.trow.sel .ic{color:var(--primary)}
.trow .ic{width:14px;height:14px;color:var(--fg2);flex:none}
.trow .chev{width:12px;height:12px;color:var(--fg3);transition:transform .12s ease}
.trow.open .chev{transform:rotate(90deg)}
.trow .lbl{overflow:hidden;text-overflow:ellipsis}
.trow .meta{margin-left:auto;font-size:11px;color:var(--fg3);font-variant-numeric:tabular-nums;flex:none}
.trow .pdot{width:8px;height:8px;border-radius:50%;flex:none}
.trow[data-depth="1"]{padding-left:22px}
.trow[data-depth="2"]{padding-left:38px}
.sb-foot{flex:none;height:32px;display:flex;align-items:center;gap:10px;padding:0 10px;
  border-top:1px solid var(--hairline);font-size:11px;color:var(--fg3)}
.sb-foot .num{color:var(--fg2)}

/* ---------------- 主区 ---------------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.toolbar{min-height:34px;flex:none;display:flex;align-items:center;gap:6px;padding:3px 10px;
  border-bottom:1px solid var(--hairline);background:var(--bg);flex-wrap:wrap}
.seg{display:flex;gap:2px;background:var(--surface2);border-radius:6px;padding:2px;flex:none}
.seg .sg{height:22px;padding:0 9px;border-radius:4px;font-size:12px;color:var(--fg2);
  display:inline-flex;align-items:center;gap:5px;cursor:pointer;font-family:inherit;border:none;background:transparent}
.seg .sg .ic{width:13px;height:13px}
.seg .sg:hover{color:var(--fg)}
.seg .sg.on{background:var(--surface);color:var(--fg);font-weight:500;box-shadow:var(--card-shadow)}
.tbsep{width:1px;height:16px;background:var(--hairline);margin:0 2px;flex:none}
.tb{height:24px;padding:0 8px;border-radius:5px;border:1px solid transparent;background:transparent;
  color:var(--fg2);font-family:inherit;font-size:12px;display:inline-flex;align-items:center;gap:5px;cursor:pointer;white-space:nowrap}
.tb:hover{background:var(--row-hover);color:var(--fg)}
.tb.on{color:var(--accent-text);background:var(--accent-tint)}
.tb .ic{width:13px;height:13px}
.chip{height:22px;padding:0 9px;border-radius:11px;border:1px solid var(--border);background:var(--surface);
  color:var(--fg2);font-size:11.5px;display:inline-flex;align-items:center;gap:5px;cursor:pointer;font-family:inherit;white-space:nowrap}
.chip:hover{border-color:var(--primary);color:var(--fg)}
.chip.on{background:var(--accent-tint);border-color:var(--primary);color:var(--accent-text);font-weight:500}
.chip .num{opacity:.7}
.toolbar .right{margin-left:auto;display:flex;align-items:center;gap:4px}
.viewwrap{flex:1;min-height:0;padding:12px;display:flex;flex-direction:column;overflow:hidden}
.statusbar{height:28px;flex:none;display:flex;align-items:center;gap:14px;padding:0 12px;
  border-top:1px solid var(--hairline);background:var(--chrome);font-size:11px;color:var(--fg3);overflow:hidden;white-space:nowrap}
.statusbar .right{margin-left:auto;display:flex;gap:12px;align-items:center}
.statusbar b{font-weight:500;color:var(--fg2)}

/* ---------------- 看板 ---------------- */
.board{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:stretch}
.col{background:var(--surface2);border:1px solid var(--hairline);border-radius:12px;display:flex;flex-direction:column;
  min-height:0;overflow:hidden;transition:background .12s ease,border-color .12s ease}
.col.dragover{background:var(--accent-tint);border-color:var(--primary);border-style:dashed}
.colhead{height:36px;flex:none;display:flex;align-items:center;gap:7px;padding:0 10px}
.cdot{width:8px;height:8px;border-radius:50%;flex:none}
.cdot.todo{background:var(--fg3)}
.cdot.doing{background:var(--primary)}
.cdot.blocked{background:var(--warning)}
.cdot.done{background:var(--success)}
.colhead .cname{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.colhead .ccount{font-size:11px;color:var(--fg2);background:var(--surface);border:1px solid var(--border);
  border-radius:9px;padding:0 6px;line-height:16px}
.colhead .wip{margin-left:auto;font-size:10.5px;color:var(--warning);border:1px solid var(--warning);
  border-radius:8px;padding:0 5px;line-height:14px;flex:none}
.colhead .ibtn{margin-left:auto;width:22px;height:22px}
.colhead .wip + .ibtn{margin-left:4px}
.cards{flex:1;min-height:0;overflow:auto;padding:0 8px 4px;display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:9px 10px 9px 11px;
  cursor:pointer;position:relative;box-shadow:var(--card-shadow);
  transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease}
[data-density="compact"] .card{padding:7px 9px 7px 10px}
.card:hover{transform:translateY(-2px);box-shadow:var(--card-shadow-hover);border-color:var(--primary)}
.card::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:transparent}
.card.st-doing::before{background:var(--primary)}
.card.st-blocked::before{background:var(--warning)}
.card.st-done{opacity:.68}
.card.st-done:hover{opacity:.9}
.card.st-done .ctitle{text-decoration:line-through;color:var(--fg2)}
.card.sel{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary),var(--card-shadow-hover)}
.card.dragging{opacity:.35;border-style:dashed;transform:none}
.card.flash{animation:flash 1.1s ease}
@keyframes flash{0%{background:var(--accent-tint);box-shadow:0 0 0 2px var(--primary)}100%{background:var(--surface)}}
.ctop{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.tagchip{font-size:10.5px;line-height:16px;padding:0 6px;border-radius:4px;background:var(--accent-tint);
  color:var(--accent-text);flex:none;white-space:nowrap}
.qd{width:19px;height:19px;border-radius:5px;display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;flex:none;color:#fff}
.qd.q1{background:var(--q1)} .qd.q2{background:var(--q2)} .qd.q3{background:var(--q3)} .qd.q4{background:var(--q4)}
.ctop .more{margin-left:auto;color:var(--fg3);opacity:.45;display:flex;width:16px;height:16px;
  align-items:center;justify-content:center;border-radius:4px}
.ctop .more:hover{opacity:1;background:var(--surface2);color:var(--fg)}
.ctop .pin{color:var(--warning);display:inline-flex;flex:none}
.card:hover .ctop .more{opacity:1}
.ctitle{font-size:13px;line-height:18px;font-weight:500;color:var(--fg);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pbar{height:4px;border-radius:2px;background:var(--p-track);margin-top:8px;overflow:hidden}
.pbar > i{display:block;height:100%;border-radius:2px;background:var(--primary);transition:width .25s ease}
.pbar.p-hi > i{background:var(--success)} .pbar.p-mid > i{background:var(--primary)}
.pbar.p-low > i{background:var(--warning)} .pbar.p-none > i{background:var(--fg3)}
.pmeta{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:11px;color:var(--fg2);flex-wrap:wrap}
.pmeta .m{display:inline-flex;align-items:center;gap:4px}
.pmeta .m .ic{width:12px;height:12px}
.pmeta .pct{margin-left:auto;color:var(--fg2)}
.pmeta .due.warn{color:var(--destructive)}
.pmeta .due.soon{color:var(--warning)}
.pdot{width:7px;height:7px;border-radius:50%;flex:none;display:inline-block}
.pdot.p0{background:var(--p0)} .pdot.p1{background:var(--p1)} .pdot.p2{background:var(--p2)} .pdot.p3{background:var(--p3)}
.plabel{font-size:10.5px;font-weight:600;letter-spacing:.02em}
.plabel.p0{color:var(--p0)} .plabel.p1{color:var(--p1)} .plabel.p2{color:var(--p2)} .plabel.p3{color:var(--fg3)}
.blocked-tag{font-size:10.5px;color:var(--warning);border:1px solid var(--warning);border-radius:4px;padding:0 5px;line-height:15px}
.addcard{margin:0 8px 8px;height:28px;border:1px dashed var(--border);border-radius:6px;background:transparent;
  color:var(--fg2);font-size:12px;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;flex:none}
.addcard:hover{border-style:solid;border-color:var(--primary);color:var(--accent-text)}
.addcard .ic{transition:transform .15s ease}
.addcard:hover .ic{transform:rotate(90deg)}
.quickadd{margin:0 8px 8px;display:flex;flex-direction:column;gap:6px;flex:none}
.quickadd input{height:30px;border-radius:6px;border:1px solid var(--primary);background:var(--surface);
  color:var(--fg);font:inherit;font-size:12.5px;padding:0 9px;outline:none;box-shadow:0 0 0 2px var(--accent-tint)}
.quickadd .qa-hint{font-size:10.5px;color:var(--fg3);padding-left:2px}
.empty{padding:40px 16px;text-align:center;color:var(--fg3);font-size:12.5px;line-height:19px}
.empty .big{width:38px;height:38px;margin:0 auto 10px;border-radius:10px;background:var(--surface2);
  display:flex;align-items:center;justify-content:center;color:var(--fg3)}
.empty .big .ic{width:19px;height:19px}
.empty b{display:block;color:var(--fg2);font-size:13px;margin-bottom:3px}

/* ---------------- 列表 ---------------- */
.ltable{border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface);flex:none}
.lgroup{height:30px;display:flex;align-items:center;gap:7px;padding:0 12px;background:var(--surface2);
  border-bottom:1px solid var(--border);font-size:11.5px;font-weight:600;color:var(--fg2)}
.lgroup .pdot{width:8px;height:8px}
.lgroup .meta{margin-left:auto;font-weight:400;color:var(--fg3)}
.lhead{display:flex;height:32px;align-items:center;background:var(--surface2);border-bottom:1px solid var(--border);
  font-size:11.5px;font-weight:600;color:var(--fg2);position:sticky;top:0;z-index:2}
.lrow{display:flex;height:34px;align-items:center;border-bottom:1px solid var(--hairline);font-size:12.5px;cursor:pointer}
.lrow:hover{background:var(--row-hover)}
.lrow.sel{background:var(--accent-tint)}
.lrow:last-child{border-bottom:none}
.lcell{padding:0 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:7px}
.lcell.ck{width:38px;flex:none;justify-content:center;padding:0}
.lcell.title{flex:1;min-width:0}
.lcell.title .tt{overflow:hidden;text-overflow:ellipsis}
.lcell.w{width:96px;flex:none}
.lcell.w120{width:120px;flex:none}
.lcell.w88{width:88px;flex:none}
.lcheck{width:15px;height:15px;border-radius:4px;border:1px solid var(--border);background:var(--surface);
  cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;color:transparent}
.lcheck.on{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
.lcheck .ic{width:11px;height:11px}
.lsort{cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.lsort:hover{color:var(--fg)}
.lsort .ic{width:11px;height:11px;opacity:.6}
.bulkbar{height:38px;display:flex;align-items:center;gap:8px;padding:0 12px;margin-bottom:10px;flex:none;
  background:var(--accent-tint);border:1px solid var(--primary);border-radius:8px;font-size:12px;color:var(--accent-text)}
.bulkbar .right{margin-left:auto;display:flex;gap:6px}

/* ---------------- 日历 ---------------- */
.calhead{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex:none}
.calhead .m{font-size:15px;font-weight:600}
.calhead .sub{font-size:11.5px;color:var(--fg3)}
.calhead .right{margin-left:auto;display:flex;align-items:center;gap:6px}
.cgridwrap{border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface);
  flex:1;min-height:0;display:flex;flex-direction:column}
.wdrow{display:grid;grid-template-columns:repeat(7,1fr);background:var(--surface2);border-bottom:1px solid var(--border);flex:none}
.wdrow div{height:28px;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:600;color:var(--fg2)}
.wdrow div.we{color:var(--fg3)}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;flex:1;min-height:0}
.ccell{border-right:1px solid var(--hairline);border-bottom:1px solid var(--hairline);
  padding:4px 5px;display:flex;flex-direction:column;gap:3px;overflow:hidden;cursor:pointer;min-height:0}
.ccell:nth-child(7n){border-right:none}
.ccell.other{opacity:.42}
.ccell:hover{background:var(--row-hover)}
.ccell.today{background:var(--accent-tint);box-shadow:inset 0 0 0 1px var(--primary)}
.ccell.sel{background:var(--nav-selected)}
.cnum{font-size:11.5px;color:var(--fg2);display:flex;align-items:center;gap:4px;flex:none}
.ccell.today .cnum{color:var(--accent-text);font-weight:600}
.cnum .badge{margin-left:auto;font-size:10px;background:var(--surface2);border-radius:7px;padding:0 5px;line-height:14px;color:var(--fg3)}
.ctask{font-size:10.5px;line-height:16px;border-radius:4px;padding:0 5px;background:var(--surface2);
  display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
.ctask:hover{background:var(--nav-selected)}
.ctask .pdot{width:6px;height:6px}
.ctask.done{color:var(--fg3);text-decoration:line-through}
.ctask.hi{background:var(--accent-tint);color:var(--accent-text)}
.cmore{font-size:10px;color:var(--fg3);padding-left:5px;flex:none}

/* ---------------- 时间线 ---------------- */
.tlwrap{border:1px solid var(--border);border-radius:8px;background:var(--surface);flex:1;min-height:0;
  display:flex;flex-direction:column;overflow:hidden}
.tlhead{display:flex;flex:none;border-bottom:1px solid var(--border);background:var(--surface2);height:30px}
.tlhead .c0{width:230px;flex:none;padding:0 12px;display:flex;align-items:center;font-size:11.5px;font-weight:600;color:var(--fg2);
  border-right:1px solid var(--border)}
.tlhead .track{flex:1;display:grid;position:relative}
.tlhead .track div{display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--fg3);
  border-right:1px solid var(--hairline);overflow:hidden}
.tlhead .track div.we{background:color-mix(in srgb,var(--fg3) 8%,transparent)}
.tlhead .track div.mo{font-weight:600;color:var(--fg2);border-left:1px solid var(--border)}
.tllegend{flex:none;display:flex;gap:14px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--hairline);
  font-size:10.5px;color:var(--fg3)}
.tllegend .lg{display:inline-flex;align-items:center;gap:5px}
.tllegend .sw{width:9px;height:9px;border-radius:2px;display:inline-block;flex:none}
.tllegend .sw.dm{transform:rotate(45deg);border-radius:1.5px}
.tlrow .dmark{position:absolute;top:50%;width:11px;height:11px;transform:translate(-50%,-50%) rotate(45deg);
  background:var(--primary);border-radius:2px;cursor:pointer;box-shadow:var(--card-shadow)}
.tlrow .dmark.done{background:var(--success)} .tlrow .dmark.over{background:var(--destructive)}
.tlrow .dmark.blocked{background:var(--warning)}
.tlbody{flex:1;min-height:0;overflow:auto}
.tlrow{display:flex;height:38px;align-items:center;border-bottom:1px solid var(--hairline)}
.tlrow:hover{background:var(--row-hover)}
.tlrow .c0{width:230px;flex:none;padding:0 12px;display:flex;align-items:center;gap:7px;font-size:12.5px;
  overflow:hidden;white-space:nowrap;border-right:1px solid var(--border);height:100%}
.tlrow .c0 .tt{overflow:hidden;text-overflow:ellipsis}
.tlrow .track{flex:1;height:100%;position:relative;display:grid}
.tlrow .track .vline{grid-row:1;grid-column:auto;border-right:1px solid var(--hairline)}
.tlrow .bar{position:absolute;top:50%;transform:translateY(-50%);height:18px;border-radius:4px;
  background:var(--primary);opacity:.92;display:flex;align-items:center;padding:0 6px;font-size:10px;color:#fff;
  white-space:nowrap;overflow:hidden;cursor:pointer;min-width:12px;box-shadow:var(--card-shadow)}
.tlrow .bar.done{background:var(--success)}
.tlrow .bar.over{background:var(--destructive)}
.tlrow .bar.blocked{background:var(--warning)}
.tlrow .todayline{position:absolute;top:0;bottom:0;width:1px;background:var(--destructive);opacity:.7}

/* ---------------- 报表 ---------------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px;flex:none}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:11px 12px}
.kpi .kl{font-size:11.5px;color:var(--fg2);display:flex;align-items:center;gap:6px}
.kpi .kl .ic{width:13px;height:13px}
.kpi .kv{font-size:22px;line-height:28px;font-weight:600;margin-top:5px}
.kpi .kd{font-size:11px;color:var(--fg3);margin-top:2px}
.kpi .kd.up{color:var(--success)} .kpi .kd.down{color:var(--destructive)} .kpi .kd.warn{color:var(--warning)}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:12px}
.panel > .ph{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.panel > .ph h4{font-size:12.5px;font-weight:600}
.panel > .ph .right{margin-left:auto;display:flex;gap:4px}
.bars{display:flex;align-items:flex-end;gap:9px;height:120px;padding:0 2px}
.bars .bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.bars .b{width:100%;max-width:34px;background:var(--primary);border-radius:4px 4px 0 0;opacity:.85;transition:opacity .12s}
.bars .bcol:hover .b{opacity:1}
.bars .bl{font-size:10.5px;color:var(--fg3)}
.hbars{display:flex;flex-direction:column;gap:9px}
.hbar{display:flex;align-items:center;gap:9px;font-size:12px}
.hbar .hn{width:132px;flex:none;color:var(--fg2);display:flex;align-items:center;gap:6px;overflow:hidden;white-space:nowrap}
.hbar .ht{flex:1;height:8px;border-radius:4px;background:var(--p-track);overflow:hidden}
.hbar .ht > i{display:block;height:100%;border-radius:4px;background:var(--primary)}
.hbar .hv{width:56px;flex:none;text-align:right;color:var(--fg2)}
.legend{display:flex;gap:14px;font-size:11px;color:var(--fg3);margin-top:10px}
.legend .lg{display:inline-flex;align-items:center;gap:5px}
.legend .sw{width:8px;height:8px;border-radius:2px}
.overdue-list{display:flex;flex-direction:column;gap:1px}
.overdue-row{display:flex;align-items:center;gap:9px;padding:7px 6px;border-radius:6px;font-size:12.5px;cursor:pointer}
.overdue-row:hover{background:var(--row-hover)}
.overdue-row .tt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.overdue-row .days{font-size:11px;color:var(--destructive);flex:none}
.scrollcol{flex:1;min-height:0;overflow:auto}

/* ---------------- 工作日志 ---------------- */
.logs{display:grid;grid-template-columns:1fr 264px;gap:12px;flex:1;min-height:0}
.logmain{background:var(--surface);border:1px solid var(--border);border-radius:8px;display:flex;flex-direction:column;min-height:0}
.loghead{min-height:44px;flex:none;display:flex;align-items:center;gap:8px;padding:6px 12px;border-bottom:1px solid var(--hairline);flex-wrap:wrap}
.loghead .d{font-size:13px;font-weight:600}
.loghead .w{font-size:11.5px;color:var(--fg3)}
.loghead .right{margin-left:auto;display:flex;gap:6px}
.logbody{flex:1;min-height:0;overflow:auto;padding:12px 16px;font-size:13px;line-height:20px;color:var(--fg2)}
.logbody h5{font-size:12.5px;color:var(--fg);font-weight:600;margin:12px 0 5px}
.logbody h5:first-child{margin-top:0}
.logbody ul{margin-left:18px}
.logbody li{font-size:12.5px;line-height:19px;margin-bottom:2px}
.logbody li::marker{color:var(--primary)}
.logbody b{color:var(--fg)}
.logbody code{font-size:11.5px;background:var(--surface2);padding:1px 4px;border-radius:3px}
.logtag{display:inline-flex;align-items:center;gap:4px;font-size:11px;background:var(--surface2);
  border:1px solid var(--border);border-radius:4px;padding:1px 6px;color:var(--fg2)}
.logside{background:var(--surface);border:1px solid var(--border);border-radius:8px;display:flex;flex-direction:column;min-height:0}
.logside .sh{height:34px;flex:none;display:flex;align-items:center;gap:6px;padding:0 11px;border-bottom:1px solid var(--hairline);
  font-size:11.5px;font-weight:600;color:var(--fg2)}
.logside .list{flex:1;overflow:auto;padding:8px 9px}
.logitem{padding:7px 8px;border-radius:6px;cursor:pointer}
.logitem:hover{background:var(--row-hover)}
.logitem.on{background:var(--nav-selected)}
.logitem .ld{font-size:12px;font-weight:500;display:flex;align-items:center;gap:6px}
.logitem .lp{font-size:11px;color:var(--fg3);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aigen{display:flex;align-items:center;gap:8px;margin:0 0 10px;padding:8px 10px;border-radius:8px;
  background:var(--accent-tint);border:1px solid color-mix(in srgb,var(--primary) 35%,transparent);font-size:12px;color:var(--accent-text)}
.aigen .sp{flex:1}
.aigen .prog{height:3px;border-radius:2px;background:var(--p-track);overflow:hidden;width:120px;flex:none}
.aigen .prog i{display:block;height:100%;background:var(--primary);width:0;transition:width .3s linear}

/* ---------------- 右栏 ---------------- */
.rbar{width:300px;flex:none;background:var(--chrome);border-left:1px solid var(--hairline);
  display:flex;flex-direction:column;min-height:0}
.rhead{min-height:44px;flex:none;display:flex;align-items:center;gap:6px;padding:0 12px;border-bottom:1px solid var(--hairline)}
.rhead h3{font-size:11.5px;font-weight:600;letter-spacing:.03em;color:var(--fg2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rhead .acts{margin-left:auto;display:flex;gap:2px;flex:none}
.rbody{flex:1;min-height:0;overflow:auto;padding:12px}
.rsec{padding:12px 0;border-top:1px solid var(--hairline)}
.rsec:first-child{border-top:none;padding-top:0}
.rsec > .sh{font-size:10.5px;font-weight:600;color:var(--fg2);letter-spacing:.04em;margin-bottom:8px;
  display:flex;align-items:center;gap:6px}
.rsec > .sh .ic{width:12px;height:12px}
.rtitle{font-size:15px;line-height:20px;font-weight:600;margin:6px 0 4px;cursor:text}
.rstatline{display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap}
.orow{min-height:28px;display:flex;align-items:center;gap:8px;padding:3px 0;font-size:12.5px}
.orow .olabel{width:70px;flex:none;color:var(--fg2);font-size:11.5px}
.orow .oval{flex:1;min-width:0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.vbtn{height:22px;padding:0 7px;border-radius:5px;border:1px solid var(--border);background:var(--surface);
  color:var(--fg);font-size:11.5px;font-family:inherit;display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.vbtn:hover{border-color:var(--primary)}
.vbtn .ic{width:12px;height:12px;color:var(--fg2)}
.ms{display:flex;gap:9px;padding:6px 0}
.ms .mks{width:9px;height:9px;border-radius:50%;border:2px solid var(--primary);flex:none;margin-top:4px;position:relative}
.ms .mks.reached{background:var(--success);border-color:var(--success)}
.ms .mks::before{content:"";position:absolute;left:1px;top:12px;width:1px;height:calc(100% + 8px);background:var(--hairline)}
.ms:last-child .mks::before{display:none}
.ms .mkb{flex:1;min-width:0}
.ms .mkt{font-size:12.5px;line-height:17px}
.ms .mkm{font-size:11px;color:var(--fg3);margin-top:2px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.subtask{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12.5px}
.cbx{width:15px;height:15px;border-radius:4px;border:1px solid var(--border);background:var(--surface);flex:none;
  display:inline-flex;align-items:center;justify-content:center;color:transparent;cursor:pointer}
.cbx.on{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
.cbx .ic{width:11px;height:11px}
.subtask .stx{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subtask.done .stx{text-decoration:line-through;color:var(--fg3)}
.note-md{font-size:12.5px;line-height:19px;color:var(--fg2)}
.note-md code{font-size:11.5px;background:var(--surface2);padding:1px 4px;border-radius:3px}
.note-md p + p{margin-top:6px}
.rfoot{flex:none;display:flex;gap:6px;padding:10px 12px;border-top:1px solid var(--hairline)}
.rfoot .btn{flex:1;justify-content:center}
.r-empty{padding:32px 14px;text-align:center;color:var(--fg3);font-size:12.5px;line-height:19px}
.r-empty .big{width:40px;height:40px;margin:0 auto 10px;border-radius:11px;background:var(--surface2);
  display:flex;align-items:center;justify-content:center;color:var(--fg3)}
.r-empty .big .ic{width:20px;height:20px}
.r-empty b{display:block;color:var(--fg2);font-size:13px;margin-bottom:4px}

/* ---------------- 对话框层 ---------------- */
.layer{position:absolute;inset:0;z-index:60;pointer-events:none}
.layer > *{pointer-events:auto}
.scrim{position:absolute;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;
  animation:fade .12s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(6px)}to{opacity:1;transform:none}}
.modal{width:min(940px,calc(100% - 56px));max-height:min(90%,780px);background:var(--surface);
  border:1px solid var(--border);border-radius:12px;box-shadow:var(--win-shadow);display:flex;flex-direction:column;
  overflow:hidden;animation:pop .14s ease}
.modal.sm{width:min(480px,calc(100% - 56px))}
.modal.md{width:min(620px,calc(100% - 56px))}
.modal.lg{width:min(1080px,calc(100% - 56px))}
.mtitle{min-height:46px;flex:none;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid var(--hairline)}
.mtitle h3{font-size:15px;font-weight:600}
.mtitle .x{margin-left:auto;width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  color:var(--fg2);cursor:pointer;flex:none}
.mtitle .x:hover{background:var(--row-hover);color:var(--fg)}
.mbody{flex:1;min-height:0;overflow:auto;padding:14px 16px}
.mbody.two{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(300px,.88fr);gap:22px}
.mcol > .sh{font-size:10.5px;font-weight:600;color:var(--fg2);letter-spacing:.04em;
  display:flex;align-items:center;gap:6px;margin-bottom:10px}
.mcol > .sh .ic{width:13px;height:13px}
.mcol + .mcol{border-left:1px solid var(--hairline);padding-left:22px;margin-left:-4px}
.field{margin-bottom:12px}
.field:last-child{margin-bottom:0}
.field .fl{font-size:11.5px;color:var(--fg2);margin-bottom:5px;display:flex;align-items:center;gap:6px}
.field .fl .req{color:var(--destructive)}
.field .fl .hint{margin-left:auto;color:var(--fg3);font-size:10.5px;font-weight:400}
.inp{width:100%;height:30px;border-radius:6px;border:1px solid var(--border);background:var(--surface);
  color:var(--fg);font-family:inherit;font-size:13px;padding:0 9px;display:flex;align-items:center;gap:6px;cursor:pointer}
.inp:hover{border-color:color-mix(in srgb,var(--primary) 55%,var(--border))}
.inp.ph{color:var(--fg3)}
input.inp{cursor:text;outline:none}
input.inp:focus,textarea.ta:focus{border-color:var(--primary);box-shadow:0 0 0 2px var(--accent-tint)}
textarea.ta{width:100%;min-height:88px;border-radius:6px;border:1px solid var(--border);background:var(--surface);
  color:var(--fg);font-family:inherit;font-size:13px;line-height:19px;padding:8px 9px;outline:none;resize:vertical}
.aibar{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.aibtn{height:22px;padding:0 8px;border-radius:5px;border:1px solid var(--border);background:var(--surface);
  color:var(--fg2);font-size:11.5px;font-family:inherit;display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.aibtn .ic{width:12px;height:12px}
.aibtn:hover{border-color:var(--primary);color:var(--accent-text)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qgrid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.qopt{border:1px solid var(--border);border-radius:6px;padding:6px 8px;cursor:pointer;background:var(--surface)}
.qopt:hover{border-color:color-mix(in srgb,var(--primary) 55%,var(--border))}
.qopt.on{border-color:var(--primary);background:var(--accent-tint)}
.qopt .qt{font-size:11.5px;font-weight:600;display:flex;align-items:center;gap:5px}
.qopt .qs{font-size:10.5px;color:var(--fg3);margin-top:2px;line-height:14px}
.qopt .qdot{width:8px;height:8px;border-radius:50%;flex:none}
.tagpick{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:30px;border:1px solid var(--border);
  border-radius:6px;padding:4px 6px;background:var(--surface)}
.tagpick .tg{height:20px;padding:0 6px;border-radius:4px;background:var(--accent-tint);color:var(--accent-text);
  font-size:11px;display:inline-flex;align-items:center;gap:5px}
.tagpick .tg .x{cursor:pointer;opacity:.65;width:10px;height:10px}
.tagpick .tg .x:hover{opacity:1}
.tagpick .addtas{font-size:11px;color:var(--fg3);cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.tagpick .addtas:hover{color:var(--accent-text)}
.mfoot{flex:none;min-height:52px;display:flex;align-items:center;gap:8px;padding:8px 16px;border-top:1px solid var(--hairline);background:var(--chrome)}
.mfoot .hint{font-size:11.5px;color:var(--fg3)}
.mfoot .right{margin-left:auto;display:flex;gap:8px}
.mlist{border:1px solid var(--border);border-radius:8px;overflow:hidden}
.mlistrow{display:flex;align-items:center;gap:9px;padding:8px 10px;border-bottom:1px solid var(--hairline);font-size:12.5px}
.mlistrow:last-child{border-bottom:none}
.mlistrow:hover{background:var(--row-hover)}
.mlistrow .grip{color:var(--fg3);cursor:grab;display:flex}
.mlistrow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mlistrow .num{color:var(--fg3);font-size:11.5px}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:24px;height:24px;border-radius:6px;cursor:pointer;border:2px solid transparent;position:relative}
.sw.on{border-color:var(--fg);box-shadow:inset 0 0 0 2px var(--surface)}
.segfull{display:flex;gap:2px;background:var(--surface2);border-radius:6px;padding:2px;margin-bottom:12px;width:fit-content}
.segfull .sg{height:26px;padding:0 12px;border-radius:4px;font-size:12.5px;color:var(--fg2);
  display:inline-flex;align-items:center;gap:5px;cursor:pointer;font-family:inherit;border:none;background:transparent}
.segfull .sg.on{background:var(--surface);color:var(--fg);font-weight:500;box-shadow:var(--card-shadow)}
.radio{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:6px;cursor:pointer;font-size:12.5px}
.radio:hover{background:var(--row-hover)}
.radio i{width:15px;height:15px;border-radius:50%;border:1px solid var(--border);flex:none;position:relative}
.radio.on i{border-color:var(--primary);border-width:5px}
.radio .d{color:var(--fg3);font-size:11.5px;margin-left:auto}
.switch{width:34px;height:20px;border-radius:10px;background:var(--p-track);position:relative;cursor:pointer;flex:none;transition:background .15s}
.switch.on{background:var(--primary)}
.switch i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch.on i{left:16px}
.preview{border:1px solid var(--border);border-radius:8px;background:var(--surface2);padding:10px 12px;font-size:12px;
  line-height:19px;color:var(--fg2);max-height:220px;overflow:auto}
.preview b{color:var(--fg)}

/* ---------------- 命令面板 / Spotlight ---------------- */
.palette{width:min(620px,calc(100% - 56px));background:var(--surface);border:1px solid var(--border);border-radius:12px;
  box-shadow:var(--win-shadow);overflow:hidden;animation:pop .12s ease;margin-bottom:auto;margin-top:8vh}
.pinput{height:48px;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--hairline)}
.pinput input{flex:1;border:none;background:transparent;font:inherit;font-size:14.5px;color:var(--fg);outline:none}
.pinput input::placeholder{color:var(--fg3)}
.plist{max-height:340px;overflow:auto;padding:6px}
.pitem{height:34px;border-radius:6px;display:flex;align-items:center;gap:9px;padding:0 9px;font-size:12.5px;cursor:pointer}
.pitem .ic{width:14px;height:14px;color:var(--fg2)}
.pitem .cat{margin-left:auto;font-size:11px;color:var(--fg3);flex:none}
.pitem kbd{font-family:inherit;font-size:10.5px;border:1px solid var(--border);border-radius:4px;padding:0 4px;
  line-height:15px;color:var(--fg3);flex:none}
.pitem.on{background:var(--accent-tint);color:var(--accent-text)}
.pitem.on .ic{color:var(--accent-text)}
.pitem.on .cat,.pitem.on kbd{color:var(--accent-text);opacity:.85}
.pempty{padding:22px;text-align:center;color:var(--fg3);font-size:12.5px}
.pfoot{border-top:1px solid var(--hairline);padding:7px 12px;display:flex;align-items:center;gap:14px;
  font-size:11px;color:var(--fg3);background:var(--chrome)}
.pfoot .k{display:inline-flex;align-items:center;gap:5px}
.pfoot kbd{font-family:inherit;font-size:10.5px;border:1px solid var(--border);border-radius:4px;
  padding:0 4px;line-height:15px;background:var(--surface);color:var(--fg3)}
.pfoot .right{margin-left:auto;display:flex;gap:8px}
.spotrow{height:48px;display:flex;align-items:center;gap:10px;padding:0 12px}
.spotrow .sfi{width:26px;height:26px;border-radius:7px;background:var(--accent-tint);color:var(--accent-text);
  display:flex;align-items:center;justify-content:center;flex:none}
.spotrow .sfi .ic{width:15px;height:15px}
.spotrow input{flex:1;border:none;background:transparent;font:inherit;font-size:14.5px;color:var(--fg);outline:none}
.spotrow input::placeholder{color:var(--fg3)}
.sres{border-top:1px solid var(--hairline);padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px;min-height:42px}
.sres .rl{font-size:11px;color:var(--fg3);align-self:center;flex:none}
.rc{height:22px;padding:0 8px;border-radius:11px;background:var(--surface2);border:1px solid var(--border);
  font-size:11.5px;display:inline-flex;align-items:center;gap:5px;color:var(--fg)}
.rc .k{color:var(--fg3)}
.rc .x{cursor:pointer;opacity:.6;width:10px;height:10px}
.rc .x:hover{opacity:1}
.rc.ai{background:var(--accent-tint);border-color:var(--primary);color:var(--accent-text);cursor:pointer}
.spotfull{border-top:1px solid var(--hairline);padding:10px 12px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px 14px;
  font-size:11.5px;color:var(--fg3)}
.spotfull .fv{color:var(--fg2);font-size:12px;margin-top:2px}

/* ---------------- Toast / 右键菜单 ---------------- */
.toasts{position:absolute;left:50%;transform:translateX(-50%);bottom:44px;z-index:90;display:flex;
  flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{min-width:260px;max-width:520px;background:var(--surface);border:1px solid var(--border);border-radius:8px;
  box-shadow:var(--win-shadow);padding:9px 12px;display:flex;align-items:center;gap:10px;font-size:12.5px;
  pointer-events:auto;animation:pop .14s ease}
.toast .ticon{width:20px;height:20px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex:none}
.toast .ticon.ok{background:color-mix(in srgb,var(--success) 16%,transparent);color:var(--success)}
.toast .ticon.err{background:color-mix(in srgb,var(--destructive) 16%,transparent);color:var(--destructive)}
.toast .ticon.info{background:var(--accent-tint);color:var(--accent-text)}
.toast .ticon .ic{width:12px;height:12px}
.toast .tm{flex:1}
.toast .ta{color:var(--accent-text);cursor:pointer;font-weight:500;flex:none}
.ctx{position:absolute;z-index:95;min-width:196px;background:var(--surface);border:1px solid var(--border);
  border-radius:8px;box-shadow:var(--win-shadow);padding:4px;animation:pop .1s ease}
.ctx .ci{height:28px;border-radius:5px;display:flex;align-items:center;gap:8px;padding:0 8px;font-size:12.5px;cursor:pointer;
  white-space:nowrap}
.ctx .ci:hover{background:var(--row-hover)}
.ctx .ci .ic{width:13px;height:13px;color:var(--fg2)}
.ctx .ci.danger{color:var(--destructive)}
.ctx .ci.danger .ic{color:var(--destructive)}
.ctx .ci .sc{margin-left:auto;font-size:11px;color:var(--fg3)}
.ctx .sep{height:1px;background:var(--hairline);margin:4px 6px}
.ctx .ct{font-size:10.5px;color:var(--fg3);padding:5px 8px 3px;letter-spacing:.04em}
.ctx .swrow{display:flex;gap:6px;padding:5px 8px}

/* ---------------- 底部评审区 ---------------- */
.foot{width:min(1440px,100%);flex:none;font-size:12px;color:var(--fg2);display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.foot .k{display:inline-flex;align-items:center;gap:5px}
.foot b{color:var(--fg)}
.hint-inline{font-size:11.5px;color:var(--fg3)}
</style>

function inSmart(t, k){
  if (k === 'unscheduled') return !t.due && t.status !== 'done';
  if (k === 'overdue') return overdueDays(t) > 0;
  var d = t.due; if (!d) return false;
  if (k === 'today') return d === iso(TODAY);
  if (k === 'week'){ var a = iso(startOfWeek(TODAY)), b = iso(addDays(startOfWeek(TODAY), 6)); return d >= a && d <= b; }
  return true;
}
function baseFilter(){
  return DATA.tasks.filter(function(t){
    if (!S.showDone && t.status === 'done') return false;
    if (S.filterProject && t.project !== S.filterProject) return false;
    if (S.filterSmart && !inSmart(t, S.filterSmart)) return false;
    if (S.search){
      var q = S.search.toLowerCase();
      var hay = (t.title + ' ' + (t.desc || '') + ' ' + t.tags.join(' ') + ' ' + (proj(t.project) ? proj(t.project).name : '')).toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  });
}
function sortTasks(list){
  var s = S.sort;
  return list.slice().sort(function(a, b){
    if (!!a.starred !== !!b.starred) return a.starred ? -1 : 1;
    if (s === 'priority') return PRANK[a.priority] - PRANK[b.priority] || ((a.due || '9999') < (b.due || '9999') ? -1 : 1);
    if (s === 'progress') return b.prog - a.prog;
    if (s === 'title') return a.title.localeCompare(b.title, 'zh');
    var ad = a.due || '9999-99-99', bd = b.due || '9999-99-99';
    return ad < bd ? -1 : ad > bd ? 1 : PRANK[a.priority] - PRANK[b.priority];
  });
}
function viewTasks(){ return sortTasks(baseFilter()); }
function projStat(pid){
  var ts = DATA.tasks.filter(function(t){ return t.project === pid; });
  var done = ts.filter(function(t){ return t.status === 'done'; }).length;
  return { all: ts.length, done: done, open: ts.length - done };
}
function counts(){
  var all = DATA.tasks.length;
  var done = DATA.tasks.filter(function(t){ return t.status === 'done'; }).length;
  var over = DATA.tasks.filter(function(t){ return overdueDays(t) > 0; }).length;
  return { all: all, done: done, open: all - done, over: over };
}
function esc(s){ return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function md(s){
  return esc(s || '')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .split(/\n{2,}/).map(function(p){
      var lines = p.split('\n');
      if (lines.every(function(l){ return /^\s*[-*]\s+/.test(l); }))
        return '<ul>' + lines.map(function(l){ return '<li>' + l.replace(/^\s*[-*]\s+/, '') + '</li>'; }).join('') + '</ul>';
      if (/^##\s/.test(lines[0])) return '<h5>' + lines[0].replace(/^#+\s*/, '') + '</h5>' + (lines.length > 1 ? '<p>' + lines.slice(1).join('<br>') + '</p>' : '');
      return '<p>' + lines.join('<br>') + '</p>';
    }).join('');
}
function progressTone(p){ return p >= 80 ? 'p-hi' : p >= 40 ? 'p-mid' : p > 0 ? 'p-low' : 'p-none'; }
function dueLabel(t){
  if (!t.due) return { txt: '未排期', cls: '' };
  var n = diffDays(iso(TODAY), t.due);
  if (t.status === 'done') return { txt: fmtMMDD(parseD(t.due)) + ' 完成', cls: '' };
  if (n < 0) return { txt: '逾期 ' + (-n) + ' 天', cls: 'warn' };
  if (n === 0) return { txt: '今天到期', cls: 'soon' };
  if (n === 1) return { txt: '明天到期', cls: 'soon' };
  return { txt: fmtMMDD(parseD(t.due)), cls: '' };
}
function uid(p){ return p + Math.random().toString(36).slice(2, 7); }

function vCal(){
  var y = S.calY, m = S.calM;
  var first = d0(y, m, 1);
  var start = startOfWeek(first);
  var monthLabel = y + ' 年 ' + (m + 1) + ' 月';
  var html = '<div style="flex:1;min-height:0;display:flex;flex-direction:column">';
  html += '<div class="calhead"><button class="btn sm" data-cal="prev">' + I('chev-left', 12) + '</button>' +
    '<button class="btn sm" data-cal="next">' + I('chev', 12) + '</button>' +
    '<button class="btn sm" data-cal="today">今天</button>' +
    '<span class="m">' + monthLabel + '</span>' +
    '<span class="sub">按截止日归位 · 已完成按完成日归位 · 无日期任务不显示</span>' +
    '<span class="right"><span class="chip on">月</span><span class="chip" title="本稿未展开周视图" data-noop="1">周</span>' +
    '<span class="chip" data-side="new-project">' + I('folder', 12) + '按项目筛选</span></span></div>';
  html += '<div class="cgridwrap"><div class="wdrow">' + WD.map(function(w, i){
    return '<div' + (i >= 5 ? ' class="we"' : '') + '>' + w + '</div>';
  }).join('') + '</div><div class="cgrid">';
  var byDay = {};
  DATA.tasks.forEach(function(t){
    if (S.filterProject && t.project !== S.filterProject) return;
    if (S.filterSmart && !inSmart(t, S.filterSmart)) return;
    var d = dayOf(t); if (!d) return;
    (byDay[d] = byDay[d] || []).push(t);
  });
  for (var i = 0; i < 42; i++){
    var d = addDays(start, i), k = iso(d);
    var other = d.getMonth() !== m;
    var ts = (byDay[k] || []).sort(function(a, b){ return PRANK[a.priority] - PRANK[b.priority]; });
    html += '<div class="ccell' + (other ? ' other' : '') + (sameDay(d, TODAY) ? ' today' : '') + (S.selectedDay === k ? ' sel' : '') + '" data-day="' + k + '">';
    html += '<div class="cnum">' + d.getDate() + (ts.length ? '<span class="badge num">' + ts.length + '</span>' : '') + '</div>';
    ts.slice(0, 2).forEach(function(t){
      html += '<div class="ctask' + (t.status === 'done' ? ' done' : '') + (overdueDays(t) > 0 ? ' hi' : '') + '" data-task-jump="' + t.id + '">' +
        '<span class="pdot ' + t.priority + '"></span>' + esc(t.title) + '</div>';
    });
    if (ts.length > 2) html += '<div class="cmore">+' + (ts.length - 2) + ' 更多</div>';
    html += '</div>';
  }
  html += '</div></div></div>';
  return html;
}

/* ==========================================================================
   9 · 视图：时间线
   ========================================================================== */
function vTimeline(){
  var winStart = addDays(startOfWeek(TODAY), -7);
  var N = 28;
  var days = []; for (var i = 0; i < N; i++) days.push(addDays(winStart, i));
  var rows = viewTasks().filter(function(t){ return t.start || t.due; }).slice(0, 16);
  var html = '<div class="tlwrap"><div class="tlhead"><div class="c0">任务 · 近 4 周</div><div class="track" style="grid-template-columns:repeat(' + N + ',1fr)">' +
    days.map(function(d){
      var mo = wdOf(d) === 0;
      return '<div class="' + (isWeekend(d) ? 'we ' : '') + (mo ? 'mo' : '') + '" title="' + iso(d) + '">' +
        (mo ? (d.getMonth() + 1) + '/' + d.getDate() : d.getDate()) + '</div>';
    }).join('') + '</div></div>';
  html += '<div class="tllegend">' +
    '<span class="lg"><i class="sw" style="background:var(--primary)"></i>有起止日期的任务</span>' +
    '<span class="lg"><i class="sw dm" style="background:var(--primary)"></i>仅截止日（里程碑式）</span>' +
    '<span class="lg"><i class="sw" style="background:var(--destructive)"></i>逾期</span>' +
    '<span class="lg"><i class="sw" style="background:var(--success)"></i>已完成</span>' +
    '<span class="lg"><i class="sw" style="background:var(--warning)"></i>阻塞</span>' +
    '<span class="lg" style="margin-left:auto">红线 = 今天（10-14）</span></div>';
  html += '<div class="tlbody">';
  if (!rows.length) html += '<div class="empty"><b>没有带日期的任务</b>时间线只展示有开始或截止日期的任务。</div>';
  rows.forEach(function(t){
    var s = parseD(t.start || t.due), e = parseD(t.due || t.start);
    var i0 = Math.round((s - winStart) / 86400000), i1 = Math.round((e - winStart) / 86400000);
    if (i0 > N || i1 < 0) return;
    var cls = t.status === 'done' ? 'done' : overdueDays(t) > 0 ? 'over' : t.status === 'blocked' ? 'blocked' : '';
    var p = proj(t.project);
    var cell = '<div class="track" style="grid-template-columns:repeat(' + N + ',1fr)">' +
      days.map(function(d){ return '<div class="vline ' + (isWeekend(d) ? 'we' : '') + '"></div>'; }).join('');
    if (t.start && t.due && t.due !== t.start){
      var span = Math.min(N - 1, i1) - Math.max(0, i0) + 1;
      var left = Math.max(0, i0) / N * 100, w = Math.max(span * 100 / N, 3.2);
      cell += '<div class="bar ' + cls + '" style="left:' + left + '%;width:' + w + '%" title="' + esc(t.title) + ' · ' +
        t.start + ' → ' + t.due + ' · ' + t.prog + '%">' + (span >= 3 ? t.prog + '%' : '') + '</div>';
    } else {
      cell += '<div class="dmark ' + cls + '" style="left:' + ((i1 + 0.5) / N * 100) + '%" title="' +
        esc(t.title) + ' · 截止 ' + (t.due || t.start) + '"></div>';
    }
    html += '<div class="tlrow" data-card="' + t.id + '"><div class="c0">' +
      '<span class="pdot" style="background:' + (p ? p.color : 'var(--fg3)') + '"></span>' +
      '<span class="tt">' + esc(t.title) + '</span></div>' + cell +
      '<div class="todayline" style="left:' + ((Math.round((TODAY - winStart) / 86400000) + 0.5) / N * 100) + '%"></div>' +
      '</div></div>';
  });
  html += '</div></div>';
  return html;
}

function vReport(){

  var avgProg = Math.round(all.filter(function(t){ return t.status !== 'done'; }).reduce(function(a, t){ return a + t.prog; }, 0) / Math.max(1, all.filter(function(t){ return t.status !== 'done'; }).length));

  html += '<div class="kpi"><div class="kl">' + I('play') + '进行中</div><div class="kv num">' + doing.length + '</div><div class="kd ' + (doing.length > 5 ? 'warn' : '') + '">WIP 上限 5 · ' + (doing.length > 5 ? '超 ' + (doing.length - 5) + ' 个' : '未超限') + '</div></div>';

  html += '<div class="kpi"><div class="kl">' + I('alert') + '逾期</div><div class="kv num" style="color:var(--destructive)">' + over.length + '</div><div class="kd down">最久逾期 ' + Math.max.apply(null, [0].concat(over.map(function(t){ return overdueDays(t); }))) + ' 天</div></div>';
  html += '</div>';

  html += '<div class="panel"><div class="ph"><h4>近 7 天完成趋势</h4><span class="right hint-inline">口径：按完成日计</span></div><div class="bars">';
  var maxN = 1;
  var series = [];
  for (var i = 6; i >= 0; i--){
    var d = addDays(TODAY, -i), k = iso(d);
    var n = done.filter(function(t){ return t.doneAt === k; }).length;
    series.push({ k: k, n: n, d: d }); if (n > maxN) maxN = n;
  }
  series.forEach(function(s){
    html += '<div class="bcol" title="' + s.k + ' 完成 ' + s.n + ' 个"><b class="num" style="font-size:11px;color:var(--fg2)">' + (s.n || '') + '</b>' +
      '<div class="b" style="height:' + Math.max(4, s.n / maxN * 100) + '%"></div><div class="bl">' + fmtMMDD(s.d) + '</div></div>';
  });
  html += '</div></div>';

  html += '<div class="panel"><div class="ph"><h4>按项目分布</h4><span class="right hint-inline">完成 / 总数</span></div><div class="hbars">';
  DATA.projects.forEach(function(p){
    var st = projStat(p.id);
    var pct = st.all ? Math.round(st.done / st.all * 100) : 0;
    html += '<div class="hbar"><span class="hn"><span class="pdot" style="background:' + p.color + '"></span>' + esc(p.name) + '</span>' +
      '<span class="ht"><i style="width:' + pct + '%;background:' + p.color + '"></i></span>' +
      '<span class="hv num">' + st.done + ' / ' + st.all + '</span></div>';
  });
  var unsched = DATA.tasks.filter(function(t){ return !t.project; });
  html += '<div class="hbar"><span class="hn"><span class="pdot" style="background:var(--fg3)"></span>未归入项目</span>' +
    '<span class="ht"><i style="width:' + (unsched.filter(function(t){ return t.status === 'done'; }).length / Math.max(1, unsched.length) * 100) + '%;background:var(--fg3)"></i></span>' +
    '<span class="hv num">' + unsched.filter(function(t){ return t.status === 'done'; }).length + ' / ' + unsched.length + '</span></div>';
  html += '</div><div class="legend"><span class="lg">平均进度（未完成项）<b class="num">' + avgProg + '%</b></span>' +
    '<span class="lg">' + I('info', 12) + ' 口径直接由任务表聚合，不额外落统计表</span></div></div>';

  html += '<div class="panel"><div class="ph"><h4>逾期清单</h4><span class="right hint-inline">' + over.length + ' 项</span></div><div class="overdue-list">';
  if (!over.length) html += '<div class="empty" style="padding:16px">' + I('check-circle', 16) + ' <span style="margin-left:6px">当前没有逾期任务</span></div>';
  over.sort(function(a, b){ return overdueDays(b) - overdueDays(a); }).forEach(function(t){
    var p = proj(t.project);
    html += '<div class="overdue-row" data-card="' + t.id + '"><span class="pdot ' + t.priority + '"></span>' +
      '<span class="pdot" style="background:' + (p ? p.color : 'var(--fg3)') + '"></span>' +
      '<span class="tt">' + esc(t.title) + '</span>' +
      (t.status === 'blocked' ? '<span class="blocked-tag">阻塞</span>' : '') +
      '<span class="days num">逾期 ' + overdueDays(t) + ' 天</span></div>';
  });
  html += '</div></div>';
  html += '</div>';
  return html;
}

var STACK = [];
function openModal(o){
  var inner = o.box || (
    '<div class="mtitle">' + (o.icon ? I(o.icon, 16) : '') + '<h3>' + (o.title || '') + '</h3>' + (o.extra || '') +
      '<div class="x" data-close="1" title="关闭 (Esc)">' + I('x') + '</div></div>' +
    (o.body ? '<div class="mbody' + (o.two ? ' two' : '') + '">' + o.body + '</div>' : '') +
    (o.foot ? '<div class="mfoot">' + o.foot + '</div>' : ''));
  var scrim = document.createElement('div');
  scrim.className = 'scrim';
  scrim.innerHTML = '<div class="modal ' + (o.cls || '') + '" role="dialog">' + inner + '</div>';
  $id('layer').appendChild(scrim);
  var entry = { el: scrim, close: function(){
    if (scrim.parentNode) scrim.parentNode.removeChild(scrim);
    var i = STACK.indexOf(entry); if (i >= 0) STACK.splice(i, 1);
    if (o.onClose) o.onClose();
  }};
  STACK.push(entry);
  scrim.addEventListener('mousedown', function(e){ if (e.target === scrim) entry.close(); });
  Array.prototype.forEach.call(scrim.querySelectorAll('[data-close]'), function(b){ b.addEventListener('click', entry.close); });
  if (o.mount) o.mount(scrim.querySelector('.modal'), entry.close);
  var f = scrim.querySelector('input,textarea');
  if (f && o.autofocus !== false) setTimeout(function(){ f.focus(); if (f.select) f.select(); }, 30);
  return entry;
}
function closeTop(){ if (!STACK.length) return false; STACK[STACK.length - 1].close(); return true; }
function closeAllModals(){ STACK.slice().forEach(function(e){ e.close(); }); }

var CTX = null;
function closeMenu(){ if (CTX && CTX.parentNode) CTX.parentNode.removeChild(CTX); CTX = null; }
function popMenu(anchor, items){
  closeMenu();
  var m = document.createElement('div');
  m.className = 'ctx';
  m.innerHTML = items.map(function(it, i){
    if (it.sep) return '<div class="sep"></div>';
    if (it.title) return '<div class="ct">' + esc(it.title) + '</div>';
    if (it.swatches) return '<div class="swrow">' + it.swatches.map(function(s){
      return '<span class="sw" data-mi="' + i + '" data-sw="' + s.v + '" title="' + s.v + '" style="background:' + s.c + ';' + (s.on ? 'border-color:var(--fg)' : '') + '"></span>';
    }).join('') + '</div>';
    return '<div class="ci' + (it.danger ? ' danger' : '') + '" data-mi="' + i + '">' + (it.icon ? I(it.icon, 13) : '') +
      '<span>' + esc(it.label) + '</span>' + (it.kbd ? '<span class="sc">' + it.kbd + '</span>' : '') + '</div>';
  }).join('');
  $id('win').appendChild(m);
  var r = anchor.getBoundingClientRect(), w = $id('win').getBoundingClientRect();
  var left = r.left - w.left, top = r.bottom - w.top + 4;
  if (left + m.offsetWidth > w.width - 8) left = w.width - m.offsetWidth - 8;
  if (top + m.offsetHeight > w.height - 6) top = Math.max(6, r.top - w.top - m.offsetHeight - 4);
  m.style.left = Math.max(6, left) + 'px';
  m.style.top = Math.max(6, top) + 'px';
  m.addEventListener('mousedown', function(e){ e.stopPropagation(); });
  Array.prototype.forEach.call(m.querySelectorAll('[data-mi]'), function(el){
    el.addEventListener('click', function(){
      var it = items[+el.getAttribute('data-mi')], sw = el.getAttribute('data-sw');
      var r = el.getBoundingClientRect();
      var anchor = { getBoundingClientRect: function(){ return r; } };
      closeMenu();
      if (it.fn) it.fn(sw, anchor);
    });
  });
  CTX = m;
  return m;
}
function toast(msg, o){

function parseQuick(text){
  var remain = ' ' + text + ' ', p = { tags: [], project: null, priority: null, due: '', time: '', quad: null };
  remain = remain.replace(/#([^\s#@!]+)/g, function(m, g){ if (p.tags.indexOf(g) < 0) p.tags.push(g); return ' '; });
  remain = remain.replace(/@([^\s#@!]+)/g, function(m, g){
    var hit = DATA.projects.filter(function(x){ return x.name.indexOf(g) >= 0; })[0];
    if (hit) p.project = hit.id; return ' ';
  });
  remain = remain.replace(/!\s*[pP]([0-3])/g, function(m, n){ p.priority = 'p' + n; return ' '; });
  remain = remain.replace(/(\d{1,2})[:：](\d{2})/g, function(m, hh, mm){ p.time = (hh.length < 2 ? '0' + hh : hh) + ':' + mm; return ' '; });
  var hit = null;
  ['今天', '明天', '后天', '大后天'].forEach(function(k){
    var idx = ['今天', '明天', '后天', '大后天'].indexOf(k);
    if (!hit && remain.indexOf(k) >= 0){ hit = addDays(TODAY, idx); remain = remain.replace(k, ' '); }
  });
  if (!hit){
    var m = remain.match(/(\d{1,2})[-/月](\d{1,2})/);
    if (m){ hit = d0(TODAY.getFullYear(), +m[1] - 1, +m[2]); remain = remain.replace(m[0], ' '); }
  }
  if (!hit){
    var m2 = remain.match(/(下)?周([一二三四五六日天])/);
    if (m2){
      var map = '一二三四五六日';
      var idx = m2[2] === '天' ? 6 : map.indexOf(m2[2]);
      var base = startOfWeek(TODAY);
      if (m2[1]) base = addDays(base, 7);
      hit = addDays(base, idx); remain = remain.replace(m2[0], ' ');
    }
  }
  if (hit) p.due = iso(hit);
  p.title = remain.replace(/\s+/g, ' ').trim();
  return p;
}

      }

        else if (e.key === 'Tab' && !e.shiftKey){

          var m = l.match(/^[-*+]\s*\[([ xX])\]\s*(.*)$/) || l.match(/^[-*+]\s+(.*)$/);

      ta.addEventListener('input', paint);
      el.querySelector('#im-sample').addEventListener('click', function(){ ta.value = IMPORT_SAMPLE; paint(); });
      el.querySelector('#im-clear').addEventListener('click', function(){ ta.value = ''; paint(); ta.focus(); });
      el.querySelector('#im-ok').addEventListener('click', function(){
        var rs = rows();
        if (!rs.length){ toast('没有可导入的行', { type: 'err' }); return; }
        rs.forEach(function(r){
          DATA.tasks.unshift({ id: uid('t'), title: r.title, project: r.project, status: r.done ? 'done' : 'todo',
            priority: r.priority || 'p2', quad: r.done ? 'q3' : 'q3', tags: r.tags.slice(), start: '', due: r.due || '',
            est: 0, act: 0, prog: r.done ? 100 : 0, desc: '', note: '', subs: [], miles: [],

          DATA.tasks.splice(0, rs.length); renderAll(); toast('已撤销导入', { type: 'info' });
        } } });
      });
      paint();
    }
  });
}
function exportText(scope, fmt){
  var list = scope === 'all' ? DATA.tasks : viewTasks();
  if (fmt === 'markdown'){
    return '# 任务导出 · ' + iso(TODAY) + '\n\n' + list.map(function(t){
      return '- [' + (t.status === 'done' ? 'x' : ' ') + '] ' + t.title +
        ' `' + t.priority.toUpperCase() + '`' +
        (proj(t.project) ? ' @' + proj(t.project).name : '') +
        t.tags.map(function(g){ return ' #' + g; }).join('') +
        (t.due ? ' ' + t.due : '') + ' (' + t.prog + '%)';
    }).join('\n');
  }
  if (fmt === 'csv'){
    var head = 'id,title,project,status,priority,quad,tags,start,due,progress';
    return head + '\n' + list.map(function(t){
      return [t.id, '"' + t.title.replace(/"/g, '""') + '"', proj(t.project) ? proj(t.project).name : '', t.status,
        t.priority.toUpperCase(), t.quad.toUpperCase(), '"' + t.tags.join(' ') + '"', t.start || '', t.due || '', t.prog].join(',');
    }).join('\n');
  }
  return JSON.stringify({ exportedAt: iso(TODAY), count: list.length, tasks: list }, null, 2);
}

function openNotifications(){
  var over = DATA.tasks.filter(function(t){ return overdueDays(t) > 0; });
  var today = DATA.tasks.filter(function(t){ return t.status !== 'done' && t.due === iso(TODAY); });
  var doing = DATA.tasks.filter(function(t){ return t.status === 'doing'; });
  var blocked = DATA.tasks.filter(function(t){ return t.status === 'blocked'; });
  function group(title, icon, items, hint){
    if (!items.length) return '';
    return '<div class="rsec" style="padding:10px 0"><div class="sh">' + I(icon) + title + '<span style="margin-left:auto;font-weight:400;color:var(--fg3)">' + items.length + '</span></div>' +
      items.map(function(t){
        return '<div class="orow" data-card="' + t.id + '" style="cursor:pointer;padding:5px 4px;border-radius:5px">' +
          '<span class="pdot ' + t.priority + '"></span><span class="oval"><span class="v">' + esc(t.title) + '</span>' +
          '<span style="font-size:11px;color:var(--fg3)">' + hint(t) + '</span></span></div>';
      }).join('') + '</div>';
  }
  openModal({
    cls: 'md', icon: 'bell', title: '通知中心',
    body:
      group('已逾期', 'alert', over, function(t){ return '逾期 ' + overdueDays(t) + ' 天'; }) +
      group('今天到期', 'calendar-today', today, function(){ return '今天到期'; }) +
      group('阻塞中', 'pause', blocked, function(t){ return t.block || '等待外部输入'; }) +
      group('进行中 · WIP 超限', 'play', doing.length > 5 ? doing : [], function(t){ return t.prog + '%'; }) +
      (!over.length && !today.length && !blocked.length ? '<div class="empty" style="padding:26px">' + I('check-circle', 20) + '<div style="margin-top:8px">目前没有需要提醒的事项</div></div>' : ''),
    foot: '<span class="hint">通知由任务表实时派生，不落独立通知表</span><div class="right"><button class="btn primary" data-close="1">知道了</button></div>',
    mount: function(el, close){
      Array.prototype.forEach.call(el.querySelectorAll('[data-card]'), function(x){
        x.addEventListener('click', function(){
          S.selected = this.getAttribute('data-card');
          if (S.view === 'log') S.view = 'board';
          close(); renderAll();
          var c = $id('view').querySelector('[data-card="' + S.selected + '"]');
          if (c) c.classList.add('flash');
        });
      });
    }
  });
}

function applyStatus(t, to){
  var was = t.status;
  t.status = to;
  if (to === 'done'){ t.doneAt = t.doneAt || iso(TODAY); t.prog = 100; }
  else {
    if (was === 'done'){ t.doneAt = null; if (t.prog >= 100) t.prog = 90; }
    if (to === 'doing' && t.prog < 10) t.prog = 10;
  }
}

function bulk(kind, anchor){
  var ids = Object.keys(S.checked).filter(function(k){ return S.checked[k]; });
  if (!ids.length) return;
  var list = ids.map(task).filter(Boolean);
  if (kind === 'clear'){ S.checked = {}; return renderView(); }
  if (kind === 'done'){ list.forEach(function(t){ applyStatus(t, 'done'); }); S.checked = {}; renderAll(); return toast('已把 ' + list.length + ' 个任务标记为完成'); }
  if (kind === 'status'){
    popMenu(anchor, [{ title: '批量改为状态' }].concat(DATA.cols.map(function(c){
      return { label: c.name, icon: 'sliders', fn: function(){ list.forEach(function(t){ applyStatus(t, c.id); }); S.checked = {}; renderAll(); toast('已改为「' + c.name + '」'); } };
    }))); return;
  }
  if (kind === 'priority'){
    popMenu(anchor, [{ title: '批量改优先级' }].concat(['p0', 'p1', 'p2', 'p3'].map(function(p){
      return { label: PRIO[p], icon: 'flag', fn: function(){ list.forEach(function(t){ t.priority = p; }); S.checked = {}; renderAll(); toast('已改为 ' + PRIO[p]); } };
    }))); return;
  }
  if (kind === 'project'){
    popMenu(anchor, [{ title: '批量移入项目' }, { label: '未归入项目', icon: 'inbox', fn: function(){ list.forEach(function(t){ t.project = null; }); S.checked = {}; renderAll(); toast('已移出项目'); } }]
      .concat(DATA.projects.map(function(p){
        return { label: p.name, icon: 'folder', fn: function(){ list.forEach(function(t){ t.project = p.id; }); S.checked = {}; renderAll(); toast('已移入「' + p.name + '」'); } };
      }))); return;
  }
  if (kind === 'delete'){
    confirmDialog({ title: '批量删除任务', danger: true, okText: '删除 ' + list.length + ' 个',
      msg: '确认删除选中的 ' + list.length + ' 个任务？删除后可在底部提示条里撤销。',
      onOk: function(){
        var snapshot = list.map(function(t){ return { t: t, i: DATA.tasks.indexOf(t) }; })
          .sort(function(a, b){ return b.i - a.i; });
        snapshot.forEach(function(x){ DATA.tasks.splice(x.i, 1); });
        S.checked = {}; renderAll();
        toast('已删除 ' + list.length + ' 个任务', { type: 'err', action: { label: '撤销', fn: function(){
          snapshot.slice().reverse().forEach(function(x){ DATA.tasks.splice(x.i, 0, x.t); });
          renderAll(); toast('已恢复', { type: 'info' });
        } } });
      } });
  }
}
