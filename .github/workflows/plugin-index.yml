name: plugin-index

# 插件市场索引：`plugins/**` 一变就重新打包并发布到 `plugin-index` 分支。
#
# # 为什么是分支，不是 Release
#
# 应用自身的更新器吃的是 `releases/latest/download/update.json`。GitHub 的 `latest`
# 指「最近一个非预发布 Release」——插件上架只要跟着发一次 Release，就把应用的更新源
# 顶到了不含 `update.json` 的发布上，两件事一起坏。生成物分支与应用发版因此彻底隔离：
# 分支不参与任何 `latest` 判定，而 `raw.githubusercontent.com/<repo>/plugin-index/...`
# 是个恒定地址，插件上架不必改客户端一个字节。
#
# 客户端出厂默认源就是这条分支：
#   crates/duck-app/src/market.rs 的 `DEFAULT_SOURCE`
# 改分支名或改路径都要同步改它（那边有个测试钉住了形状）。
#
# # 分支是生成物
#
# `plugin-index` 上只有脚本产出，没有人工提交，所以每次**整树覆盖**（force push）：
# 逐次追加会让分支里攒下一堆对不上的旧文件，而"哪些该留"由脚本用 `--previous-dir`
# 判断（同名同版本沿用旧的、被引用过的旧包继续带着走）。
#
# # 发布后有一小段缓存窗口
#
# `raw.githubusercontent.com` 边缘缓存几分钟。客户端对索引有 6 小时 TTL，
# 所以「刚发布完别人还没看到」是正常现象，不必反复重跑工作流。
#
# # 镜像通道（可选，与 release.yml 共用同一批变量/密钥）
#
# 配好仓库变量与密钥后，索引里的 `archive.url` 会改指**镜像**、分支原址退成
# `archive.mirrors[0]`，客户端按主→备的顺序试：
#
#   变量  MIRROR_BASE_URL        CDN 的公开前缀，必须**对应 bucket 的根**
#   密钥  MIRROR_ENDPOINT        S3 兼容端点（Cloudflare R2 / 阿里云 OSS 均可）
#         MIRROR_BUCKET          目标 bucket
#         MIRROR_ACCESS_KEY_ID / MIRROR_SECRET_ACCESS_KEY
#
# 镜像同步刻意排在推分支**之前**：索引一旦上了分支，所有客户端都会先按镜像地址
# 去取包；镜像里还没有那份字节就只能靠回退到分支原址兜底。先传镜像，让「主地址
# 通不了」这种状态尽量别出现。
on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - "sbin/plugin_index.py"
      - ".github/workflows/plugin-index.yml"
  # PR 上只校验、不发布：让清单写歪在合并前就暴露出来。
  pull_request:
    paths:
      - "plugins/**"
      - "sbin/plugin_index.py"
      - ".github/workflows/plugin-index.yml"
  workflow_dispatch:

# 发布要能推分支；校验那一步只需要读。
permissions:
  contents: write

env:
  BRANCH: plugin-index
  # 索引里每个包地址的前缀，必须与分支和目录结构一致。
  BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/plugin-index
  # 留空即「没有镜像」：脚本会把 mirrors 写成空表，客户端只走上面的分支原址。
  MIRROR_BASE_URL: ${{ vars.MIRROR_BASE_URL }}

jobs:
  check:
    name: 校验插件清单
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `--check` 走的是与发布完全相同的那条路（同样会真打两遍包比对摘要），
      # 只是产物写进临时目录。所以「校验过了」就等于「发得出去」。
      - name: 校验清单与可复现性
        run: |
          set -euo pipefail
          args=(--check --base-url "${BASE_URL}")
          # 把镜像参数一起过一遍：配错了（比如写了个 http:// 前缀）在这里就该炸，
          # 而不是等发布那一步才发现。
          if [ -n "${MIRROR_BASE_URL}" ]; then
            args+=(--mirror-base "${MIRROR_BASE_URL}")
          fi
          python3 sbin/plugin_index.py "${args[@]}"

  publish:
    name: 打包并发布索引
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要能按分支名取回上一次的 packages/，所以不能是单提交浅克隆。
          fetch-depth: 0

      # 上一次发布的包有两个用途：同名同版本沿用旧文件（不重写、不产生 diff），
      # 以及把「这次索引里不再引用」的旧包原样带上——客户端可能还揣着 6 小时前的
      # 索引缓存，删掉包会让它点安装时 404。
      - name: 取回上一次发布的包
        id: previous
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "${BRANCH}" >/dev/null 2>&1; then
            # 不带 `--depth`：这条分支每次都是整树覆盖的**单提交**，没有历史可取，
            # 而浅取的提交再开 worktree 会多出一类只在 CI 上才复现的坑。
            git fetch origin "${BRANCH}"
            git worktree add --detach previous FETCH_HEAD
            echo "found=true" >> "${GITHUB_OUTPUT}"
            ls previous/packages | head -20
          else
            echo "首次发布：远端还没有 ${BRANCH} 分支，这次会创建它"
            echo "found=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: 打包并生成 plugin-index.json
        run: |
          set -euo pipefail
          args=(
            --plugins-dir plugins
            --out-dir dist/plugin-index
            --base-url "${BASE_URL}"
          )
          if [ -n "${MIRROR_BASE_URL}" ]; then
            args+=(--mirror-base "${MIRROR_BASE_URL}")
          fi
          if [ "${{ steps.previous.outputs.found }}" = "true" ]; then
            args+=(--previous-dir previous)
          fi
          python3 sbin/plugin_index.py "${args[@]}"

      # 先传镜像、后推分支：索引一旦上了分支，所有客户端都会先按镜像地址取包，
      # 镜像里还没有那份字节就只能靠回退到分支原址兜底。
      # `aws s3 sync` 不带 `--delete`：旧包只增不减，客户端手上那份 6 小时前的索引
      # 指向的包必须还在。
      - name: 同步到镜像（可选）
        if: vars.MIRROR_BASE_URL != ''
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MIRROR_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MIRROR_SECRET_ACCESS_KEY }}
          MIRROR_ENDPOINT: ${{ secrets.MIRROR_ENDPOINT }}
          MIRROR_BUCKET: ${{ secrets.MIRROR_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "${MIRROR_ENDPOINT}" ] || [ -z "${MIRROR_BUCKET}" ]; then
            echo "配了 MIRROR_BASE_URL 但缺 MIRROR_ENDPOINT / MIRROR_BUCKET，跳过同步" >&2
            exit 0
          fi
          aws s3 sync dist/plugin-index/packages/ \
            "s3://${MIRROR_BUCKET}/packages/" \
            --endpoint-url "${MIRROR_ENDPOINT}"
          # 索引也放一份在 bucket 根上：想把「市场源」整个指到镜像的客户端
          # 用 ${MIRROR_BASE_URL}/plugin-index.json 即可。
          aws s3 cp dist/plugin-index/plugin-index.json \
            "s3://${MIRROR_BUCKET}/plugin-index.json" \
            --endpoint-url "${MIRROR_ENDPOINT}"

      - name: 发布到 ${BRANCH} 分支
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist/plugin-index
          # 在产物目录里起一个独立仓库：不必把生成物混进应用的工作树，
          # 也就不可能顺手把源码一起推上这条分支。
          git init -q .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b "${BRANCH}"
          git add -A
          git commit -q -m "plugin-index: $(date -u +%Y-%m-%dT%H:%M:%SZ) ${GITHUB_SHA::8}"
          git push --force \
            "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${BRANCH}"

      - name: 汇总
        run: |
          set -euo pipefail
          {
            echo "### 插件索引已发布"
            echo
            echo '```json'
            cat dist/plugin-index/plugin-index.json
            echo '```'
            echo
            echo "分支：\`${BRANCH}\`"
            if [ -n "${MIRROR_BASE_URL}" ]; then
              echo "包地址：主 \`${MIRROR_BASE_URL}/packages/\`　备用 \`${BASE_URL}/packages/\`"
              echo "镜像源：\`${MIRROR_BASE_URL}/plugin-index.json\`"
            else
              echo "包地址：\`${BASE_URL}/packages/\`（未配置镜像）"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
